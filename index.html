/* =============== ui3d/cena3d.js =============== */
// ui3d/cena3d.js — a mesa em três dimensões, dirigida pelo estado do motor.
// Este módulo não conhece regra nenhuma: recebe o estado, desenha, e avisa
// quando o jogador clica num espaço de sala. Usa o THREE global (r128, UMD).
//
// Tudo fica dentro de um objeto só (CENA3D) para o empacotador não colidir
// nomes com a interface 2D, que também é concatenada no mesmo arquivo.

const CENA3D = (() => {
  const S = {};   // estado interno da cena

  /* ---------------------------------------------------------------- medidas
   * O tabuleiro central tem 60 × 40 cm; a mesa do advogado, 30 × 20. As
   * coordenadas abaixo vêm dos gabaritos da gráfica (mm) e são convertidas
   * para cm no espaço da cena. */
  const P = (mmx, mmy) => [(mmx - 3) / 10 - 30, (mmy - 3) / 10 - 20];   // tabuleiro (3 mm de sangria)
  const M = (mmx, mmy) => [mmx / 10 - 15, mmy / 10 - 10];               // mesa do advogado
  const SALAS_XY = {
    biblioteca: { cy: 57.5, cx: [159.5, 188.5, 217.5, 246.5, 275.5] },
    recepcao: { cy: 119.5, cx: [188.5, 217.5, 246.5, 275.5] },
    cafezinho: { cy: 179.5, cx: [159.5, 188.5, 217.5, 246.5, 275.5] },
    forum: { cy: 61.5, cx: [401.5, 430.5, 459.5, 488.5, 517.5, 546.5, 575.5] },
    reuniao: { cy: 123.5, cx: [517.5, 546.5, 575.5] },
  };
  const NOME_SALA = {
    biblioteca: 'Biblioteca', recepcao: 'Agência de marketing', forum: 'Fórum',
    reuniao: 'Sala de reunião', cafezinho: 'Cafezinho',
  };
  const FRENTES = ['EST', 'CAP', 'ATU', 'LID', 'REL'];
  const ENC = [40, 113, 187, 260];                 // encaixes de carta (x, mm)
  const FURO_EQUIPE = [[215.4, 57], [245, 57], [275, 57], [215.3, 86.5], [245.2, 86.5]];
  const FURO_CONDUTA = [[215, 117.3], [245, 117.3], [275, 117.3]];
  const CARTA_L = 6.3, CARTA_A = 8.8;
  // onde os cubos sentam nas cartas (fração da largura/altura, medido na arte)
  const PRAZO_U = { 2: [0.438, 0.542], 3: [0.386, 0.49, 0.594] };
  const PRAZO_V = 0.921;
  const NIVEL_V = { 3: 0.39, 2: 0.53, 1: 0.665 };   // centro dos selos 3/2/1 na arte da carta
  const NIVEL_U = 0.213;
  const ALT_CUBO = 0.8;   // a casa da mesa é rebaixada: o cubo assenta na camada de baixo

  /** Assentos: posição da mesa de cada jogador e o azimute da câmera dele. */
  function assentos(n) {
    const B = [0, 36, 0], E = [-55, -2, Math.PI / 2], D = [55, -2, -Math.PI / 2], T = [0, -36, Math.PI];
    switch (n) {
      case 1: return [B];
      case 2: return [B, T];
      case 3: return [B, E, D];
      case 4: return [B, E, T, D];
      case 5: return [B, [-58, 4, Math.PI / 2], [-30, -38, Math.PI], [30, -38, Math.PI], [58, 4, -Math.PI / 2]];
      default: return [B, [-58, 8, Math.PI / 2], [-58, -30, Math.PI / 2], [0, -38, Math.PI],
        [58, -30, -Math.PI / 2], [58, 8, -Math.PI / 2]];
    }
  }

  /* ---------------------------------------------------------------- arranque */
  function iniciar(canvas, TEX, MINI) {
    S.canvas = canvas; S.TEX = TEX; S.MINI = MINI;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    S.renderer = renderer;

    const cena = new THREE.Scene();
    cena.background = new THREE.Color(0x0F1613);
    cena.fog = new THREE.Fog(0x0F1613, 260, 520);
    S.cena = cena;
    S.camera = new THREE.PerspectiveCamera(42, 1, 1, 1000);

    cena.add(new THREE.HemisphereLight(0xFFF1DC, 0x1A2420, 0.55));
    const sol = new THREE.DirectionalLight(0xFFE7C4, 1.35);
    sol.position.set(60, 140, 40); sol.castShadow = true;
    sol.shadow.mapSize.set(2048, 2048);
    Object.assign(sol.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 10, far: 400 });
    sol.shadow.bias = -0.0006;
    cena.add(sol);
    const contra = new THREE.DirectionalLight(0x9FC3D8, 0.35);
    contra.position.set(-80, 60, -90); cena.add(contra);

    S.carregador = new THREE.TextureLoader();
    S.texturas = {};
    S.tampos = {};

    // a mesa de madeira
    const madeiraMesh = new THREE.Mesh(new THREE.BoxGeometry(300, 4, 200),
      new THREE.MeshStandardMaterial({ map: madeira(), roughness: 0.62, metalness: 0.05 }));
    madeiraMesh.position.y = -2; madeiraMesh.receiveShadow = true; cena.add(madeiraMesh);

    // geometrias compartilhadas
    S.geo = {
      cubo: new THREE.BoxGeometry(1, 1, 1),
      cubinho: new THREE.BoxGeometry(0.6, 0.6, 0.6),
      moeda: new THREE.CylinderGeometry(1.0, 1.0, 0.22, 32),
      base: new THREE.CylinderGeometry(1.28, 1.28, 0.3, 48),
      discoPeca: new THREE.CylinderGeometry(1.25, 1.25, 0.45, 48),
      ficha: new THREE.CylinderGeometry(1.1, 1.1, 0.3, 24),
      alvo: new THREE.CircleGeometry(1.25, 32),
      tampa: new THREE.CircleGeometry(1.3, 32),
      titular: geometriaDoTitular(MINI),
    };

    // o tabuleiro central e tudo que é fixo nele
    S.raiz = new THREE.Group(); cena.add(S.raiz);          // o que depende da partida
    const tab = placa(60, 40, 0.35, TEX.tabuleiro); tab.position.y = 0.175; cena.add(tab);
    montarEspacos();

    // câmera
    S.orb = { alvo: new THREE.Vector3(0, 0, 4), dist: 118, az: 0, el: 0.95, min: 14, max: 260 };
    S.transicao = null; S.animacoes = []; S.ouvintes = { espaco: null, peca: null };
    ligarPonteiro();
    addEventListener('resize', redimensionar); redimensionar();
    S.ultimo = performance.now();
    requestAnimationFrame(quadro);
    return S;
  }

  function redimensionar() {
    const w = innerWidth, h = innerHeight;
    S.renderer.setSize(w, h, false); S.camera.aspect = w / h; S.camera.updateProjectionMatrix();
  }

  function textura(uri, aniso = 8) {
    if (S.texturas[uri]) return S.texturas[uri];
    const t = S.carregador.load(uri);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = Math.min(aniso, S.renderer.capabilities.getMaxAnisotropy());
    S.texturas[uri] = t; return t;
  }

  function madeira() {
    const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
    const g = c.getContext('2d');
    g.fillStyle = '#3B2A1E'; g.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 260; i++) {
      const y = Math.random() * 1024;
      g.strokeStyle = `rgba(${20 + Math.random() * 40},${12 + Math.random() * 22},${6 + Math.random() * 14},${0.10 + Math.random() * 0.18})`;
      g.lineWidth = 1 + Math.random() * 3;
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= 1024; x += 64) g.lineTo(x, y + Math.sin(x / 90 + i) * 6 + Math.random() * 2);
      g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 2); t.encoding = THREE.sRGBEncoding;
    return t;
  }

  function geometriaDoTitular(MINI) {
    const bin = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
    const q = new Int16Array(bin(MINI.pos));
    const pos = new Float32Array(q.length);
    for (let i = 0; i < q.length; i++) pos[i] = q[i] / 32767 * MINI.scale;
    const idx = MINI.idx32 ? new Uint32Array(bin(MINI.idx)) : new Uint16Array(bin(MINI.idx));
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeVertexNormals();
    return g;
  }

  /* ---------------------------------------------------------------- fábricas de objetos */
  const matLado = () => new THREE.MeshStandardMaterial({ color: 0x1A2420, roughness: 0.7 });
  function placa(larg, alt, esp, uri) {
    const mat = [matLado(), matLado(),
      new THREE.MeshStandardMaterial({ map: textura(uri, 16), roughness: 0.55 }),
      new THREE.MeshStandardMaterial({ color: 0x0B0F0E, roughness: 0.8 }), matLado(), matLado()];
    const m = new THREE.Mesh(new THREE.BoxGeometry(larg, esp, alt), mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function carta(uri, x, z, y = 0, rot = 0, cartaId = null) {
    const c = placa(CARTA_L, CARTA_A, 0.06, uri);
    c.position.set(x, y + 0.03, z); c.rotation.y = rot;
    if (cartaId) { c.userData.cartaId = cartaId; S.cartasClicaveis.push(c); }
    return c;
  }
  function tampo(cor, letra) {
    const k = cor + letra;
    if (S.tampos[k]) return S.tampos[k];
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    const hex = '#' + cor.toString(16).padStart(6, '0');
    g.fillStyle = hex; g.fillRect(0, 0, 256, 256);
    g.font = '700 150px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.translate(128, 128); g.rotate(-Math.PI / 2);
    g.fillStyle = 'rgba(0,0,0,.42)'; g.fillText(letra, 2, 10);
    g.fillStyle = 'rgba(255,255,255,.28)'; g.fillText(letra, -2, 4);
    g.fillStyle = hex; g.globalAlpha = 0.65; g.fillText(letra, 0, 7); g.globalAlpha = 1;
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    S.tampos[k] = t; return t;
  }
  function disco(cor, tipo) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.42, metalness: 0.05 });
    if (tipo === 'titular') {
      const base = new THREE.Mesh(S.geo.base, mat); base.position.y = 0.15; base.castShadow = true; base.receiveShadow = true; g.add(base);
      const busto = new THREE.Mesh(S.geo.titular, mat); busto.position.y = 0.3; busto.rotation.y = S.MINI.giro || 0;
      busto.castShadow = true; busto.receiveShadow = true; g.add(busto);
    } else {
      const letra = tipo === 'advogado' ? 'A' : tipo === 'herdeiro' ? 'V' : 'E';
      const lado = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.42, metalness: 0.05 });
      const topo = new THREE.MeshStandardMaterial({ map: tampo(cor, letra), roughness: 0.42, metalness: 0.05 });
      const d = new THREE.Mesh(S.geo.discoPeca, [lado, topo, lado]); d.position.y = 0.225; d.castShadow = true; d.receiveShadow = true; g.add(d);
    }
    g.userData.tipo = tipo;
    return g;
  }
  function cubo(cor, geo = S.geo.cubo) {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: cor, roughness: 0.4 }));
    m.castShadow = true; m.receiveShadow = true; return m;
  }
  const AMARELO_MOEDA = 0xE9B824;
  function moeda(valor) {
    const lado = new THREE.MeshStandardMaterial({ color: AMARELO_MOEDA, roughness: 0.5, metalness: 0.12 });
    const topo = new THREE.MeshStandardMaterial({ map: tampo(AMARELO_MOEDA, String(valor)), roughness: 0.5, metalness: 0.12 });
    const m = new THREE.Mesh(S.geo.moeda, [lado, topo, topo]); m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  /** Etiqueta flutuante (sprite) com o caixa do jogador, ao lado das moedas. */
  function etiqueta(texto, cor) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 96;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(15,22,19,.86)'; g.beginPath(); g.roundRect ? g.roundRect(4, 4, 248, 88, 14) : g.rect(4, 4, 248, 88); g.fill();
    g.strokeStyle = '#' + cor.toString(16).padStart(6, '0'); g.lineWidth = 6; g.stroke();
    g.fillStyle = '#F3F1EA'; g.font = '700 54px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(texto, 128, 50);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false }));
    sp.scale.set(6.4, 2.4, 1); sp.renderOrder = 5;
    return sp;
  }
  function ficha() {
    const f = new THREE.Mesh(S.geo.ficha, new THREE.MeshStandardMaterial({ color: 0x8C2F2A, roughness: 0.6 }));
    f.castShadow = true; f.position.y = 0.15; return f;
  }
  function monte(uri, n) {
    const g = new THREE.Group();
    for (let i = 0; i < n; i++) { const c = carta(uri, 0, 0, i * 0.06); c.rotation.y = (Math.random() - 0.5) * 0.03; g.add(c); }
    return g;
  }
  function limpar(grupo) {
    while (grupo.children.length) grupo.remove(grupo.children[0]);
  }
  const corHex = (hex) => parseInt(hex.replace('#', ''), 16);

  /* ---------------------------------------------------------------- os espaços das salas (alvos de clique) */
  function montarEspacos() {
    S.espacos = [];
    for (const [salaId, s] of Object.entries(SALAS_XY)) {
      s.cx.forEach((cx, i) => {
        const [x, z] = P(cx, s.cy);
        const alvo = new THREE.Mesh(S.geo.alvo, new THREE.MeshBasicMaterial({ color: 0xC8A15A, transparent: true, opacity: 0 }));
        alvo.rotation.x = -Math.PI / 2; alvo.position.set(x, 0.37, z);
        alvo.userData = { salaId, indice: i, x, z, ocupado: null, legal: false, fechado: false };
        // a tampa escura cobre os espaços que não existem nesta contagem de jogadores
        const tampa = new THREE.Mesh(S.geo.tampa, new THREE.MeshStandardMaterial({ color: 0x0E1512, roughness: 0.9, transparent: true, opacity: 0.85 }));
        tampa.rotation.x = -Math.PI / 2; tampa.position.set(x, 0.36, z); tampa.visible = false;
        alvo.userData.tampa = tampa;
        S.cena.add(alvo); S.cena.add(tampa); S.espacos.push(alvo);
      });
    }
  }
  function espaco(salaId, indice) {
    return S.espacos.find((e) => e.userData.salaId === salaId && e.userData.indice === indice);
  }

  /* ---------------------------------------------------------------- montar a partida (uma vez por jogo) */
  function montar(s) {
    limpar(S.raiz);
    // as peças e os discos do Dr. Vieira moram na cena, não na raiz: tirar à mão
    if (S.jog) for (const J of Object.values(S.jog)) for (const r of Object.values(J.pecas)) r.obj.parent && r.obj.parent.remove(r.obj);
    if (S.herdeiroDiscos) for (const d of S.herdeiroDiscos) S.cena.remove(d);
    for (const a of S.animacoes) a.t = 1;
    S.chave = s.seed + ':' + s.jogadores.length + ':' + (s.solo ? 'solo' : 'mesa') + ':' + (S.meuIdx || 0);
    S.jog = {};           // id → { grupo, pecas: {pecaId → {obj, tipo}}, mesa, cor, rot, x, z }
    S.pecasNaCena = {};   // pecaId → objeto (reparentado para a cena quando sai da mesa)
    S.herdeiroDiscos = [];
    const pos = assentos(s.jogadores.length);
    const n = s.jogadores.length, meu = S.meuIdx || 0;
    s.jogadores.forEach((j, i) => {
      const [x, z, rot] = pos[((i - meu) % n + n) % n];   // a minha mesa fica sempre embaixo
      const g = new THREE.Group();
      const placaMesa = placa(30, 20, 0.5, S.TEX.mesa); placaMesa.position.y = 0.25; g.add(placaMesa);
      g.position.set(x, 0, z); g.rotation.y = rot; g.updateMatrixWorld(true);
      const din = new THREE.Group(); g.add(din);        // o que muda a cada estado
      S.raiz.add(g);
      S.jog[j.id] = { grupo: g, dinamico: din, pecas: {}, cor: corHex(j.cor.hex), rot, x, z, nome: j.nome };
    });
    // tampas dos espaços que não existem nesta mesa
    for (const e of S.espacos) {
      const sala = s.salas[e.userData.salaId];
      e.userData.fechado = e.userData.indice >= sala.espacos;
      e.userData.tampa.visible = e.userData.fechado;
    }
    S.tabDin = new THREE.Group(); S.raiz.add(S.tabDin);   // mercado, montes, marcador do ano
    S.cartasClicaveis = [];
    S.ultimoEstado = null;
  }

  /* ---------------------------------------------------------------- sincronizar (a cada estado) */
  function sincronizar(s, { animar = true } = {}) {
    if (S.chave !== s.seed + ':' + s.jogadores.length + ':' + (s.solo ? 'solo' : 'mesa') + ':' + (S.meuIdx || 0)) montar(s);
    const anterior = S.ultimoEstado;
    S.ultimoEstado = s;

    // 1. o tabuleiro: marcador do ano, mercado, montes
    limpar(S.tabDin);
    S.cartasClicaveis = [];
    {
      const k = Math.max(0, Math.min(5, s.rodada - 1));
      const [x, z] = P(330.5 + 49 * k, 179);
      const m = cubo(0xE8E2D2, S.geo.cubinho); m.position.set(x, 0.65, z); m.scale.set(1.4, 1.4, 1.4); S.tabDin.add(m);
    }
    const CARTA = (i, esquerda) => P((esquerda ? 16 : 316) + i * 70.7 + 34, 237 + 46.5);
    s.mercadoClientes.forEach((id, i) => {
      const [x, z] = CARTA(i + 1, false);
      S.tabDin.add(carta(S.TEX.cartas[id] || S.TEX.verso, x, z, 0.35, 0, id));
    });
    const b = s.baralhos;
    const montes = s.rodada <= 1
      ? [[0, b.pequenos.length], [1, b.medios.length], [2, b.grandes.length], [3, b.descarte.length]]
      : [[0, b.principal.length], [1, b.grandes.length], [3, b.descarte.length]];
    montes.forEach(([i, n]) => {
      if (!n) return;
      const [x, z] = CARTA(i, true);
      const m = monte(S.TEX.verso, Math.max(1, Math.round(n / 3))); m.position.set(x, 0.35, z); S.tabDin.add(m);
    });
    { const [x, z] = CARTA(0, false); const m = monte(S.TEX.verso, Math.max(1, Math.round(s.baralhoClientes.length / 3))); m.position.set(x, 0.35, z); S.tabDin.add(m); }

    // 2. os espaços: quem está onde
    for (const e of S.espacos) e.userData.ocupado = null;
    const ocupacao = {};   // pecaId → { salaId, indice }
    for (const [salaId, sala] of Object.entries(s.salas)) {
      sala.ocupantes.forEach((o, i) => {
        ocupacao[o.pecaId] = { salaId, indice: i, jogadorId: o.jogadorId };
        const e = espaco(salaId, i); if (e) e.userData.ocupado = o;
      });
    }

    // 3. cada jogador
    for (const j of s.jogadores) {
      const J = S.jog[j.id];
      limpar(J.dinamico);
      const cor = J.cor;
      // cubos de reputação, conhecimento e energia
      FRENTES.forEach((f, t) => {
        const v = Math.min(12, j.rep[f]);
        const [cx, cz] = M(48 + 12 * v, 63 + 19 * t - 3 * v);
        const c = cubo(cor); c.position.set(cx, ALT_CUBO, cz); J.dinamico.add(c);
      });
      { const k = Math.max(0, Math.min(6, j.conhecimento - 1)); const [cx, cz] = M(48 + 12 * k, 156.8 - 3 * k); const c = cubo(cor); c.position.set(cx, ALT_CUBO, cz); J.dinamico.add(c); }
      { const k = Math.max(0, Math.min(8, j.energia)); const [cx, cz] = M(48 + 12 * k, 176.5 - 3 * k); const c = cubo(cor); c.position.set(cx, ALT_CUBO, cz); J.dinamico.add(c); }
      // processos na mesa, com os cubos de prazo
      j.carteira.slice(0, 3).forEach((item, i) => {
        const uri = S.TEX.cartas[item.cartaId] || S.TEX.verso;
        const c = carta(uri, ENC[i] / 10 - 15, -10 + 1.2 - 4.4, 0.5, 0, item.cartaId); J.dinamico.add(c);
        const prazo = S.prazoDe ? S.prazoDe(item.cartaId) : 2;
        const us = PRAZO_U[prazo] || PRAZO_U[2];
        for (let k = 0; k < Math.min(item.cubos, us.length); k++) {
          const q = cubo(cor, S.geo.cubinho);
          q.position.set(c.position.x + (us[k] - 0.5) * CARTA_L, 0.5 + 0.06 + 0.3, c.position.z + (PRAZO_V - 0.5) * CARTA_A);
          J.dinamico.add(q);
        }
      });
      // concluídos: pilha no 4º encaixe
      if (j.vencidos.length) {
        const g = new THREE.Group();
        // concluído fica virado para baixo, como na regra: a pilha mostra só o verso
        j.vencidos.forEach((id, k) => { const c = carta(S.TEX.verso, 0, 0, k * 0.06, 0, id); c.rotation.y = (Math.random() - 0.5) * 0.04; g.add(c); });
        g.position.set(ENC[3] / 10 - 15, 0.5, -10 + 1.2 - 4.4); J.dinamico.add(g);
      }
      // clientes, com o cubinho no nível
      j.clientes.slice(0, 4).forEach((cl, i) => {
        const c = carta(S.TEX.cartas[cl.cartaId] || S.TEX.verso, ENC[i] / 10 - 15, 10 - 1.2 + 4.4, 0.5, 0, cl.cartaId); J.dinamico.add(c);
        const q = cubo(cor, S.geo.cubinho);
        q.position.set(c.position.x + (NIVEL_U - 0.5) * CARTA_L, 0.5 + 0.06 + 0.3, c.position.z + ((NIVEL_V[cl.nivel] || NIVEL_V[3]) - 0.5) * CARTA_A);
        J.dinamico.add(q);
      });
      // fichas de conduta
      for (let k = 0; k < Math.min(3, j.conduta); k++) {
        const [fx, fz] = M(...FURO_CONDUTA[k]); const f = ficha(); f.position.set(fx, 0.5 + 0.15, fz); J.dinamico.add(f);
      }
      // caixa: moedas de 5 e de 1, ao lado da mesa
      {
        let d = Math.max(0, j.dinheiro), n = 0;
        const cincos = Math.floor(d / 5), uns = d % 5;
        for (let k = 0; k < cincos; k++) { const m = moeda(5); m.position.set(13, 0.11 + k * 0.22, -12.6); m.rotation.y = k * 0.4; J.dinamico.add(m); n++; }
        for (let k = 0; k < uns; k++) { const m = moeda(1); m.position.set(10.4, 0.11 + k * 0.22, -12.4); m.rotation.y = k * 0.5; J.dinamico.add(m); }
      }
      { const e = etiqueta('$' + j.dinheiro + (j.divida ? ' −' + j.divida : ''), cor); e.position.set(10.8, 2.2, -15.6); J.dinamico.add(e); }
      // reserva de cubinhos de prazo
      for (let i = 0; i < 6; i++) { const q = cubo(cor, S.geo.cubinho); q.position.set(-17.6 + Math.floor(i / 3) * 0.95, 0.3, -9 + (i % 3) * 0.95); J.dinamico.add(q); }

      // as peças: criar/recriar quando o tipo muda (promoção) ou quando aparece uma nova
      for (const p of j.pecas) {
        let reg = J.pecas[p.id];
        if (!reg || reg.tipo !== p.tipo) {
          if (reg) { reg.obj.parent && reg.obj.parent.remove(reg.obj); }
          const obj = disco(cor, p.tipo); obj.userData.pecaId = p.id; obj.userData.jogadorId = j.id;
          reg = J.pecas[p.id] = { obj, tipo: p.tipo, onde: null };
          S.cena.add(obj);
        }
      }
      // peças que sumiram (demissão)
      for (const id of Object.keys(J.pecas)) {
        if (!j.pecas.find((p) => p.id === id)) { const r = J.pecas[id]; r.obj.parent && r.obj.parent.remove(r.obj); delete J.pecas[id]; }
      }
      // posição de cada peça (no mundo)
      const naMesa = j.pecas.filter((p) => p.tipo !== 'titular' && !ocupacao[p.id] && p.local !== 'reuniao');
      for (const p of j.pecas) {
        const reg = J.pecas[p.id];
        let destino, chave, rotY = J.rot;
        const oc = ocupacao[p.id];
        if (oc) {
          const e = espaco(oc.salaId, oc.indice);
          destino = new THREE.Vector3(e.userData.x, 0.37, e.userData.z); chave = oc.salaId + oc.indice;
          // um contratado na reunião fica sob o titular: a torre ocupa um espaço só
          if (oc.salaId === 'reuniao' && p.tipo === 'titular') {
            const sob = j.pecas.filter((q) => q.local === 'reuniao').length;
            destino.y += sob * 0.45; chave += ':' + sob;
          }
          rotY = 0;
        } else if (p.local === 'reuniao') {
          const tit = ocupacao[j.pecas[0].id];
          const e = tit ? espaco(tit.salaId, tit.indice) : null;
          const k = j.pecas.filter((q) => q.local === 'reuniao').indexOf(p);
          destino = e ? new THREE.Vector3(e.userData.x, 0.37 + k * 0.45, e.userData.z) : mesaLocal(J, FURO_EQUIPE[1]);
          chave = 'reuniao-sob' + k; rotY = 0;
        } else if (p.tipo === 'titular') {
          destino = mesaLocal(J, FURO_EQUIPE[0]); chave = 'mesa0';
        } else {
          const k = Math.min(4, naMesa.indexOf(p) + 1);
          destino = mesaLocal(J, FURO_EQUIPE[k]); chave = 'mesa' + k;
        }
        const obj = reg.obj;
        obj.rotation.y = rotY;
        obj.visible = true;
        // deitado = recém-contratado, ainda não age: fica tombado ao lado do furo
        if (!p.disponivel && !oc && p.local !== 'reuniao') { obj.rotation.z = 0; obj.scale.set(1, 0.5, 1); } else { obj.scale.set(1, 1, 1); }
        if (reg.onde !== chave) {
          const dur = anterior && animar && reg.onde !== null ? 0.75 : 0;
          if (dur) S.animacoes.push({ obj, de: obj.position.clone(), ate: destino, t: 0, dur });
          else obj.position.copy(destino);
          reg.onde = chave;
        }
      }
    }

    // 4. os discos do Dr. Vieira (modo solo): marrons, sem mesa
    for (const d of S.herdeiroDiscos) S.cena.remove(d);
    S.herdeiroDiscos = [];
    if (s.herdeiro) {
      for (const [salaId, sala] of Object.entries(s.salas)) {
        sala.ocupantes.forEach((o, i) => {
          if (o.jogadorId !== 'HERDEIRO') return;
          const e = espaco(salaId, i); const d = disco(0x5A3A2E, 'herdeiro');
          d.position.set(e.userData.x, 0.37, e.userData.z); S.cena.add(d); S.herdeiroDiscos.push(d);
        });
      }
      // a pilha dele de concluídos e a pasta, ao lado do tabuleiro (lado oposto ao jogador)
      const g = new THREE.Group();
      (s.herdeiro.concluidos || []).forEach((id, k) => { const c = carta(S.TEX.verso, 0, 0, k * 0.06, 0, id); g.add(c); });
      g.position.set(-34, 0.35, -28); g.rotation.y = Math.PI; S.cena.add(g); S.herdeiroDiscos.push(g);
      const pasta = new THREE.Group();
      (s.herdeiro.pasta || []).forEach((id, k) => { const c = carta(S.TEX.cartas[id] || S.TEX.verso, k * 7, 0, 0, 0, id); pasta.add(c); });
      pasta.position.set(20, 0.35, -28); pasta.rotation.y = Math.PI; S.cena.add(pasta); S.herdeiroDiscos.push(pasta);
    }
  }
  function mesaLocal(J, [mx, my]) {
    const [lx, lz] = M(mx, my);
    const v = new THREE.Vector3(lx, 0.5, lz);
    return J.grupo.localToWorld(v);
  }

  /** Quais espaços podem receber uma peça agora (realce dourado). */
  function realcar(legais) {   // legais: Set de salaId, ou null
    for (const e of S.espacos) {
      e.userData.legal = !!legais && legais.has(e.userData.salaId) && !e.userData.ocupado && !e.userData.fechado;
      e.material.opacity = e.userData.legal ? 0.28 : 0;
      e.material.color.set(e.userData.legal ? 0xC8A15A : 0xC8A15A);
    }
  }

  /* ---------------------------------------------------------------- câmera */
  function aplicarCamera() {
    const o = S.orb;
    const x = o.alvo.x + o.dist * Math.cos(o.el) * Math.sin(o.az);
    const z = o.alvo.z + o.dist * Math.cos(o.el) * Math.cos(o.az);
    const y = o.alvo.y + o.dist * Math.sin(o.el);
    S.camera.position.set(x, Math.max(3, y), z); S.camera.lookAt(o.alvo);
  }
  function vistas(s) {
    const lista = [
      { id: 'mesa', rotulo: 'Mesa inteira', v: { alvo: [0, 0, 8], dist: 122, az: S.azAtual || 0, el: 1.0 } },
      { id: 'tab', rotulo: 'Tabuleiro', v: { alvo: [0, 0, -2], dist: 62, az: S.azAtual || 0, el: 1.05 } },
    ];
    if (s) for (const j of s.jogadores) {
      const J = S.jog[j.id]; if (!J) continue;
      lista.push({ id: 'j:' + j.id, rotulo: 'Mesa · ' + j.nome, v: { alvo: [J.x, 0, J.z], dist: 44, az: J.rot, el: 1.15 } });
    }
    return lista;
  }
  function irPara(v) {
    S.transicao = { de: { ...S.orb, alvo: S.orb.alvo.clone() }, ate: { ...v, alvo: new THREE.Vector3(...v.alvo) }, t: 0, dur: 0.9 };
  }
  /** Uma vista que enquadra um retângulo do tampo (cm) na tela atual — é o que o celular usa. */
  function enquadrar(cx, cz, larg, alt, az, el, folga = 1.15) {
    const cam = S.camera; const vfov = cam.fov * Math.PI / 180; const aspect = cam.aspect || 1;
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
    const deLado = Math.abs(Math.sin(az)) > 0.5;
    const w = deLado ? alt : larg, d = deLado ? larg : alt;
    const distW = (w / 2) / Math.tan(hfov / 2);
    const distH = ((d / 2) * Math.sin(el)) / Math.tan(vfov / 2) + (d / 2) * Math.cos(el);
    return { alvo: [cx, 0, cz], dist: Math.min(S.orb.max, Math.max(S.orb.min, Math.max(distW, distH) * folga)), az, el };
  }
  function definirCelular(ligado) {
    S.celular = !!ligado;
    const k = S.celular ? 1.7 : 1;
    for (const e of S.espacos) e.scale.set(k, k, 1);   // alvo de toque maior (a arte não muda)
  }
  /** Coloca a câmera no assento de um jogador (mesa inteira vista de lá). */
  function sentarEm(jogadorId) {
    const J = S.jog[jogadorId]; if (!J) return;
    S.azAtual = J.rot;
    irPara({ alvo: [0, 0, 8], dist: 122, az: J.rot, el: 1.0 });
  }

  function ligarPonteiro() {
    const canvas = S.canvas, orb = S.orb;
    let arrastando = null, pinca = null;
    canvas.addEventListener('pointerdown', (e) => { arrastando = { x: e.clientX, y: e.clientY, botao: e.button, moveu: false }; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', (e) => {
      if (!arrastando) { sondar(e); return; }
      const dx = e.clientX - arrastando.x, dy = e.clientY - arrastando.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) arrastando.moveu = true;
      const girar = arrastando.botao === 2 || e.shiftKey || e.ctrlKey || e.altKey;
      if (!girar) {
        // arrastar = deslocar a mesa (o quanto anda depende do zoom, para a mesa acompanhar o mouse)
        const k = orb.dist / 620;
        const dir = new THREE.Vector3(Math.sin(orb.az), 0, Math.cos(orb.az));
        const lado = new THREE.Vector3(dir.z, 0, -dir.x);
        orb.alvo.addScaledVector(lado, -dx * k).addScaledVector(dir, dy * k);
        orb.alvo.x = Math.max(-150, Math.min(150, orb.alvo.x)); orb.alvo.z = Math.max(-100, Math.min(100, orb.alvo.z));
      } else { orb.az -= dx * 0.006; orb.el = Math.min(1.45, Math.max(0.15, orb.el + dy * 0.005)); }
      arrastando.x = e.clientX; arrastando.y = e.clientY; S.transicao = null;
    });
    canvas.addEventListener('pointerup', (e) => { if (arrastando && !arrastando.moveu && e.button === 0) clicar(e); arrastando = null; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); orb.dist = Math.min(orb.max, Math.max(orb.min, orb.dist * (1 + Math.sign(e.deltaY) * 0.08))); S.transicao = null; }, { passive: false });
    canvas.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinca = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
    let doisDedos = null;
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 2) { doisDedos = null; return; }
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      if (pinca) orb.dist = Math.min(orb.max, Math.max(orb.min, orb.dist * pinca / d));
      // no celular a mesa não gira com os dedos: só desloca e aproxima (girar sem querer era o erro mais comum)
      if (doisDedos && !S.celular) { orb.az -= (cx - doisDedos.x) * 0.006; orb.el = Math.min(1.45, Math.max(0.15, orb.el + (cy - doisDedos.y) * 0.005)); }
      pinca = d; doisDedos = { x: cx, y: cy }; arrastando = null; S.transicao = null;
    }, { passive: true });
    canvas.addEventListener('touchend', () => { doisDedos = null; pinca = null; }, { passive: true });
  }

  const ray = new THREE.Raycaster(); const ponteiro = new THREE.Vector2();
  let realce = null;
  function alvoSob(e) {
    const r = S.canvas.getBoundingClientRect();
    ponteiro.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ponteiro, S.camera);
    const hit = ray.intersectObjects(S.espacos.filter((x) => !x.userData.fechado), false)[0];
    return hit ? hit.object : null;
  }
  function sondar(e) {
    const a = alvoSob(e);
    if (realce && realce !== a) { realce.material.opacity = realce.userData.legal ? 0.28 : 0; realce = null; }
    if (a) {
      realce = a; a.material.opacity = a.userData.legal ? 0.55 : (a.userData.ocupado ? 0.12 : 0.2);
      S.canvas.style.cursor = a.userData.legal ? 'pointer' : 'grab';
      if (S.ouvintes.sondar) S.ouvintes.sondar(a.userData, e);
    } else { S.canvas.style.cursor = cartaSob(e) ? 'zoom-in' : 'grab'; if (S.ouvintes.sondar) S.ouvintes.sondar(null, e); }
  }
  function cartaSob(e) {
    const r = S.canvas.getBoundingClientRect();
    ponteiro.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ponteiro, S.camera);
    const hit = ray.intersectObjects(S.cartasClicaveis || [], false)[0];
    return hit ? hit.object.userData.cartaId : null;
  }
  function clicar(e) {
    const a = alvoSob(e);
    if (a && S.ouvintes.espaco) { S.ouvintes.espaco(a.userData, e); return; }
    const id = cartaSob(e);
    if (id && S.ouvintes.carta) { S.ouvintes.carta(id, e); return; }
    if (S.ouvintes.fora) S.ouvintes.fora(e);
  }

  /* ---------------------------------------------------------------- laço */
  const suave = (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
  function quadro(agora) {
    const dt = Math.min(0.05, (agora - S.ultimo) / 1000); S.ultimo = agora;
    const tr = S.transicao, orb = S.orb;
    if (tr) {
      tr.t += dt / tr.dur; const k = suave(Math.min(1, tr.t));
      orb.dist = tr.de.dist + (tr.ate.dist - tr.de.dist) * k;
      orb.az = tr.de.az + (tr.ate.az - tr.de.az) * k;
      orb.el = tr.de.el + (tr.ate.el - tr.de.el) * k;
      orb.alvo.lerpVectors(tr.de.alvo, tr.ate.alvo, k);
      if (tr.t >= 1) S.transicao = null;
    }
    for (let i = S.animacoes.length - 1; i >= 0; i--) {
      const a = S.animacoes[i]; a.t += dt / a.dur; const k = suave(Math.min(1, a.t));
      a.obj.position.lerpVectors(a.de, a.ate, k); a.obj.position.y += Math.sin(k * Math.PI) * 6;
      if (a.t >= 1) { a.obj.position.copy(a.ate); S.animacoes.splice(i, 1); }
    }
    aplicarCamera();
    S.renderer.render(S.cena, S.camera);
    requestAnimationFrame(quadro);
  }

  return {
    iniciar, sincronizar, realcar, vistas, irPara, sentarEm, NOME_SALA,
    textura: (id) => S.TEX.cartas[id],
    ouvir(nome, fn) { S.ouvintes[nome] = fn; },
    definirPrazo(fn) { S.prazoDe = fn; },
    definirMeuIdx(i) { S.meuIdx = i || 0; },
    definirCelular, enquadrar,
    mesaDe: (id) => S.jog && S.jog[id] ? { x: S.jog[id].x, z: S.jog[id].z, rot: S.jog[id].rot } : null,
    azAtual: () => S.azAtual || 0,
    orb: () => S.orb,
    _S: S, _espaco: espaco,
  };
})();

/* =============== ui3d/rede.js =============== */
// ui3d/rede.js — multiplayer sem servidor, por código de sala.
//
// O anfitrião abre a sala (um Peer com id "suit-CÓDIGO"), os convidados se
// conectam a ele (WebRTC via PeerJS; só a apresentação passa pelo servidor
// público do PeerJS, o jogo em si vai direto de navegador a navegador).
// O anfitrião é a autoridade: só ele roda o motor. Os convidados mandam a
// ação que querem fazer; ele valida com o reducer e devolve o estado inteiro
// (≈ 40 KB no pior caso) para todo mundo. Como o motor é determinístico e o
// estado é um JSON, não há nada para "sincronizar" além disso.
//
// Para testar sem internet existe um segundo transporte, por BroadcastChannel,
// que liga duas abas do mesmo navegador (código começando com "LOCAL").

const REDE = (() => {
  const S = {
    papel: null,            // 'anfitriao' | 'convidado' | null
    codigo: null,
    nome: '',
    meuJogadorId: null,     // definido quando a partida começa
    convidados: {},         // peerId → { nome, jogadorId, conn }
    transporte: null,
    ouvintes: {},           // 'sala' | 'inicio' | 'estado' | 'acao' | 'desfazer' | 'erro' | 'saiu' | 'fim'
    status: 'fora',         // 'fora' | 'abrindo' | 'aberta' | 'conectando' | 'conectado' | 'erro'
    erro: null,
  };
  const emitir = (nome, ...args) => { if (S.ouvintes[nome]) S.ouvintes[nome](...args); };
  const gerarCodigo = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 6; i++) c += A[Math.floor(Math.random() * A.length)]; return c; };

  /* ---------------------------------------------------------------- transportes */
  // Cada transporte expõe: abrir(idSala, aoConectar(conn)), conectar(idSala) → conn, fechar()
  // e cada conn: enviar(obj), aoReceber(fn), aoFechar(fn), id.

  function transportePeer() {
    let peer = null;
    const embrulhar = (conn) => ({
      id: conn.peer,
      enviar: (obj) => { try { conn.send(obj); } catch (e) { /* conexão fechada */ } },
      aoReceber: (fn) => conn.on('data', fn),
      aoFechar: (fn) => { conn.on('close', fn); conn.on('error', fn); },
      fechar: () => conn.close(),
    });
    return {
      abrir(idSala, aoConectar, aoErro) {
        peer = new Peer(idSala, { debug: 0 });
        peer.on('open', () => { S.status = 'aberta'; emitir('sala'); });
        peer.on('connection', (conn) => { conn.on('open', () => aoConectar(embrulhar(conn))); });
        peer.on('error', (e) => aoErro(e));
      },
      conectar(idSala, aoAbrir, aoErro) {
        peer = new Peer(undefined, { debug: 0 });
        peer.on('open', () => {
          const conn = peer.connect(idSala, { reliable: true });
          conn.on('open', () => aoAbrir(embrulhar(conn)));
          conn.on('error', (e) => aoErro(e));
        });
        peer.on('error', (e) => aoErro(e));
      },
      fechar() { if (peer) { peer.destroy(); peer = null; } },
    };
  }

  function transporteLocal() {
    let canal = null, meuId = null; const conns = {};
    const novaConn = (outroId) => {
      const c = { id: outroId, _rec: null, _fech: null };
      c.enviar = (obj) => canal.postMessage({ de: meuId, para: outroId, obj });
      c.aoReceber = (fn) => { c._rec = fn; };
      c.aoFechar = (fn) => { c._fech = fn; };
      c.fechar = () => { canal.postMessage({ de: meuId, para: outroId, tchau: true }); };
      conns[outroId] = c; return c;
    };
    return {
      abrir(idSala, aoConectar) {
        meuId = 'host'; canal = new BroadcastChannel(idSala);
        canal.onmessage = (ev) => {
          const m = ev.data; if (m.para !== meuId) return;
          if (m.ola) { const c = novaConn(m.de); canal.postMessage({ de: meuId, para: m.de, pronto: true }); aoConectar(c); return; }
          const c = conns[m.de]; if (!c) return;
          if (m.tchau) { c._fech && c._fech(); delete conns[m.de]; return; }
          if (c._rec) c._rec(m.obj);
        };
        setTimeout(() => { S.status = 'aberta'; emitir('sala'); }, 50);
      },
      conectar(idSala, aoAbrir) {
        meuId = 'c' + Math.random().toString(36).slice(2, 8); canal = new BroadcastChannel(idSala);
        const c = novaConn('host');
        canal.onmessage = (ev) => {
          const m = ev.data; if (m.para !== meuId) return;
          if (m.pronto) { aoAbrir(c); return; }
          if (m.tchau) { c._fech && c._fech(); return; }
          if (c._rec) c._rec(m.obj);
        };
        canal.postMessage({ de: meuId, para: 'host', ola: true });
      },
      fechar() { if (canal) { canal.close(); canal = null; } },
    };
  }

  const idSala = (codigo) => 'suit-v9-' + codigo;
  const escolherTransporte = (codigo) => (codigo.startsWith('LOCAL') || typeof Peer === 'undefined') ? transporteLocal() : transportePeer();

  /* ---------------------------------------------------------------- anfitrião */
  function criarSala(nome, codigoFixo = null) {
    sair();
    S.papel = 'anfitriao'; S.nome = nome; S.codigo = codigoFixo || gerarCodigo(); S.status = 'abrindo'; S.erro = null;
    S.transporte = escolherTransporte(S.codigo);
    S.transporte.abrir(idSala(S.codigo), (conn) => {
      conn.aoReceber((m) => receberDoConvidado(conn, m));
      conn.aoFechar(() => { const c = S.convidados[conn.id]; delete S.convidados[conn.id]; emitir('saiu', c); emitir('sala'); enviarSala(); });
    }, (e) => { S.status = 'erro'; S.erro = textoErro(e); emitir('erro', S.erro); });
    return S.codigo;
  }
  function receberDoConvidado(conn, m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'oi') {
      S.convidados[conn.id] = { nome: nomeUnico(String(m.nome || '').trim().slice(0, 14) || 'Convidado'), jogadorId: null, conn };
      emitir('sala'); enviarSala(); return;
    }
    const c = S.convidados[conn.id]; if (!c) return;
    if (m.t === 'acao' && m.acao && c.jogadorId) emitir('acao', c.jogadorId, m.acao);
    if (m.t === 'desfazer' && c.jogadorId) emitir('desfazer', c.jogadorId);
  }
  /** Dois jogadores com o mesmo nome confundem a mesa: o repetido ganha um número. */
  function nomeUnico(nome) {
    const usados = [S.nome, ...Object.values(S.convidados).map((c) => c.nome)].map((x) => String(x || '').toLowerCase());
    if (!usados.includes(nome.toLowerCase())) return nome;
    for (let k = 2; ; k++) { const cand = nome.slice(0, 11) + ' ' + k; if (!usados.includes(cand.toLowerCase())) return cand; }
  }
  const listaSala = () => [{ peerId: null, nome: S.nome, jogadorId: S.meuJogadorId, anfitriao: true },
    ...Object.entries(S.convidados).map(([peerId, c]) => ({ peerId, nome: c.nome, jogadorId: c.jogadorId }))];
  function enviarSala() { difundir({ t: 'sala', codigo: S.codigo, jogadores: listaSala().map((x) => ({ nome: x.nome, jogadorId: x.jogadorId, anfitriao: !!x.anfitriao })) }); }
  function difundir(obj) { for (const c of Object.values(S.convidados)) c.conn.enviar(obj); }
  /** O anfitrião começa a partida: atribui um assento (jogadorId) a cada convidado. */
  function iniciarPartida(estado, assentos) {   // assentos: peerId → jogadorId ; anfitrião = assentos.anfitriao
    S.meuJogadorId = assentos.anfitriao;
    for (const [peerId, c] of Object.entries(S.convidados)) {
      c.jogadorId = assentos[peerId] || null;
      c.conn.enviar({ t: 'inicio', estado, seuJogadorId: c.jogadorId, codigo: S.codigo });
    }
  }
  function difundirEstado(estado) { difundir({ t: 'estado', estado }); }
  function avisar(peerIdOuJogadorId, msg) {
    for (const c of Object.values(S.convidados)) if (c.jogadorId === peerIdOuJogadorId) c.conn.enviar({ t: 'erro', msg });
  }

  /* ---------------------------------------------------------------- convidado */
  function entrarNaSala(codigo, nome) {
    sair();
    S.papel = 'convidado'; S.nome = nome; S.codigo = codigo.toUpperCase().trim(); S.status = 'conectando'; S.erro = null;
    S.transporte = escolherTransporte(S.codigo);
    S.transporte.conectar(idSala(S.codigo), (conn) => {
      S.status = 'conectado'; S.anfitriao = conn;
      conn.enviar({ t: 'oi', nome });
      conn.aoReceber((m) => receberDoAnfitriao(m));
      conn.aoFechar(() => { S.status = 'erro'; S.erro = 'A conexão com o anfitrião caiu.'; emitir('erro', S.erro); });
      emitir('sala');
    }, (e) => { S.status = 'erro'; S.erro = textoErro(e); emitir('erro', S.erro); });
  }
  function receberDoAnfitriao(m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'sala') { S.sala = m.jogadores; emitir('sala'); }
    else if (m.t === 'inicio') { S.meuJogadorId = m.seuJogadorId; emitir('inicio', m.estado); }
    else if (m.t === 'estado') emitir('estado', m.estado);
    else if (m.t === 'erro') emitir('erro', m.msg);
    else if (m.t === 'fim') { emitir('fim'); }
  }
  function enviarAcao(acao) { if (S.anfitriao) S.anfitriao.enviar({ t: 'acao', acao }); }
  function pedirDesfazer() { if (S.anfitriao) S.anfitriao.enviar({ t: 'desfazer' }); }

  /* ---------------------------------------------------------------- comum */
  function textoErro(e) {
    const tipo = e && e.type;
    if (tipo === 'peer-unavailable') return 'Não achei uma sala com esse código. Confira as letras — ou o anfitrião fechou a aba.';
    if (tipo === 'unavailable-id') return 'Esse código já está em uso. Tente criar a sala de novo.';
    if (tipo === 'network' || tipo === 'server-error') return 'Sem conexão com o serviço de apresentação (PeerJS). Verifique a internet e tente de novo.';
    if (tipo === 'browser-incompatible') return 'Este navegador (ou esta página) bloqueia WebRTC. Dentro do claude.ai isso é esperado: use a versão publicada na Vercel.';
    return (e && (e.message || String(e))) || 'Erro de rede.';
  }
  function sair() {
    if (S.papel === 'anfitriao') difundir({ t: 'fim' });
    if (S.transporte) { try { S.transporte.fechar(); } catch (e) { /* ignora */ } }
    S.papel = null; S.codigo = null; S.meuJogadorId = null; S.convidados = {}; S.transporte = null; S.anfitriao = null; S.sala = null; S.status = 'fora'; S.erro = null;
  }

  return {
    criarSala, entrarNaSala, sair, iniciarPartida, difundirEstado, enviarAcao, pedirDesfazer, avisar, listaSala,
    ouvir(nome, fn) { S.ouvintes[nome] = fn; },
    online: () => !!S.papel,
    souAnfitriao: () => S.papel === 'anfitriao',
    souConvidado: () => S.papel === 'convidado',
    meuJogadorId: () => S.meuJogadorId,
    codigo: () => S.codigo,
    status: () => S.status,
    erro: () => S.erro,
    nome: () => S.nome,
    salaDoConvidado: () => S.sala || [],
    convidados: () => Object.entries(S.convidados).map(([peerId, c]) => ({ peerId, nome: c.nome })),
  };
})();

/* =============== ui3d/main3d.js =============== */
// ui3d/main3d.js — o jogo em 3D: tela de cenário, HUD, bots e a ponte
// entre os cliques na cena e as ações do motor. As decisões que não são
// "clique no tabuleiro" (Pauta, Fórum, Reunião, Cafezinho, Agência…) usam os
// mesmos diálogos da interface 2D, por cima da cena.


const APP3D = (() => {
  const NOMES = ['Você', 'Bruno', 'Carla', 'Davi', 'Elisa', 'Fábio'];
  let cenaPronta = false;
  /** Online, eu sou um assento fixo; no hot-seat, eu sou quem está na vez. */
  const possoAgir = (s) => !REDE.online() || atorDe(s) === REDE.meuJogadorId();
  const meuJogador = (s) => REDE.online() ? jogadorPorId(s, REDE.meuJogadorId()) : (atorDe(s) ? jogadorPorId(s, atorDe(s)) : null);
  /** Tela pequena: outra interface por cima da mesma cena (abas, barra de peças, folhas). */
  const CEL = () => matchMedia('(max-width: 820px)').matches;
  const EFEITO_SALA = { biblioteca: 'conhecimento', recepcao: 'captar cliente ($3) ou cavar ($6)', forum: 'concluir processos', reuniao: 'contratar / promover', cafezinho: 'energia (+3) e clientes' };

  /* -------------------------------------------------------------- cenário (setup) */
  function telaCenario() {
    const cfg = store.vista.setup || (store.vista.setup = {
      modo: 'mesa', n: 3, nomes: NOMES.slice(), bots: [false, true, true, true, true, true], botsOnline: 0, codigo: '',
      nivelBot: 'normal', nivelHerdeiro: 2, variante: 'padrao', criteriosOcultos: false, seed: '',
      telaDePassagem: true,
    });
    const atualiza = (campos) => store.atualizarVista({ setup: { ...cfg, ...campos } });
    const salvo = store.lerSalvo();
    const solo = cfg.modo === 'solo';
    const humanos = solo ? 1 : cfg.bots.slice(0, cfg.n).filter((b) => !b).length;

    const opcao = (ativo, rotulo, sub, onclick, extra = {}) => h('button', {
      type: 'button', class: 'op' + (ativo ? ' op--on' : ''), 'aria-pressed': String(ativo), onclick, ...extra,
    }, h('b', { texto: rotulo }), sub ? h('span', { texto: sub }) : null);

    const bloco = (titulo, ...filhos) => h('section', { class: 'bloco' }, h('h3', { texto: titulo }), ...filhos);

    const jogadores = h('div', { class: 'jogadores' },
      ...Array.from({ length: cfg.n }, (_, i) => h('div', { class: 'jog' },
        h('span', { class: 'pino', estilo: { background: CORES_JOGADOR[i].hex } }),
        h('input', { type: 'text', value: cfg.nomes[i], maxlength: '14', 'aria-label': `Nome do jogador ${i + 1}`,
          oninput: (ev) => { cfg.nomes[i] = ev.target.value; } }),
        h('div', { class: 'alt', role: 'group' },
          ...[['Humano', false], ['Bot', true]].map(([r, b]) => h('button', {
            type: 'button', 'aria-pressed': String(!!cfg.bots[i] === b),
            onclick: () => { const bots = cfg.bots.slice(); bots[i] = b; atualiza({ bots }); },
          }, r))))));

    const nomePartida = (cfg.variante === 'exigente' ? 'Sócio Exigente' : 'Tradicional')
      + (cfg.criteriosOcultos ? ' + Critério Oculto' : ' · critérios à vista');

    return h('div', { class: 'cenario' },

          h('p', { class: 'sub', texto: 'Seis anos para virar sócio · mesa 3D' })),

            opcao(false, 'Online — código de sala', 'Cada um no seu aparelho. Sem cadastro: um código de 6 letras.', () => atualiza({ modo: 'online' })))),

        solo
          ? bloco('2 · O Dr. Vieira',
            h('div', { class: 'linha' },
              h('label', { texto: 'Seu nome' }),
              h('input', { type: 'text', value: cfg.nomes[0], maxlength: '14', oninput: (ev) => { cfg.nomes[0] = ev.target.value; } })),
            h('div', { class: 'ops ops--4' },
              ...[1, 2, 3, 4].map((n) => opcao(cfg.nivelHerdeiro === n, NIVEIS_HERDEIRO[n].nome, null, () => atualiza({ nivelHerdeiro: n }), { title: NIVEIS_HERDEIRO[n].apelido }))),
            h('p', { class: 'nota' }, h('b', { texto: NIVEIS_HERDEIRO[cfg.nivelHerdeiro].apelido + '. ' }), NIVEIS_HERDEIRO[cfg.nivelHerdeiro].resumo,
              ` Média dele: ${NIVEIS_HERDEIRO[cfg.nivelHerdeiro].media} pontos.`))
          : bloco('2 · Jogadores',
            h('div', { class: 'ops ops--5' },
              ...[2, 3, 4, 5, 6].map((n) => opcao(cfg.n === n, String(n), null, () => atualiza({ n })))),
            jogadores,
            cfg.bots.slice(0, cfg.n).some(Boolean) ? h('div', { class: 'linha' },

                opcao(cfg.nivelBot === 'facil', 'Fácil', null, () => atualiza({ nivelBot: 'facil' })),
                opcao(cfg.nivelBot === 'normal', 'Normal', null, () => atualiza({ nivelBot: 'normal' })))) : null,
            humanos > 1 ? h('label', { class: 'linha check' },

              'Tela de passagem entre os humanos') : null),

        bloco('3 · Avaliação do sócio',
          h('div', { class: 'ops' },
            opcao(cfg.variante === 'padrao', 'Tradicional', 'Soma das cinco frentes + 3 × a mais fraca.', () => atualiza({ variante: 'padrao' })),
            opcao(cfg.variante === 'exigente', 'Sócio Exigente', 'Nenhuma frente pontua mais que 3 acima da mais fraca; sem o bônus.', () => atualiza({ variante: 'exigente' }))),
          h('div', { class: 'ops' },
            opcao(!cfg.criteriosOcultos, 'Critérios à vista', 'Os três Critérios ficam abertos desde o ano 1.', () => atualiza({ criteriosOcultos: false })),
            opcao(!!cfg.criteriosOcultos, 'Critério Oculto', 'Virados até a avaliação final. Só quem chega ao conhecimento 5 espia.', () => atualiza({ criteriosOcultos: true }))),
          h('p', { class: 'nota', texto: 'Você está montando: ' + nomePartida + '.' })),

        h('div', { class: 'acoes' },

          salvo && salvo.estado ? h('button', { type: 'button', onclick: () => store.carregar() },
            salvo.estado.fase === 'fim' ? 'Placar da última partida' : `Continuar (ano ${salvo.estado.rodada})`) : null,
          h('button', { type: 'button', onclick: () => store.atualizarVista({ modal: 'ajuda' }) }, 'Como se joga')),
        h('p', { class: 'versao', texto: `SUIT ${VERSAO_DIGITAL} · ${NOTA_VERSAO}` })));

  /* -------------------------------------------------------------- online: criar ou entrar numa sala */
  function telaOnline(cfg, atualiza, bloco, opcao) {
    const st = REDE.status();
    const cab = h('div', { class: 'cabeca' },
      h('div', { class: 'marca3d' }, logotipoSUIT('2.6rem', '#E0474D', false)),

    const voltar = h('button', { type: 'button', onclick: () => { REDE.sair(); atualiza({ modo: 'mesa' }); } }, 'Voltar');
    const semPeer = typeof Peer === 'undefined' && !(REDE.codigo() || '').startsWith('LOCAL');
    const erro = REDE.erro() ? h('p', { class: 'nota nota--erro', texto: REDE.erro() })

    if (!REDE.online()) {

        bloco('Seu nome (obrigatório)',
          h('div', { class: 'linha' }, h('input', { type: 'text', value: cfg.nomeOnline, maxlength: '14', placeholder: 'Digite seu nome', autofocus: 'autofocus', 'aria-label': 'Seu nome',
            estilo: cfg.erroNome ? { borderColor: '#E0474D' } : null,
            oninput: (ev) => { cfg.nomeOnline = ev.target.value; } })),
          cfg.erroNome ? h('p', { class: 'nota nota--erro', texto: 'Escreva o seu nome antes de criar ou entrar numa sala — é assim que os outros vão te ver na mesa.' })
            : h('p', { class: 'nota', texto: 'É o nome que os outros jogadores vão ver na mesa.' })),
        h('div', { class: 'ops' },
          h('div', { class: 'bloco' }, h('h3', { texto: 'Criar uma sala' }),
            h('p', { class: 'nota', texto: 'Você recebe um código de 6 letras e manda para os amigos. A sua aba precisa ficar aberta: é ela que roda a partida.' }),
            h('button', { type: 'button', class: 'primario largo', onclick: () => { const n = nomeOk(); if (!n) return; REDE.criarSala(n); store.notificar(); } }, 'Criar sala')),
          h('div', { class: 'bloco' }, h('h3', { texto: 'Entrar numa sala' }),
            h('div', { class: 'linha' }, h('input', { type: 'text', class: 'codigo', value: cfg.codigo, maxlength: '9', placeholder: 'CÓDIGO', 'aria-label': 'Código da sala',
              oninput: (ev) => { cfg.codigo = ev.target.value.toUpperCase(); ev.target.value = cfg.codigo; } })),
            h('button', { type: 'button', class: 'largo', onclick: () => { if ((cfg.codigo || '').trim().length < 4) { atualiza({}); return; } const n = nomeOk(); if (!n) return; REDE.entrarNaSala(cfg.codigo, n); store.notificar(); } }, 'Entrar'))),
        erro,
        h('div', { class: 'acoes' }, voltar),
        h('p', { class: 'nota', texto: 'A conexão é direta entre os navegadores (WebRTC). Em algumas redes corporativas ela pode não fechar — nesse caso, um dos dois usa o 4G do celular.' })));
    }

    if (REDE.souConvidado()) {
      const lista = REDE.salaDoConvidado();
      return h('div', { class: 'cenario' }, h('div', { class: 'cenario-caixa' }, cab,
        h('p', { class: 'codigo-grande', texto: REDE.codigo() }),
        h('p', { class: 'nota', texto: st === 'conectando' ? 'Conectando ao anfitrião…' : 'Conectado. Aguardando o anfitrião começar a partida.' }),
        lista.length ? h('ul', { class: 'lista-sala' }, ...lista.map((x) => h('li', null, h('b', { texto: x.nome }), x.anfitriao ? h('small', { texto: ' · anfitrião' }) : null))) : null,
        erro,
        h('div', { class: 'acoes' }, voltar)));
    }

    // anfitrião: lobby + configuração da partida
    const conv = REDE.convidados();
    const humanos = 1 + conv.length;
    const total = Math.max(cfg.n, humanos);
    const vagas = total - humanos;
    return h('div', { class: 'cenario' }, h('div', { class: 'cenario-caixa' }, cab,
      h('p', { class: 'nota', estilo: { textAlign: 'center' }, texto: st === 'abrindo' ? 'Abrindo a sala…' : 'Mande este código para os amigos:' }),
      h('p', { class: 'codigo-grande', texto: REDE.codigo() }),
      bloco('Mesa de quantos?',
        h('div', { class: 'ops ops--5' },
          ...[2, 3, 4, 5, 6].map((n) => opcao(total === n, String(n), null, () => atualiza({ n }), { disabled: n < humanos }))),
        h('p', { class: 'nota', texto: 'Os amigos que entrarem ocupam as cadeiras. Quando você começar, as cadeiras que sobrarem viram bots — ou nenhuma, se todo mundo chegar.' })),
      bloco('Na sala',
        h('ul', { class: 'lista-sala' },
          h('li', null, h('span', { class: 'pino', estilo: { background: CORES_JOGADOR[0].hex } }), h('b', { texto: REDE.nome() }), h('small', { texto: ' · você, anfitrião' })),
          ...conv.map((c, i) => h('li', null, h('span', { class: 'pino', estilo: { background: CORES_JOGADOR[i + 1].hex } }), h('b', { texto: c.nome }), h('small', { texto: ' · conectado' }))),
          ...Array.from({ length: vagas }, (_, i) => h('li', { class: 'vaga' }, h('span', { class: 'pino', estilo: { background: CORES_JOGADOR[humanos + i].hex } }), h('b', { texto: 'Cadeira livre' }), h('small', { texto: ' · aguardando um amigo — vira bot se você começar' })))),
        vagas > 0 ? h('div', { class: 'linha' }, h('label', { texto: 'Nível dos bots' }),
          h('div', { class: 'ops ops--2 ops--mini' },
            opcao(cfg.nivelBot === 'facil', 'Fácil', null, () => atualiza({ nivelBot: 'facil' })),
            opcao(cfg.nivelBot === 'normal', 'Normal', null, () => atualiza({ nivelBot: 'normal' })))) : null),
      bloco('Avaliação do sócio',
        h('div', { class: 'ops' },
          opcao(cfg.variante === 'padrao', 'Tradicional', 'Soma das cinco frentes + 3 × a mais fraca.', () => atualiza({ variante: 'padrao' })),
          opcao(cfg.variante === 'exigente', 'Sócio Exigente', 'Nenhuma frente pontua mais que 3 acima da mais fraca; sem o bônus.', () => atualiza({ variante: 'exigente' }))),
        h('div', { class: 'ops' },
          opcao(!cfg.criteriosOcultos, 'Critérios à vista', 'Abertos desde o ano 1.', () => atualiza({ criteriosOcultos: false })),
          opcao(!!cfg.criteriosOcultos, 'Critério Oculto', 'Virados até a avaliação final.', () => atualiza({ criteriosOcultos: true })))),
      erro,
      h('div', { class: 'acoes' },
        h('button', { type: 'button', class: 'primario', disabled: st !== 'aberta',
          onclick: () => comecarOnline(cfg) }, conv.length === 0 ? `Começar só com bots (${total})` : vagas > 0 ? `Começar com ${humanos} + ${vagas} bot${vagas > 1 ? 's' : ''}` : `Começar com ${humanos}`),
        voltar)));
  }

  function comecarOnline(cfg) {
    const conv = REDE.convidados();
    const humanos = 1 + conv.length;
    const bots = Math.max(0, Math.max(cfg.n, humanos) - humanos);
    const jogadores = [{ nome: REDE.nome(), bot: false }, ...conv.map((c) => ({ nome: c.nome, bot: false })),
      ...Array.from({ length: bots }, (_, i) => ({ nome: NOMES[humanos + i] || `Bot ${i + 1}`, bot: true }))];
    CENA3D.definirMeuIdx(0);
    store.novaPartida({
      jogadores, variante: cfg.variante, criteriosOcultos: cfg.criteriosOcultos, telaDePassagem: false,
      config: { bot_nivel: cfg.nivelBot }, seed: Math.floor(Math.random() * 2 ** 31),
    });
    const s = store.estado; if (!s) return;
    const assentos = { anfitriao: s.jogadores[0].id };
    conv.forEach((c, i) => { assentos[c.peerId] = s.jogadores[i + 1].id; });
    REDE.iniciarPartida(s, assentos);
    ultimoAssento = null;
    store.notificar();
  }

  function comecar(cfg) {
    CENA3D.definirMeuIdx(0);
    const solo = cfg.modo === 'solo';
    const jogadores = solo
      ? [{ nome: (cfg.nomes[0] || '').trim() || 'Você', bot: false }]
      : Array.from({ length: cfg.n }, (_, i) => ({ nome: (cfg.nomes[i] || '').trim() || NOMES[i], bot: !!cfg.bots[i] }));
    store.novaPartida({
      jogadores, variante: cfg.variante, criteriosOcultos: cfg.criteriosOcultos,
      telaDePassagem: solo ? false : cfg.telaDePassagem,
      solo: solo ? { nivel: cfg.nivelHerdeiro } : null,
      config: { bot_nivel: cfg.nivelBot },
      seed: cfg.seed.trim() || Math.floor(Math.random() * 2 ** 31),
    });
  }

  /* -------------------------------------------------------------- HUD */
  function hud(s) {
    const v = store.vista;
    const ator = atorDe(s);
    const j = ator ? jogadorPorId(s, ator) : null;
    const eu = meuJogador(s);
    const humanoNaVez = j && !j.bot && possoAgir(s);
    const podePassar = humanoNaVez && s.fase === 'escritorio' && !s.pendente && !s.acaoExtra;

    // Passar o mouse (ou tocar) num Critério abre a carta inteira: nome, regra e quando vale.
    const cartaCrit = (id, i, visivel) => {
      const c = CATALOGO.criterioPorId[id];
      return h('span', { class: 'crit-carta', role: 'tooltip' },
        h('small', { texto: `Critério do Sócio ${i + 1} de ${s.criterios.length}` }),
        h('b', { texto: visivel ? c.nome : 'Critério virado' }),
        h('p', { texto: visivel ? c.descricao : 'Fica virado até a avaliação final. Quem chega ao conhecimento 5 pode espiar um Critério em segredo.' }),
        h('em', { texto: visivel ? 'Soma pontos na avaliação final do sócio, no fim do ano 6.' : 'Todos os jogadores são avaliados pelos mesmos Critérios.' }));
    };
    const alternarCrit = (ev) => { const el = ev.currentTarget; const ja = el.classList.contains('aberto');
      document.querySelectorAll('.crit.aberto').forEach((x) => x.classList.remove('aberto')); if (!ja) el.classList.add('aberto'); };
    const criterios = s.criteriosOcultos && s.fase !== 'fim'
      ? s.criterios.map((id, i) => {
        const espiado = eu && (eu.espiados || []).includes(i);
        return h('span', { class: 'crit' + (espiado ? ' crit--vi' : ' crit--oculto'), tabindex: '0', onclick: alternarCrit },
          espiado ? CATALOGO.criterioPorId[id].nome : '?', cartaCrit(id, i, espiado));
      })
      : s.criterios.map((id, i) => h('span', { class: 'crit', tabindex: '0', onclick: alternarCrit },
        CATALOGO.criterioPorId[id].nome, cartaCrit(id, i, true)));

    const vistas = CENA3D.vistas(s);
    const topo = h('div', { class: 'hud-topo' },
      h('span', { class: 'marca3d' }, logotipoSUIT('1.2rem', '#E0474D', false)),
      h('span', { class: 'hud-ano' }, 'Ano ', h('b', { texto: String(s.rodada) }), ` de ${s.config.rodadas}`),
      h('span', { class: 'hud-fase', texto: s.acaoExtra ? NOME_FASE.acaoExtra : (NOME_FASE[s.fase] || s.fase) }),
      s.variante === 'exigente' ? h('span', { class: 'hud-eti', texto: 'Sócio Exigente' }) : null,
      REDE.online() ? h('span', { class: 'hud-eti hud-eti--online', title: 'Partida online — código da sala', texto: 'sala ' + REDE.codigo() }) : null,
      h('span', { class: 'hud-crit' }, ...criterios),
      h('div', { class: 'hud-botoes' },
        REDE.souConvidado() ? (possoAgir(s) ? h('button', { type: 'button', title: 'Desfazer a última ação sua', onclick: () => REDE.pedirDesfazer() }, '↶') : null)
          : (store.podeDesfazer() ? h('button', { type: 'button', title: 'Desfazer (Z)', onclick: () => store.desfazer() }, '↶') : null),
        h('button', { type: 'button', 'aria-pressed': String(!!v.logAberto), onclick: () => store.atualizarVista({ logAberto: !v.logAberto }) }, 'Log'),
        h('button', { type: 'button', 'aria-pressed': String(!!v.rivaisAbertos), onclick: () => store.atualizarVista({ rivaisAbertos: !v.rivaisAbertos }) }, 'Placar'),
        h('button', { type: 'button', onclick: () => store.atualizarVista({ modal: 'ajuda' }) }, 'Regras'),
        h('button', { type: 'button', onclick: () => store.atualizarVista({ confirmarNova: true }) }, 'Nova')));

    const camera = h('div', { class: 'hud-camera', role: 'group', 'aria-label': 'Câmera' },
      ...vistas.map((vv) => h('button', { type: 'button', onclick: () => CENA3D.irPara(vv.v) }, vv.rotulo)));

    // a linha de baixo: quem joga, o que fazer, e o último acontecimento
    const ultimos = s.log.slice(-3).map((l) => l.texto);
    const instrucao = !j ? ''
      : j.bot ? `${j.nome} está jogando…`
      : (REDE.online() && !possoAgir(s)) ? `Vez de ${j.nome}. Aguarde…`
      : s.fase === 'escritorio' && !s.pendente
        ? (CEL() ? (s.acaoExtra ? `${j.nome}: última ação do titular — toque no Titular e escolha a sala.` : `${j.nome}: toque numa peça embaixo e escolha a sala.`)
          : (s.acaoExtra ? `${j.nome}: a última ação do titular — clique num espaço livre.` : `${j.nome}: clique num espaço dourado para mandar uma peça, ou passe o ano. Arraste para deslocar a mesa; botão direito gira.`))
      : s.fase === 'pauta' ? `${j.nome}: escolha uma carta da pauta.` : '';
    const caixas = h('div', { class: 'hud-caixas' }, ...s.jogadores.map((jj) => h('span', {
      class: 'caixa' + (jj.id === ator ? ' caixa--vez' : ''), title: `${jj.nome}: $${jj.dinheiro} em caixa` + (jj.divida ? `, deve $${jj.divida}` : '') + ` · ${jj.energia} de energia · conhecimento ${jj.conhecimento}`,
      onclick: () => { const vv = CENA3D.vistas(s).find((x) => x.id === 'j:' + jj.id); if (vv) CENA3D.irPara(vv.v); },
    }, h('i', { estilo: { background: jj.cor.hex } }), h('b', { texto: jj.nome }), h('em', { texto: '$' + jj.dinheiro }),
      jj.divida ? h('small', { class: 'divida', texto: 'deve $' + jj.divida }) : null,
      h('small', { texto: `⚡${jj.energia} · 📖${jj.conhecimento}` }))));
    const baixo = h('div', { class: 'hud-baixo' },
      j ? h('span', { class: 'hud-vez', estilo: { borderColor: j.cor.hex } }, h('i', { estilo: { background: j.cor.hex } }), instrucao) : null,
      podePassar ? h('button', { type: 'button', class: 'passar', onclick: () => store.despachar(ac.passar(j.id)) }, 'Passar o ano') : null,
      h('div', { class: 'hud-log' }, ...ultimos.map((t) => h('div', { texto: t }))));

    return [topo, camera, caixas, baixo];
  }

  /* -------------------------------------------------------------- celular: abas, barra de peças e folha de salas */
  function vistaCelular(s, aba) {
    const az = CENA3D.azAtual();
    // o alvo desce um pouco no tampo para o objeto subir na tela e não ficar sob as barras de baixo
    if (aba === 'tab') return CENA3D.enquadrar(-12 * Math.sin(az), -2 + 12 * Math.cos(az), 60, 40, az, 1.25, 1.04);
    const eu = meuJogador(s); const m = eu && CENA3D.mesaDe(eu.id);
    if (m) return CENA3D.enquadrar(m.x + 5 * Math.sin(m.rot), m.z + 5 * Math.cos(m.rot), 30, 22, m.rot, 1.2, 1.04);
    return CENA3D.enquadrar(0, 0, 60, 40, az, 1.25);
  }
  function irParaAba(s, aba) {
    store.vista.aba = aba;
    if (aba === 'tab' || aba === 'minha') { store.vista.rivaisAbertos = false; store.vista.menuAberto = false; CENA3D.irPara(vistaCelular(s, aba)); }
    if (aba === 'rivais') { store.vista.rivaisAbertos = true; store.vista.menuAberto = false; }
    if (aba === 'menu') { store.vista.menuAberto = true; store.vista.rivaisAbertos = false; }
    store.notificar();
  }
  function abasCelular(s) {
    const v = store.vista; const aba = v.aba || 'tab';
    const item = (id, rotulo, icone) => h('button', { type: 'button', 'aria-pressed': String(aba === id), onclick: () => irParaAba(s, id) }, h('i', { texto: icone }), rotulo);
    return h('nav', { class: 'abas' }, item('tab', 'Tabuleiro', '▦'), item('minha', 'Minha mesa', '▤'), item('rivais', 'Rivais', '☷'), item('menu', 'Menu', '≡'));

  function menuCelular(s) {

  /* -------------------------------------------------------------- a Pauta: as cartas reais, grandes, no meio da tela */
  function pauta3d(s) {
    const j = s.jogadores[s.ordem[s.draft.turno]];
    if (j.bot) return null;

        aviso,
        // A escolha da Pauta depende da mesa: cliente da mesma área barateia o processo.
        h('div', { class: 'pauta-mesa' },
          h('div', null, h('h4', { texto: `Seus clientes (${j.clientes.length})` }),
            j.clientes.length ? h('div', { class: 'fila' }, ...j.clientes.map((cl) => h('div', null,
              h('img', { src: CENA3D.textura(cl.cartaId), alt: CATALOGO.porId[cl.cartaId].nome, title: `${CATALOGO.porId[cl.cartaId].nome} — ${CATALOGO.porId[cl.cartaId].area}, nível ${cl.nivel} (clique para ampliar)`,
                onclick: () => store.atualizarVista({ lupa: cl.cartaId }) }),
              h('small', { class: 'nv', texto: `${CATALOGO.porId[cl.cartaId].area} · nível ${cl.nivel}` }))))
              : h('p', { class: 'vazio', texto: 'Nenhum cliente ainda.' })),
          h('div', null, h('h4', { texto: `Seus processos em andamento (${j.carteira.length})` }),
            j.carteira.length ? h('div', { class: 'fila' }, ...j.carteira.map((pc) => h('div', null,
              h('img', { src: CENA3D.textura(pc.cartaId), alt: CATALOGO.porId[pc.cartaId].nome, title: `${CATALOGO.porId[pc.cartaId].nome} — prazo ${pc.cubos} (clique para ampliar)`,
                onclick: () => store.atualizarVista({ lupa: pc.cartaId }) }),
