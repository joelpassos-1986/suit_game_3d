      h('div', { class: 'mercado' }, ...s.mercadoClientes.map((id) => cartaCliente(id, 3, {
        aoClicar: () => mudar({ cliente: id }),
        selecionada: sel === id,
      }))),
      escolhido ? previa([
        { texto: `−${dinheiro(custo)}`, positivo: false },
        { texto: `caixa ${dinheiro(j.dinheiro)} → ${dinheiro(j.dinheiro - custo)}` },
        { texto: `+${dinheiro(s.config.renda_cliente_nv3)} no Fechamento deste ano`, positivo: true },
        { texto: `−1 energia em processos de ${escolhido.area}`
          + (jaTemDaArea ? ' (você já tinha um dessa área: o desconto não acumula)' : ''),
          positivo: !jaTemDaArea },
      ]) : null),
      painelMinhaMesa(s, j, sel)),
    h('div', { class: 'linha-flex' },
      h('span', { class: 'esquerda', texto: `Você terá ${j.clientes.length + (sel ? 1 : 0)} de ${s.config.limite_clientes} clientes.` }),
      botaoDesfazer('↶ Desfazer a ida à Agência'),
      // A cavada fica ao lado da captação, não escondida: a escolha entre as
      // duas é a decisão da sala, e o preço tem de estar visível antes de
      // clicar — depois de clicar não há volta.
      h('button', {
        class: 'btn btn--fantasma', type: 'button',
        disabled: !podeCavar, title: motivoCavar,
        onclick: () => store.despachar(ac.recepcaoCavar()),
      }, `Não quero nenhum: cavar por ${dinheiro(s.config.custo_cavar_cliente)}`),
      h('button', {
        class: 'btn', type: 'button', disabled: !sel,
        onclick: () => store.despachar(ac.recepcaoEscolher(sel)),
      }, sel ? `Pagar ${dinheiro(custo)} e assinar com ${escolhido.nome}` : 'Escolha um cliente')), 'largo');
}

/* ------------------------------------------------------------------ *
 * Fórum — o coração do jogo
 * ------------------------------------------------------------------ */

function resumoGanho(carta) {
  return Object.entries(carta.rep).map(([f, pts]) => `+${pts} ${f}`).join(' · ');
}

/** v9: o que a ficha está cobrindo — conhecimento, energia ou os dois. */
function faltaDoAtalho(av) {
  const partes = [];
  if (av.faltaConhecimento > 0) partes.push(`${av.faltaConhecimento} de conhecimento`);
  if (av.faltaEnergia > 0) partes.push(`${av.faltaEnergia} de energia`);
  return partes.join(' e ');
}
function motivoAtalho(av) {
  return `Falta ${faltaDoAtalho(av)} — custa 1 ficha de Conduta`;
}

function modalForum(s, j) {
  const e = escolha();
  const primeiro = e.primeiro || null;
  const segundo = e.segundo || null;
  const cfg = s.config;

  const opcoes = processosResolviveis(s, j);
  const cartaPrimeiro = primeiro ? processo(primeiro) : null;
  const usaAtalho1 = primeiro ? opcoes.find((o) => o.cartaId === primeiro).exigeAtalho : false;

  // Custos já com o desconto de área (−1 por carta, piso de 1).
  const custo1 = cartaPrimeiro ? custoEnergiaDe(s, j, cartaPrimeiro) : 0;

  // Energia comprometida caso o jogador leve um segundo processo — usa o custo
  // já descontado do primeiro, senão o motor e a tela discordariam.
  const comprometida = cartaPrimeiro ? custo1 + cfg.energia_extra_segundo_processo : 0;
  // v9: o segundo processo da ida não aceita atalho — só entram os limpos.
  const opcoesSegundo = cartaPrimeiro
    ? processosResolviveis(s, j, comprometida)
      .filter((o) => o.cartaId !== primeiro)
      .map((o) => ({ ...o, jogavel: o.semAtalho.ok, exigeAtalho: false }))
    : [];
  const usaAtalho2 = segundo
    ? (opcoesSegundo.find((o) => o.cartaId === segundo) || {}).exigeAtalho : false;

  const cartaSegundo = segundo ? processo(segundo) : null;
  const custo2 = cartaSegundo ? custoEnergiaDe(s, j, cartaSegundo) : 0;
  const desconto1 = cartaPrimeiro ? cartaPrimeiro.energia - custo1 : 0;
  const desconto2 = cartaSegundo ? cartaSegundo.energia - custo2 : 0;
  const custoTotal = custo1 + (cartaSegundo ? custo2 + cfg.energia_extra_segundo_processo : 0);
  const ganhoDinheiro = (cartaPrimeiro ? cartaPrimeiro.honorario : 0)
    + (cartaSegundo ? cartaSegundo.honorario : 0);
  const ganhoRep = {};
  for (const c of [cartaPrimeiro, cartaSegundo]) {
    if (!c) continue;
    for (const [f, pts] of Object.entries(c.rep)) ganhoRep[f] = (ganhoRep[f] || 0) + pts;
  }
  const fichas = (usaAtalho1 ? 1 : 0) + (usaAtalho2 ? 1 : 0);
  const condutaFinal = j.conduta + fichas;

  const listaCartas = (lista, selecionado, aoEscolher) => h('div', { class: 'cartas' },
    ...lista.map((o) => cartaProcesso(o.cartaId, {
      cubos: (j.carteira.find((c) => c.cartaId === o.cartaId) || {}).cubos,
      selecionada: selecionado === o.cartaId,
      bloqueada: !o.jogavel,
      atalho: o.exigeAtalho,
      energiaEfetiva: custoEnergiaDe(s, j, o.carta),
      motivo: o.jogavel
        ? (o.exigeAtalho ? motivoAtalho(o.comAtalho) : '')
        : o.semAtalho.motivos[0],
      aoClicar: o.jogavel ? () => aoEscolher(selecionado === o.cartaId ? null : o.cartaId) : null,
    })));

  const corpo = h('div', null,
    h('p', { class: 'dica', texto: 'Exigência da carta, conhecimento, energia — nessa ordem. '
      + 'Só depois vêm o honorário e as duas frentes de reputação.' }),
    j.carteira.length === 0
      ? h('p', { class: 'vazio', texto: 'Sua mesa está vazia. Esta ida ao Fórum não rende nada.' })
      : listaCartas(opcoes, primeiro, (id) => mudar({ primeiro: id, segundo: null })),

    cartaPrimeiro && opcoesSegundo.some((o) => o.jogavel) ? h('div', null,
      h('h4', { estilo: { marginTop: '.9rem', fontSize: '.9rem' },
        texto: `Levar um segundo processo na mesma ida (+${cfg.energia_extra_segundo_processo} de energia)` }),
      h('p', { class: 'dica', texto: 'Opcional. Todas as exigências do segundo também precisam ser cumpridas.' }),
      listaCartas(opcoesSegundo, segundo, (id) => mudar({ segundo: id }))) : null,

    fichas > 0 ? h('div', { class: 'aviso' },
      h('h4', { texto: 'Atalho ético' }),
      h('p', { estilo: { margin: 0 },
        texto: `Falta ${faltaDoAtalho(opcoes.find((o) => o.cartaId === primeiro).comAtalho)}. Você pode concluir assim mesmo pegando `
          + `${fichas} ficha${fichas > 1 ? 's' : ''} de Conduta: ficará com `
          + `${condutaFinal} ficha${condutaFinal > 1 ? 's' : ''}, `
          + `o que vale ${condutaFinal * cfg.conduta_por_ficha} pontos no fim.` }),
      condutaFinal >= cfg.conduta_limite
        ? h('p', { estilo: { margin: '.3rem 0 0', fontWeight: '700' },
          texto: `Com ${cfg.conduta_limite} fichas você não pode mais ser sócio: `
            + 'sua avaliação é ignorada e você fica atrás de todos os outros.' })
        : h('p', { estilo: { margin: '.3rem 0 0' },
          texto: `A ${cfg.conduta_limite}ª ficha desqualifica.` })) : null,

    desconto1 + desconto2 > 0 ? h('div', { class: 'nota' },
      h('b', { texto: 'Desconto de área: ' }),
      (desconto1 > 0 ? `você tem cliente de ${cartaPrimeiro.area}, então "${cartaPrimeiro.nome}" `
        + `custa ${custo1} em vez de ${cartaPrimeiro.energia}. ` : '')
      + (desconto2 > 0 ? `"${cartaSegundo.nome}" custa ${custo2} em vez de ${cartaSegundo.energia}. ` : '')
      + 'O desconto é de 1 por processo, em qualquer nível de satisfação, e nunca leva abaixo de 1.')
      : null,

    cartaPrimeiro ? previa([
      { texto: `−${custoTotal} energia`, positivo: false },
      { texto: `energia ${j.energia} → ${Math.max(0, j.energia - custoTotal)}` },
      { texto: `+${dinheiro(ganhoDinheiro)}`, positivo: true },
      ...Object.entries(ganhoRep).map(([f, v]) => ({ texto: `+${v} ${f}`, positivo: true })),
      fichas ? { texto: `+${fichas} Conduta`, positivo: false } : null,
    ].filter(Boolean)) : null);

  const rodape = h('div', { class: 'linha-flex', estilo: { width: '100%' } },
    h('span', { class: 'esquerda',
      texto: cartaPrimeiro ? `${cartaPrimeiro.nome}${cartaSegundo ? ' + ' + cartaSegundo.nome : ''}`
        : 'Nenhum processo selecionado' }),
    botaoDesfazer('↶ Desfazer a ida ao Fórum'),
    h('button', {
      class: 'btn btn--neutro', type: 'button',
      title: 'A peça fica no Fórum, mas nada é concluído.',
      onclick: () => store.despachar(ac.forumResolver(null)),
    }, 'Não concluir nada'),
    h('button', {
      class: 'btn' + (fichas ? ' btn--perigo' : ''), type: 'button', disabled: !primeiro,
      onclick: () => store.despachar(ac.forumResolver(
        primeiro, usaAtalho1,
        segundo ? { processoId: segundo, usarAtalhoEtico: usaAtalho2 } : null)),
    }, fichas ? `Protocolar assim mesmo (${fichas} ficha${fichas > 1 ? 's' : ''})` : 'Protocolar'));

  return moldura('Fórum', `${j.nome} · energia ${j.energia} · conhecimento ${j.conhecimento}`, corpo, rodape);
}

/* ------------------------------------------------------------------ *
 * Sala de reunião
 * ------------------------------------------------------------------ */

function modalReuniao(s, j) {
  const e = escolha();
  const cfg = s.config;
  const podeC = podeContratar(s, j);
  const podeP = podePromover(s, j);
  const promoviveis = estagiariosPromoviveis(s, j);
  const selEstagiario = e.estagiario || (promoviveis[0] && promoviveis[0].id) || null;

  const corpo = h('div', { class: 'opcoes' },
    h('button', {
      class: 'opcao', type: 'button', disabled: !podeC,
      onclick: () => store.despachar(ac.reuniao('contratar')),
    },
      h('span', { estilo: { fontSize: '1.4rem' }, texto: '🧑‍🎓' }),
      h('span', null,
        h('b', { texto: 'Contratar um estagiário' }),
        h('span', { texto: 'Fica aqui na Sala de reunião, encaixado sob o seu disco — a torre '
          + 'ocupa um espaço só — e volta com você no Fechamento. Custa uma ação agora e devolve '
          + `uma ação a partir do ano que vem. Salário de ${dinheiro(cfg.salario_estagiario)} por Fechamento.` }),
        !podeC ? h('span', { estilo: { color: 'var(--perda)' },
          texto: j.dinheiro < cfg.custo_contratar_estagiario
            ? 'Caixa insuficiente.' : 'Equipe cheia.' }) : null),
      h('span', { class: 'preco', texto: dinheiro(cfg.custo_contratar_estagiario) })),

    h('button', {
      class: 'opcao', type: 'button', disabled: !podeP || !selEstagiario,
      onclick: () => store.despachar(ac.reuniao('promover', selEstagiario)),
    },
      h('span', { estilo: { fontSize: '1.4rem' }, texto: '⚖️' }),
      h('span', null,
        h('b', { texto: 'Promover um estagiário a advogado' }),
        h('span', { texto: 'A peça já é sua: age neste mesmo ano, se ainda estiver livre. '
          + `Passa a fazer audiência — e a custar ${dinheiro(cfg.salario_advogado)} por Fechamento.` }),
        !podeP ? h('span', { estilo: { color: 'var(--perda)' },
          texto: j.dinheiro < cfg.custo_promover_advogado
            ? 'Caixa insuficiente.' : 'Nenhum estagiário livre neste ano.' }) : null),
      h('span', { class: 'preco', texto: dinheiro(cfg.custo_promover_advogado) })));

  if (podeP && promoviveis.length > 1) {
    corpo.appendChild(h('div', { estilo: { marginTop: '.6rem' } },
      h('span', { class: 'dica', texto: 'Qual estagiário promover: ' }),
      h('div', { class: 'linha-flex' }, ...promoviveis.map((p, i) => h('button', {
        class: 'btn ' + (selEstagiario === p.id ? '' : 'btn--neutro'), type: 'button',
        onclick: () => mudar({ estagiario: p.id }),
      }, `Estagiário ${i + 1}`)))));
  }

  const rodape = h('div', { class: 'linha-flex', estilo: { width: '100%' } },
    h('span', { class: 'esquerda',
      texto: `Caixa ${dinheiro(j.dinheiro)} · equipe ${j.pecas.length}/${cfg.limite_pecas} · `
        + `folha atual ${dinheiro(folhaSalarial(s, j))}` }),
    botaoDesfazer('↶ Desfazer a ida à Sala de reunião'));

  return moldura('Sala de reunião', `${j.nome} · só o titular entra aqui`, corpo, rodape, false);
}

/* ------------------------------------------------------------------ *
 * Cafezinho
 * ------------------------------------------------------------------ */

function modalCafezinho(s, j) {
  const cfg = s.config;
  const sel = escolha().clientes || [];
  const subiveis = j.clientes;
  const pagaNoMax = cfg.cafe_cliente_no_maximo_paga || 0;
  const noMax = sel.filter((id) => (j.clientes.find((c) => c.cartaId === id) || {}).nivel >= cfg.cliente_nivel_max).length;
  const energiaFinal = Math.min(j.energia + cfg.cafezinho_energia, cfg.energia_max);

  const alternar = (id) => {
    const atual = sel.includes(id) ? sel.filter((x) => x !== id) : sel.concat(id);
    if (atual.length > cfg.cafezinho_clientes) return;
    mudar({ clientes: atual });
  };

  const corpo = h('div', null,
    previa([
      { texto: `+${cfg.cafezinho_energia} energia`, positivo: true },
      { texto: `energia ${j.energia} → ${energiaFinal}${energiaFinal === cfg.energia_max && j.energia + cfg.cafezinho_energia > cfg.energia_max ? ' (teto)' : ''}` },
      noMax > 0 ? { texto: `+${dinheiro(noMax * pagaNoMax)} dos clientes já satisfeitos`, positivo: true } : null,
    ].filter(Boolean)),
    h('p', { class: 'dica', estilo: { marginTop: '.6rem' },
      texto: `Suba 1 nível em até ${cfg.cafezinho_clientes} clientes seus. `
        + `Cliente que já está no nível ${cfg.cliente_nivel_max} não sobe: paga ${dinheiro(pagaNoMax)} na hora. `
        + 'Cliente que chega a 0 no Fechamento vai embora e custa 1 de Relacionamento.' }),
    j.clientes.length === 0
      ? h('p', { class: 'vazio', texto: 'Você ainda não tem clientes — hoje o café é só café.' })
      : h('div', { class: 'mercado' }, ...j.clientes.map((c) => cartaCliente(c.cartaId, c.nivel, {
        aoClicar: () => alternar(c.cartaId),
        selecionada: sel.includes(c.cartaId),
        bloqueada: false,
        titulo: c.nivel >= cfg.cliente_nivel_max ? `Já está no nível ${cfg.cliente_nivel_max}: paga ${dinheiro(pagaNoMax)}` : 'Subir para o nível ' + (c.nivel + 1),
      }))));

  const rodape = h('div', { class: 'linha-flex', estilo: { width: '100%' } },
    h('span', { class: 'esquerda',
      texto: `${sel.length} de ${Math.min(cfg.cafezinho_clientes, subiveis.length)} clientes selecionados` }),
    botaoDesfazer('↶ Desfazer a ida ao Cafezinho'),
    h('button', {
      class: 'btn', type: 'button',
      onclick: () => store.despachar(ac.cafezinho(sel)),
    }, sel.length ? `Tomar o café e cuidar de ${sel.length} cliente(s)` : 'Só o café'));

  return moldura('Cafezinho', `${j.nome} · onde a conversa real acontece`, corpo, rodape);
}

/* ------------------------------------------------------------------ *
 * A espiada nos Critérios (variante Critério Oculto)
 * ------------------------------------------------------------------ */

function modalEspiar(s, j) {
  const jaViu = j.espiados || [];
  const restam = s.criterios.length - jaViu.length;

  const corpo = h('div', null,
    h('p', { class: 'dica', estilo: { marginBottom: '.7rem' },
      texto: `Conhecimento ${j.conhecimento}. Você leu o suficiente para saber o que `
        + 'anda circulando entre os sócios. Escolha um Critério ainda virado e olhe — '
        + 'só você vê. A mesa vai saber que você olhou, e qual posição, mas não o quê.' }),
    h('div', { class: 'criterios-grid' },
      ...s.criterios.map((id, i) => {
        const visto = jaViu.includes(i);
        const c = CATALOGO.criterioPorId[id];
        if (visto) {
          return h('div', { class: 'criterio', estilo: { opacity: '.75' } },
            h('b', { texto: `${i + 1}. ${c.nome}` }),
            h('span', { texto: c.descricao }),
            h('span', { estilo: { color: 'var(--ouro)', fontSize: '.6rem' },
              texto: 'você já olhou este' }));
        }
        return h('button', {
          class: 'criterio criterio--virado', type: 'button',
          estilo: { width: '9rem', minHeight: '5rem', cursor: 'pointer' },
          onclick: () => store.despachar(ac.espiar(i)),
          'aria-label': `Olhar o Critério ${i + 1}`,
        }, h('span', null, h('b', { estilo: { fontSize: '1.6rem', display: 'block' }, texto: '?' }),
          h('span', { estilo: { fontSize: '.68rem' }, texto: `Critério ${i + 1}` })));
      })));

  const rodape = h('div', { class: 'linha-flex', estilo: { width: '100%' } },
    h('span', { class: 'esquerda',
      texto: restam === 1 ? 'É o último que falta.' : `${restam} ainda virados.` }),
    botaoDesfazer('↶ Desfazer a ida à Biblioteca'));

  return moldura('Uma espiada nos Critérios do Sócio',
    `${j.nome} · a recompensa de quem estuda depois de já saber o suficiente`,
    corpo, rodape);
}

/* ------------------------------------------------------------------ *
 * Descarte de excedente da carteira

function modalDescarte(s, j) {
  const cfg = s.config;
  const sel = escolha().descarte || [];
  const precisa = j.carteira.length - cfg.limite_carteira;

  const alternar = (id) => {

    mudar({ descarte: atual });

  return moldura('Mesa cheia', `${j.nome} · limite de ${cfg.limite_carteira} processos`,
    h('div', null,
      h('p', { class: 'dica',
        texto: `Devolva ${precisa} processo(s). Não custa reputação — carta devolvida no draft não vence de prazo.` }),
      h('div', { class: 'cartas' }, ...j.carteira.map((item) => cartaProcesso(item.cartaId, {
        cubos: item.cubos,
        selecionada: sel.includes(item.cartaId),
        aoClicar: () => alternar(item.cartaId),

      h('span', { class: 'esquerda', texto: `${sel.length}/${precisa} selecionados` }),
      h('button', {
        class: 'btn', type: 'button', disabled: sel.length !== precisa,
        onclick: () => store.despachar(ac.draftDescartar(j.id, sel)),
      }, 'Devolver')));
}

function renderModal(s) {
  const vista = store.vista;
  if (vista.modal === 'ajuda') return modalAjuda();
  if (vista.modal === 'debug') return modalDebug(s);
  if (!s.pendente) return null;

  const atorId = atorDe(s);
  const j = s.jogadores.find((x) => x.id === atorId);
  if (!j) return null;
  // O bot resolve a própria pendência sozinho; abrir o diálogo dele só piscaria
  // na tela. O que ele fez aparece no log, em linguagem natural.
  if (j.bot) return null;

  switch (s.pendente.tipo) {
    case 'recepcao':
    case 'recepcao_cavada': return modalRecepcao(s, j);
    case 'forum': return modalForum(s, j);
    case 'reuniao': return modalReuniao(s, j);
    case 'cafezinho': return modalCafezinho(s, j);
    case 'espiar': return modalEspiar(s, j);
    case 'descarte_excedente': return modalDescarte(s, j);
    case 'demitir': return modalDemitir(s, j);
    default: return null;
  }
}

const ORDEM_SALAS = ['biblioteca', 'recepcao', 'forum', 'reuniao', 'cafezinho'];

function espacoOcupado(s, ocupante, salaId) {
  // Os discos do Dr. Vieira não pertencem a jogador nenhum.
  if (ocupante.jogadorId === ID_HERDEIRO) {
    return h('span', {
      class: 'espaco espaco--ocupado',
      title: 'Advogado do ' + NOME_HERDEIRO + ' — esta vaga saiu da sua mão',
    }, h('span', { class: 'disco', estilo: { background: COR_HERDEIRO.hex, color: '#fff' } }, 'V'));
  }
  const dono = jogadorPorId(s, ocupante.jogadorId);
  const peca = dono.pecas.find((p) => p.id === ocupante.pecaId);
  const tipo = peca ? peca.tipo : 'estagiario';

  // O contratado fica encaixado sob o disco do titular: a torre inteira ocupa
  // um espaço só, então ele é desenhado aqui e não na área de equipe (§6.3).
  const sob = (salaId === 'reuniao' && tipo === 'titular')
    ? dono.pecas.filter((p) => p.local === 'reuniao') : [];

  return h('span', {
    class: 'espaco espaco--ocupado' + (sob.length ? ' espaco--torre' : ''),
    title: sob.length
      ? `${NOME_PECA[tipo]} de ${dono.nome} com ${sob.length} contratado(s) — a torre ocupa um espaço só`
      : `${NOME_PECA[tipo]} de ${dono.nome}`,
  },
    ...sob.map(() => h('span', { class: 'disco disco--contratado', estilo: { background: dono.cor.hex } }, 'E')),
    disco(dono, tipo, `${NOME_PECA[tipo]} de ${dono.nome}`));
}

function espacoLivre(s, salaId, indice) {
  const vista = store.vista;
  const atorId = atorDe(s);
  const jogador = atorId ? jogadorPorId(s, atorId) : null;
  const selecionada = vista.pecaSelecionada;

    return h('span', { class: 'espaco espaco--livre', title: 'Espaço livre' });

function sala(s, salaId) {
  const def = CATALOGO.salaPorId[salaId];

// ui/mesa.js — a mesa do advogado: painel completo do jogador da vez.


/** Áreas do direito na pilha de concluídos, da mais frequente para a menos. */
function areasVencidas(j) {
  const mapa = new Map();
  for (const id of j.vencidos) {
    const a = processo(id).area;
    mapa.set(a, (mapa.get(a) || 0) + 1);
  }
  return [...mapa.entries()].sort((x, y) => y[1] - x[1]);
}

/** Quantos contratados estão aguardando na Sala de reunião, fora da mesa. */
function naSalaDeReuniao(j) {
  return j.pecas.filter((p) => p.local === 'reuniao').length;
}

function equipe(s, j, ehVez) {
  const vista = store.vista;
  const podeSelecionar = ehVez && s.fase === 'escritorio' && !s.pendente;

  // A peça recém-contratada não aparece aqui: ela está na Sala de reunião, sob
  // o disco do titular, e só volta para a mesa no Fechamento (§6.3).
  const naMesa = j.pecas.filter((p) => p.local !== 'reuniao');

  return h('div', { class: 'equipe' }, ...naMesa.map((p) => {
    const livre = p.disponivel && p.alocado === null;
    const classes = ['peca'];
    if (!p.disponivel) classes.push('peca--deitada');
    else if (p.alocado) classes.push('peca--alocada');
    else if (podeSelecionar) classes.push('peca--livre');
    if (vista.pecaSelecionada === p.id) classes.push('peca--selecionada');

    const titulo = !p.disponivel
      ? 'Recém-contratado: só age no ano que vem'
      : p.alocado ? `Já está em ${s.salas[p.alocado].nome} — não sai até o Fechamento`
      : podeSelecionar ? 'Clique para escolher esta peça' : NOME_PECA[p.tipo];

    return h(podeSelecionar && livre ? 'button' : 'div', {
      class: classes.join(' '),
      type: podeSelecionar && livre ? 'button' : null,
      title: titulo,
      onclick: podeSelecionar && livre
        ? () => store.atualizarVista({
          pecaSelecionada: vista.pecaSelecionada === p.id ? null : p.id,
        })
        : null,
    },
      h('span', {
        class: 'disco' + (p.tipo === 'titular' ? ' disco--titular' : ''),
        estilo: { background: j.cor.hex },
        texto: GLIFO_PECA[p.tipo],
      }),
      h('span', { class: 'rotulo', texto: NOME_PECA[p.tipo] }),
      p.alocado ? h('span', { estilo: { fontSize: '.6rem', color: 'var(--neutro)' },
        texto: s.salas[p.alocado].nome }) : null,
      !p.disponivel ? h('span', { estilo: { fontSize: '.6rem', color: 'var(--alerta)' },
        texto: 'deitado' }) : null);
  }));
}

function carteira(s, j, ehVez) {
  if (j.carteira.length === 0) {
    return h('p', { class: 'vazio', texto: 'Mesa vazia — nada para concluir.' });
  }
  const avaliacoes = ehVez ? processosResolviveis(s, j) : [];
  return h('div', { class: 'cartas' }, ...j.carteira.map((item) => {
    const av = avaliacoes.find((a) => a.cartaId === item.cartaId);
    return cartaProcesso(item.cartaId, {
      cubos: item.cubos,
      atalho: av ? av.exigeAtalho : false,
      bloqueada: ehVez && av ? !av.jogavel : false,
      motivo: ehVez && av && !av.jogavel ? av.semAtalho.motivos[0] : '',
      energiaEfetiva: custoEnergiaDe(s, j, processo(item.cartaId)),
    });
  }));
}

function renderMesa(s) {
  const atorId = atorDe(s);
  const j = s.jogadores.find((x) => x.id === atorId) || s.jogadores[s.ordem[0]];
  const ehVez = j.id === atorId;
  const cfg = s.config;
  const clientesNivel3 = j.clientes.filter((c) => c.nivel === 3).length;

  const podePassar = ehVez && s.fase === 'escritorio' && !s.pendente && !j.passou;

  return h('div', null,
    h('div', { class: 'mesa-cabeca' },
      h('span', { class: 'pino', estilo: { background: j.cor.hex } }),
      h('h2', { texto: j.nome }),
      s.ordem[0] === s.jogadores.indexOf(j)
        ? h('span', { class: 'etiqueta etiqueta--primeiro', texto: 'primeiro' }) : null,
      j.bot ? h('span', { class: 'etiqueta etiqueta--bot', texto: 'bot' }) : null,
      ehVez ? h('span', { class: 'etiqueta', estilo: { background: 'var(--acento)', color: '#fff' },
        texto: j.bot ? 'jogando…' : 'sua vez' }) : null),

    painelAvaliacao(j),

    h('div', { class: 'recursos' },
      recurso('Caixa', dinheiro(j.dinheiro)),
      j.divida > 0 ? recurso('Dívida', dinheiro(j.divida), null, 'recurso--perda') : null,
      recurso('Conhecimento', j.conhecimento, pips(j.conhecimento, cfg.conhecimento_max)),
      recurso('Energia', j.energia, pips(j.energia, cfg.energia_max, 'pips--energia'))),

    j.conduta > 0 ? h('div', { class: 'painel' },
      h('header', null, h('h3', { estilo: { color: 'var(--perda)' }, texto: 'Fichas de Conduta' }),
        h('span', { class: 'ml-auto', estilo: { fontSize: '.7rem', color: 'var(--perda)' },
          texto: `${j.conduta * cfg.conduta_por_ficha} pontos` })),
      h('div', { class: 'corpo' },
        h('div', { class: 'postits' },
          ...Array.from({ length: j.conduta }, () => h('span', { class: 'postit', texto: 'CONDUTA' }))),
        j.conduta >= cfg.conduta_limite - 1 && j.conduta < cfg.conduta_limite
          ? h('p', { class: 'dica', estilo: { color: 'var(--perda)', marginTop: '.4rem' },
            texto: 'A próxima ficha desqualifica você da disputa pela sociedade.' })
          : null,
        j.conduta >= cfg.conduta_limite
          ? h('p', { class: 'dica', estilo: { color: 'var(--perda)', marginTop: '.4rem', fontWeight: '700' },
            texto: 'Desqualificado: sua avaliação será ignorada na escolha do sócio.' })
          : null)) : null,

    h('section', { class: 'painel' },
      h('header', null, h('h3', { texto: 'Equipe' }),
        h('span', { class: 'ml-auto', estilo: { fontSize: '.68rem', color: 'var(--neutro)' },
          texto: `${j.pecas.length}/${cfg.limite_pecas} peças` })),
      h('div', { class: 'corpo' },
        equipe(s, j, ehVez),
        naSalaDeReuniao(j) > 0
          ? h('p', { class: 'dica', estilo: { marginTop: '.45rem', color: 'var(--alerta)' },
            texto: `${naSalaDeReuniao(j)} recém-contratado(s) aguardando na Sala de reunião — `
              + 'voltam para a sua mesa no Fechamento e trabalham a partir do ano que vem.' })
          : null,
        ehVez && s.fase === 'escritorio' && !s.pendente
          ? h('p', { class: 'dica', estilo: { marginTop: '.45rem' },
            texto: store.vista.pecaSelecionada
              ? 'Agora escolha um espaço aceso no tabuleiro.'
              : 'Escolha uma peça para ver onde ela pode ir.' })
          : null)),

    h('section', { class: 'painel' },
      h('header', null, h('h3', { texto: 'Processos na sua mesa' }),
        h('span', { class: 'ml-auto', estilo: { fontSize: '.68rem', color: 'var(--neutro)' },
          texto: `${j.carteira.length}/${cfg.limite_carteira}` })),
      h('div', { class: 'corpo' }, carteira(s, j, ehVez))),

    h('section', { class: 'painel' },
      h('header', null, h('h3', { texto: 'Clientes' }),
        h('span', { class: 'ml-auto', estilo: { fontSize: '.68rem', color: 'var(--neutro)' },
          texto: `${j.clientes.length}/${cfg.limite_clientes}` })),
      h('div', { class: 'corpo' },
        j.clientes.length === 0
          ? h('p', { class: 'vazio', texto: 'Nenhum cliente. A Agência de marketing resolve isso.' })
          : h('div', { class: 'mercado' },
            ...j.clientes.map((c) => cartaCliente(c.cartaId, c.nivel))))),

    h('section', { class: 'painel' },
      h('header', null, h('h3', { texto: 'Processos concluídos' }),
        h('span', { class: 'ml-auto', estilo: { fontSize: '.68rem', color: 'var(--neutro)' },
          texto: `${j.vencidos.length} carimbados` })),
      h('div', { class: 'corpo' },
        j.vencidos.length === 0
          ? h('p', { class: 'vazio', texto: 'Reputação só vem de processo concluído.' })
          : h('div', { class: 'linha-flex' }, ...areasVencidas(j).map(([area, n]) =>
            h('span', {
              class: 'etiqueta',
              estilo: { background: COR_AREA[area] || 'var(--neutro)', color: '#fff' },
              texto: `${area} ${n}`,
            }))))),

    h('div', { class: 'acoes-turno' },
      podePassar
        ? h('button', {
          class: 'btn btn--neutro', type: 'button',
          title: 'Passar é legítimo: você não coloca mais peças neste ano.',
          onclick: () => store.despachar(ac.passar(j.id)),
        }, 'Passar o ano')
        : null,
      store.podeDesfazer()
        ? h('button', {
          class: 'btn btn--fantasma', type: 'button',
          onclick: () => store.desfazer(),
        }, '↶ Desfazer')
        : null,
      clientesNivel3 > 0
        ? h('span', { class: 'dica', texto: `${clientesNivel3} cliente(s) no nível 3 rendem $${clientesNivel3 * 2}/ano` })
        : null));
}

const NOMES_SUGERIDOS = ['Ana', 'Bruno', 'Carla', 'Davi', 'Elisa', 'Fábio'];

/** A variante escolhida — só para deixar o `aria-pressed` legível acima. */
const cfta = (cfg) => cfg.variante;

/**
 * As duas escolhas são independentes, então existem quatro partidas possíveis.
 * Mostrar o nome da combinação na hora evita a confusão de achar que
 * "Critério Oculto" substitui a variante em vez de se somar a ela.
 */
function nomeDaPartida(cfg) {
  const base = cfg.variante === 'exigente' ? 'Sócio Exigente' : 'Padrão';
  if (!cfg.criteriosOcultos) return base + ' — critérios à vista.';
  return base + ' + Critério Oculto'
    + (cfg.variante === 'exigente'
      ? ' — a combinação mais dura das quatro: você não pode se especializar '
        + 'nem sabe o que o sócio quer.'
      : ' — mesma conta de sempre, mas jogando no escuro.');
}

          h('p', { class: 'dica', estilo: { margin: '.7rem 0 0' },

        // do jogo são indistinguíveis, e foi assim que um baralho inteiro foi
        // impresso e recortado com a arte errada.
        h('p', { class: 'dica', estilo: { textAlign: 'center', marginTop: '1.2rem' },
          texto: `SUIT ${VERSAO_DIGITAL} · ${NOTA_VERSAO}` }))));
}

function telaPassagem(s, jogadorId) {
  const j = s.jogadores.find((x) => x.id === jogadorId);
  return h('div', { class: 'tela tela--passagem' },
    h('div', { class: 'tela-caixa' },

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */

function painelDraft(s) {
  const j = s.jogadores[s.ordem[s.draft.turno]];
  const mao = s.draft.maos[s.jogadores.indexOf(j)];

  return h('section', { class: 'painel', estilo: { borderColor: 'var(--acento)' } },

          : 'A carta que sobrar é descartada. Mais de 3 na mesa devolve o excedente agora, sem penalidade.' }),

/**
 * A alavanca do modo solo: você sabe a regra de escolha dele, então sabe o que
 * ele vai levar. Muitas vezes vale pegar a segunda melhor carta para si, só
 * para não entregar de bandeja a frente que ele tem fraca.

function avisoDoHerdeiroNoDraft(s, mao) {
  const p = previsaoDoHerdeiro(s.herdeiro, mao);
  const nomes = mao.map((id) => CATALOGO.porId[id]);
  const alvo = nomes.find((c) => c && c.id === p.escolheria);
  return h('div', {
    class: 'painel', estilo: { borderColor: COR_HERDEIRO.hex, margin: '0 0 .6rem' },
  }, h('div', { class: 'corpo', estilo: { padding: '.5rem .7rem' } },
    h('p', { estilo: { margin: 0, fontSize: '.82rem' } },
      h('b', { texto: NOME_HERDEIRO }),
      ' está fraco em ',
      h('b', { estilo: { color: 'var(--perda)' }, texto: p.frenteAlvo }),

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */

function painelFechamento(s) {
  const f = s.fechamento;

  const concluido = f.idx >= n;

  const blocos = f.eventos.map((reg) => {
    const j = s.jogadores.find((x) => x.id === reg.jogadorId);
    return h('div', { class: 'fechamento-jogador', estilo: { borderLeftColor: j.cor.hex } },
      h('h4', { class: 'linha-flex' }, pino(j), j.nome),
      h('ul', null, ...reg.itens.map((i) => h('li', { class: i.tipo, texto: i.texto }))));
  });

  return h('section', { class: 'painel', estilo: { borderColor: 'var(--madeira)' } },
    h('header', null,
      h('h3', { texto: `Fechamento do ano ${s.rodada}` }),
      h('span', { class: 'ml-auto', estilo: { fontSize: '.72rem', color: 'var(--neutro)' },
        texto: 'dívida → faturamento → peças voltam → salários → clientes → prazos → multas' })),
    h('div', { class: 'corpo' },

      s.herdeiro && s.herdeiro.eventos.length
        ? h('div', { class: 'fechamento-jogador', estilo: { borderLeftColor: COR_HERDEIRO.hex } },
          h('h4', { class: 'linha-flex' },
            h('span', { class: 'pino', estilo: { background: COR_HERDEIRO.hex } }),
            NOME_HERDEIRO + ' (ano passado)'),
          h('ul', null, ...s.herdeiro.eventos.map((i) => h('li', { class: i.tipo, texto: i.texto }))))

}

function telaPlacar(s) {
  const p = s.placar;
  const aberto = store.vista.detalhePlacar || null;
  const escalaRadar = Math.max(4,
    ...s.jogadores.flatMap((j) => FRENTES.map((f) => j.rep[f])),
    ...(s.herdeiro ? FRENTES.map((f) => s.herdeiro.rep[f]) : []));

  const buscar = (id) => (id === ID_HERDEIRO ? herdeiroComoJogador(s)
    : s.jogadores.find((x) => x.id === id));

  // Placar comparativo: uma coluna por jogador, uma linha por item — lado a lado.
  const fichas = p.classificacao;
  const jogs = fichas.map((f) => buscar(f.jogadorId));
  const tempos = s.tempos || {};
  const fmtTempo = (ms) => { if (!ms) return '—'; const t = Math.round(ms / 1000); const hh = Math.floor(t / 3600), mm = Math.floor((t % 3600) / 60), ss = t % 60;
    return hh ? `${hh}h ${String(mm).padStart(2, '0')}min` : `${mm}min ${String(ss).padStart(2, '0')}s`; };
  const nomeLinha = (l) => (l.chave.startsWith('criterio:') ? CATALOGO.criterioPorId[l.id].nome : l.rotulo);
  const chaves = [];
  for (const f of fichas) for (const l of f.linhas) if (!chaves.some((c) => c.chave === l.chave)) chaves.push({ chave: l.chave, nome: nomeLinha(l) });
  // melhor = 'max' | 'min' | null  → destaca a melhor célula da linha
  const linhaComp = (rotulo, valores, { melhor = 'max', fmt = (v) => String(v), detalhes = null, classe = '' } = {}) => {
    const nums = valores.filter((v) => typeof v === 'number');

    return h('tr', { class: classe },

        v === null || v === undefined ? '—' : fmt(v),
        detalhes && detalhes[i] ? h('small', { class: 'comp-det', texto: detalhes[i] }) : null)));
  };
  const secao = (t) => h('tr', { class: 'comp-secao' }, h('th', { colspan: String(fichas.length + 1), texto: t }));

    linhaComp('Frente mais fraca', fichas.map((fi) => fi.menor)),
    secao('Como os pontos foram feitos'),
    ...chaves.map((c) => {
      const ls = fichas.map((fi) => fi.linhas.find((l) => l.chave === c.chave));
      return linhaComp(c.nome, ls.map((l) => (l ? l.pontos : null)), { fmt: pts, detalhes: ls.map((l) => (l ? l.detalhe : '')) });
    }),
    linhaComp('TOTAL', fichas.map((fi) => fi.total), { classe: 'comp-total' }),
    secao('A partida de cada um'),
    linhaComp('Processos concluídos', jogs.map((j) => (j.vencidos || []).length)),
    linhaComp('Clientes no fim', jogs.map((j) => (j.clientes || []).length)),
    linhaComp('Caixa final', jogs.map((j) => j.dinheiro || 0), { fmt: (v) => '$' + v }),
    linhaComp('Fichas de Conduta', jogs.map((j) => j.conduta || 0), { melhor: 'min' }),
    linhaComp('Tempo de jogo', jogs.map((j) => (tempos[j.id] ? tempos[j.id] : null)), { melhor: null, fmt: fmtTempo }),
  ];

  const campeao = p.classificacao[0];
  return h('div', { class: 'tela' },
    h('div', { class: 'tela-caixa', estilo: { maxWidth: '58rem' } },
      h('div', { estilo: { textAlign: 'center', marginBottom: '1rem' } },
        h('p', { estilo: { textTransform: 'uppercase', letterSpacing: '.16em',
          fontSize: '.7rem', color: 'var(--neutro)' }, texto: 'Avaliação de sócio' }),
        h('h1', { estilo: { fontSize: '2rem' },
          texto: `${campeao.nome} faz sócio` }),
        h('p', { estilo: { color: 'var(--neutro)', margin: 0 },
          texto: `${campeao.total} pontos · variante `
            + `${p.variante === 'exigente' ? 'Sócio Exigente' : 'padrão'}` }),
        s.herdeiro ? h('p', {
          estilo: { marginTop: '.6rem', fontStyle: 'italic', color: 'var(--madeira)' },
          texto: faixaDoResultado(
            (p.porJogador[s.jogadores[0].id] || { total: 0 }).total),
        }) : null),

      h('div', { class: 'radares' }, ...p.classificacao.map((ficha) => {
        const j = buscar(ficha.jogadorId);
        return h('div', { class: 'radar-caixa' },
          radar(j, 160, escalaRadar),
          h('b', { texto: `${ficha.posicao}. ${ficha.nome}` }),
          j.bot && !ficha.ehHerdeiro
            ? h('div', { estilo: { fontSize: '.66rem', color: 'var(--neutro)' },
              texto: (s.config && s.config.bot_nivel === 'facil') ? 'bot fácil' : 'bot normal' })
            : null,
          h('div', { estilo: { fontSize: '.72rem', color: 'var(--neutro)' },
            texto: `${ficha.total} pts · frente mais fraca ${ficha.menor}` }),
          h('div', { estilo: { fontSize: '.72rem', color: 'var(--neutro)' },
            texto: `⏱ ${fmtTempo(tempos[ficha.jogadorId])} de jogo` }));
      })),

      h('section', { class: 'painel' },
        h('header', null, h('h3', { texto: 'Placar linha a linha' }),
          h('span', { class: 'ml-auto', estilo: { fontSize: '.7rem', color: 'var(--neutro)' },
            texto: p.variante === 'exigente'
              ? 'Σ min(frente, mais fraca + 3) + critérios + caixa/5 − conduta − dívida'
              : 'Σ frentes + 3 × mais fraca + critérios + caixa/5 − conduta − dívida' })),
        h('div', { class: 'corpo', estilo: { overflowX: 'auto' } },
          h('table', { class: 'placar placar--comp' },
            h('thead', null, h('tr', null,
              h('th', null),
              ...fichas.map((fi, i) => h('th', { class: 'n' },
                h('span', { class: 'linha-flex', estilo: { justifyContent: 'flex-end' } }, pino(jogs[i]), h('b', { texto: `${fi.posicao}º ${fi.nome}` })),
                h('small', { class: 'comp-det', texto: `⏱ ${fmtTempo(tempos[fi.jogadorId])}` }))))),
            h('tbody', null, ...linhas)),
          h('p', { class: 'dica', estilo: { marginTop: '.5rem' }, texto: 'Em destaque, quem foi melhor em cada linha. O tempo de jogo soma quanto cada um levou para decidir os próprios lances (um lance conta no máximo 10 minutos).' }))),

      h('section', { class: 'painel' },
        h('header', null, h('h3', { texto: 'Critérios desta partida' })),
        h('div', { class: 'corpo' },
          h('div', { class: 'criterios-grid' }, ...s.criterios.map((id) => cartaCriterio(id))))),

      h('div', { class: 'linha-flex', estilo: { justifyContent: 'center', marginTop: '.8rem' } },
        h('button', {
          class: 'btn btn--grande', type: 'button',
          onclick: () => { store.apagarSalvo(); store.estado = null; store.notificar(); },
        }, 'Nova partida'),
        h('button', {
          class: 'btn btn--neutro btn--grande', type: 'button',
          onclick: () => store.atualizarVista({ logAberto: true }),
