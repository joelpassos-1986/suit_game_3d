    // Sócio Exigente (§7.1): teto de (menor + 3) por frente, sem o bônus 3× menor.
    const teto = menor + 3;
    linhas.push({
      chave: 'frentes',
      rotulo: `Reputação com teto (frente mais fraca ${menor} + 3 = ${teto})`,
      detalhe: FRENTES.map((f) => `${f} ${rep[f]}→${Math.min(rep[f], teto)}`).join(' · '),
      pontos: FRENTES.reduce((t, f) => t + Math.min(rep[f], teto), 0),
    });
  } else {
    linhas.push({
      chave: 'frentes',
      rotulo: 'Soma das cinco frentes',
      detalhe: FRENTES.map((f) => `${f} ${rep[f]}`).join(' · '),
      pontos: somaFrentes,
    });
    linhas.push({
      chave: 'menor',
      rotulo: '3 × a frente mais fraca',
      detalhe: `frente mais fraca em ${menor}`,
      pontos: 3 * menor,
    });
  }

  const criterios = state.criterios.map((id) => {
    const r = CRITERIOS[id](jogador, state);
    return { chave: 'criterio:' + id, id, rotulo: id, detalhe: r.detalhe, pontos: r.pontos };
  });
  linhas.push(...criterios);

  const pontosDinheiro = Math.floor(jogador.dinheiro / cfg.dinheiro_por_ponto);
  linhas.push({
    chave: 'dinheiro',
    rotulo: `Caixa ($${cfg.dinheiro_por_ponto} = 1 ponto)`,
    detalhe: `$${jogador.dinheiro}`,
    pontos: pontosDinheiro,
  });

  const pontosConduta = cfg.conduta_por_ficha * jogador.conduta;
  linhas.push({
    chave: 'conduta',
    rotulo: 'Fichas de Conduta',
    detalhe: `${jogador.conduta} × ${cfg.conduta_por_ficha}`,
    pontos: pontosConduta,
  });

  const pontosDivida = cfg.divida_por_ponto * jogador.divida;
  linhas.push({
    chave: 'divida',
    rotulo: 'Dívida não paga',
    detalhe: `$${jogador.divida}`,
    pontos: pontosDivida,
  });

  const total = linhas.reduce((t, l) => t + l.pontos, 0);
  const desqualificado = jogador.conduta >= cfg.conduta_limite;

  return {
    jogadorId: jogador.id,
    nome: jogador.nome,
    cor: jogador.cor,
    rep: { ...rep },
    menor,
    variante,
    linhas,
    total,
    desqualificado,
    conduta: jogador.conduta,
    relacionamento: rep.REL,
  };
}

/* ------------------------------------------------------------------ *
 * Classificação (§7): desqualificados vão para trás de todos os demais.
 * Desempate: menos fichas de Conduta, depois maior Relacionamento.
 * ------------------------------------------------------------------ */

function pontuar(state, variante = state.variante) {
  const fichas = state.jogadores.map((j) => pontuarJogador(state, j, variante));

  const ordenados = fichas.slice().sort((a, b) => {
    if (a.desqualificado !== b.desqualificado) return a.desqualificado ? 1 : -1;
    if (b.total !== a.total) return b.total - a.total;
    if (a.conduta !== b.conduta) return a.conduta - b.conduta;
    return b.relacionamento - a.relacionamento;
  });

  ordenados.forEach((f, i) => { f.posicao = i + 1; });
  return { variante, classificacao: ordenados, porJogador: Object.fromEntries(fichas.map((f) => [f.jogadorId, f])) };
}

/* =============== engine/actions.js =============== */
// engine/actions.js — construtores de ação. Toda mudança de estado passa por aqui.
// Ficam agrupados em `ac` para que motor e interface possam ser concatenados
// num arquivo só (ver build.ps1) sem colisão de nomes.

const A = {
  NOVA_PARTIDA: 'NOVA_PARTIDA',
  INICIAR_RODADA: 'INICIAR_RODADA',
  DRAFT_ESCOLHER: 'DRAFT_ESCOLHER',
  DRAFT_DESCARTAR_EXCEDENTE: 'DRAFT_DESCARTAR_EXCEDENTE',
  ALOCAR: 'ALOCAR',
  RECEPCAO_ESCOLHER: 'RECEPCAO_ESCOLHER',
  RECEPCAO_CAVAR: 'RECEPCAO_CAVAR',
  RECEPCAO_CAVAR_FICAR: 'RECEPCAO_CAVAR_FICAR',
  FORUM_RESOLVER: 'FORUM_RESOLVER',
  REUNIAO: 'REUNIAO',
  CAFEZINHO: 'CAFEZINHO',
  ESPIAR: 'ESPIAR',
  PASSAR: 'PASSAR',
  FECHAR_MES: 'FECHAR_MES',
  FECHAMENTO_DEMITIR: 'FECHAMENTO_DEMITIR',
  FIM_DE_JOGO: 'FIM_DE_JOGO',
  DESFAZER: 'DESFAZER',
};

const ac = {
  novaPartida: (opcoes) => ({ tipo: A.NOVA_PARTIDA, ...opcoes }),
  iniciarRodada: () => ({ tipo: A.INICIAR_RODADA }),
  draftEscolher: (jogadorId, cartaId) => ({ tipo: A.DRAFT_ESCOLHER, jogadorId, cartaId }),
  draftDescartar: (jogadorId, cartaIds) =>
    ({ tipo: A.DRAFT_DESCARTAR_EXCEDENTE, jogadorId, cartaIds }),
  alocar: (jogadorId, pecaId, salaId) => ({ tipo: A.ALOCAR, jogadorId, pecaId, salaId }),
  recepcaoEscolher: (clienteId) => ({ tipo: A.RECEPCAO_ESCOLHER, clienteId }),
  // A cavada tem dois tempos porque a decisão é declarada ANTES de ver: paga-se
  // primeiro, olha-se depois. Uma ação só permitiria ao jogador desistir do
  // preço ao ver as cartas, que é justamente o que a regra proíbe.
  recepcaoCavar: () => ({ tipo: A.RECEPCAO_CAVAR }),
  recepcaoCavarFicar: (clienteId, paraOMercado = null) =>
    ({ tipo: A.RECEPCAO_CAVAR_FICAR, clienteId, paraOMercado }),
  forumResolver: (processoId, usarAtalhoEtico = false, segundo = null) =>
    ({ tipo: A.FORUM_RESOLVER, processoId, usarAtalhoEtico, segundo }),
  reuniao: (tipoAcao, pecaId = null) => ({ tipo: A.REUNIAO, tipoAcao, pecaId }),
  cafezinho: (clientesParaSubir = []) => ({ tipo: A.CAFEZINHO, clientesParaSubir }),
  espiar: (indice) => ({ tipo: A.ESPIAR, indice }),
  passar: (jogadorId) => ({ tipo: A.PASSAR, jogadorId }),
  fecharMes: () => ({ tipo: A.FECHAR_MES }),
  fechamentoDemitir: (jogadorId, pecaId) =>
    ({ tipo: A.FECHAMENTO_DEMITIR, jogadorId, pecaId }),
  fimDeJogo: () => ({ tipo: A.FIM_DE_JOGO }),
  desfazer: () => ({ tipo: A.DESFAZER }),
};

/* =============== engine/reducer.js =============== */
// engine/reducer.js — reducer(state, action) -> state.
// Imutável por clonagem: a ação recebe um clone e o devolve modificado.
// Nenhuma referência ao DOM: este arquivo roda igual no navegador e no Node.


class ErroDeRegra extends Error {
  constructor(mensagem) { super(mensagem); this.name = 'ErroDeRegra'; }
}
const exigir = (cond, msg) => { if (!cond) throw new ErroDeRegra(msg); };

/* ------------------------------------------------------------------ *
 * Log
 * ------------------------------------------------------------------ */

function anotar(s, texto, extra = {}) {
  s.log.push({ n: s.log.length + 1, rodada: s.rodada, fase: s.fase, texto, ...extra });
  return s;
}

/* ------------------------------------------------------------------ *
 * Reducer
 * ------------------------------------------------------------------ */

function reducer(state, action) {
  if (action.tipo === A.NOVA_PARTIDA) return criarPartida(action);
  const s = clonar(state);
  aplicar(s, action);
  return s;
}

function aplicar(s, action) {
  switch (action.tipo) {
    case A.INICIAR_RODADA:            return iniciarRodada(s);
    case A.DRAFT_ESCOLHER:            return draftEscolher(s, action);
    case A.DRAFT_DESCARTAR_EXCEDENTE: return draftDescartarExcedente(s, action);
    case A.ALOCAR:                    return alocar(s, action);
    case A.RECEPCAO_ESCOLHER:         return recepcaoEscolher(s, action);
    case A.RECEPCAO_CAVAR:            return recepcaoCavar(s);
    case A.RECEPCAO_CAVAR_FICAR:      return recepcaoCavarFicar(s, action);
    case A.FORUM_RESOLVER:            return forumResolver(s, action);
    case A.REUNIAO:                   return reuniaoResolver(s, action);
    case A.CAFEZINHO:                 return cafezinhoResolver(s, action);
    case A.ESPIAR:                    return espiarCriterio(s, action);
    case A.PASSAR:                    return passar(s, action);
    case A.FECHAR_MES:                return fecharMes(s);
    case A.FECHAMENTO_DEMITIR:        return fechamentoDemitir(s, action);
    case A.FIM_DE_JOGO:               return terminarPartida(s);
    default: throw new ErroDeRegra('Ação desconhecida: ' + action.tipo);
  }
}

/* ------------------------------------------------------------------ *
 * Setup e rodada
 * ------------------------------------------------------------------ */

function criarPartida(action) {
  const s = novoEstado(action);
  anotar(s, `Partida criada — ${s.numJogadores} jogadores, variante `
    + `${s.variante === 'exigente' ? 'Sócio Exigente' : 'padrão'}, semente ${s.seed}.`);
  anotar(s, 'Critérios do Sócio: ' + s.criterios.join(' · ') + '.');
  iniciarRodada(s);
  return s;
}

/** Expediente + maturação do baralho + Pauta (§6.1 e §6.2). */
function iniciarRodada(s) {
  s.rodada += 1;
  if (s.rodada > s.config.rodadas) return terminarPartida(s);

  s.fase = 'expediente';
  anotar(s, `— Ano ${s.rodada} de ${s.config.rodadas} —`, { tipo: 'rodada' });

  // Expediente (§6.1) — só energia. Nenhum dinheiro entra aqui: o faturamento
  // é o passo 1 do Fechamento, para que o nível 3 do cliente exista de fato.
  for (const j of s.jogadores) {
    const antes = j.energia;
    // O ano 1 abre o escritório; os seguintes podem render menos, se a
    // configuração disser. Sem `energia_rodadas_seguintes`, todos os anos
    // rendem igual — que é a regra atual.
    const ganho = s.rodada === 1
      ? s.config.energia_inicial_rodada
      : (s.config.energia_rodadas_seguintes != null
        ? s.config.energia_rodadas_seguintes
        : s.config.energia_inicial_rodada);
    j.energia = Math.min(j.energia + ganho, s.config.energia_max);
    j.passou = false;
    anotar(s, `${j.nome}: energia ${antes}→${j.energia}.`, { jogadorId: j.id });
  }

  maturarBaralho(s);
  iniciarDraft(s);
  return s;
}

/** §6.2 — a maturação acontece no início das rodadas 2 e 3, nunca em outra. */
function maturarBaralho(s) {
  const b = s.baralhos;
  if (s.rodada === 2) {
    b.principal = embaralhar(s, b.pequenos.concat(b.medios));
    b.pequenos = [];
    b.medios = [];
    anotar(s, 'Os processos Médios entram no baralho.', { tipo: 'baralho' });
  } else if (s.rodada === 3) {
    b.principal = embaralhar(s, b.principal.concat(b.grandes));
    b.grandes = [];
    anotar(s, 'As causas Grandes entram no baralho.', { tipo: 'baralho' });
  }
}

function baralhoAtivo(s) {
  return s.rodada === 1 ? 'pequenos' : 'principal';
}

function comprar(s, quantidade) {
  const nome = baralhoAtivo(s);
  const b = s.baralhos;
  if (b[nome].length < quantidade && b.descarte.length > 0) {
    // Rede de segurança: o briefing garante que 84 cartas bastam, mas não
    // deixamos o motor quebrar se alguém mexer nos números do JSON.
    b[nome] = b[nome].concat(embaralhar(s, b.descarte));
    b.descarte = [];
    anotar(s, 'O descarte voltou para o baralho.', { tipo: 'baralho' });
  }
  return b[nome].splice(0, quantidade);
}

function iniciarDraft(s) {
  const n = s.jogadores.length;
  s.fase = 'pauta';
  s.ordem = ordemAPartirDe(s.primeiroJogador, n);
  s.draft = {
    passo: 1,
    turno: 0,                       // índice dentro de s.ordem
    maos: s.jogadores.map(() => comprar(s, 3)),
    filaDescarte: [],
  };
  anotar(s, 'Pauta: 3 processos para cada um — escolha 1 e passe 2 para a esquerda.',
    { tipo: 'fase' });
  return s;
}

/* ------------------------------------------------------------------ *
 * Draft (§6.2)
 * ------------------------------------------------------------------ */

function jogadorDaVezDraft(s) {
  return s.jogadores[s.ordem[s.draft.turno]];
}

function draftEscolher(s, { jogadorId, cartaId }) {
  exigir(s.fase === 'pauta' && s.draft, 'Não é a fase de Pauta.');
  const j = jogadorDaVezDraft(s);
  exigir(j.id === jogadorId, `Não é a vez de ${jogadorId} escolher.`);

  const idx = s.jogadores.indexOf(j);
  const mao = s.draft.maos[idx];
  const pos = mao.indexOf(cartaId);
  exigir(pos >= 0, 'Esta carta não está na mão deste jogador.');

  mao.splice(pos, 1);
  const carta = processo(cartaId);
  j.carteira.push({ cartaId, cubos: carta.prazo });
  anotar(s, `${j.nome} ficou com "${carta.nome}" (${carta.porte}).`, { jogadorId: j.id });

  if (s.herdeiro) return draftDoHerdeiro(s);

  s.draft.turno += 1;
  if (s.draft.turno >= s.jogadores.length) {
    if (s.draft.passo === 1) passarMaosAEsquerda(s);
    else encerrarDraft(s);
  }
  return s;
}

/**
 * Solo: o jogador ficou com 1 das 3; o Dr. Vieira fica com UMA das 2 que
 * sobraram e a terceira vai para o descarte. Duas levas por ano, então o
 * jogador termina com 2 processos novos e ele com até 2 na pasta (§25.3).
 */
function draftDoHerdeiro(s) {
  const mao = s.draft.maos[0];
  const escolhida = herdeiroEscolheCarta(s.herdeiro, mao);
  if (escolhida) {
    s.herdeiro.pasta.push(escolhida);
    mao.splice(mao.indexOf(escolhida), 1);
    anotar(s, `${NOME_HERDEIRO} ficou com "${processo(escolhida).nome}".`,
      { tipo: 'herdeiro' });
  }
  s.baralhos.descarte.push(...mao);
  s.draft.maos[0] = [];

  if (s.draft.passo === 1) {
    s.draft.passo = 2;
    s.draft.turno = 0;
    s.draft.maos = [comprar(s, 3)];
    anotar(s, 'Segunda leva da Pauta: mais 3 processos.', { tipo: 'fase' });
    return s;
  }
  return encerrarDraft(s);
}

function passarMaosAEsquerda(s) {
  const n = s.jogadores.length;
  const novas = new Array(n);
  for (let i = 0; i < n; i++) novas[(i + 1) % n] = s.draft.maos[i];
  s.draft.maos = novas;
  s.draft.passo = 2;
  s.draft.turno = 0;
  anotar(s, 'As duas cartas restantes passaram para a esquerda.', { tipo: 'fase' });
}

function encerrarDraft(s) {
  // A carta que sobra em cada mão é descartada (§6.2).
  for (let i = 0; i < s.draft.maos.length; i++) {
    s.baralhos.descarte.push(...s.draft.maos[i]);
    s.draft.maos[i] = [];
  }
  // Limite de carteira: o excedente sai agora, sem penalidade (§6.2 e §24).
  const fila = s.jogadores
    .filter((j) => j.carteira.length > s.config.limite_carteira)
    .map((j) => j.id);
  s.draft = null;

  if (fila.length > 0) {
    s.pendente = { tipo: 'descarte_excedente', fila };
    return s;
  }
  return iniciarEscritorio(s);
}

function draftDescartarExcedente(s, { jogadorId, cartaIds }) {
  exigir(s.pendente && s.pendente.tipo === 'descarte_excedente', 'Nada a descartar agora.');
  exigir(s.pendente.fila[0] === jogadorId, 'Não é a vez deste jogador descartar.');
  const j = s.jogadores.find((x) => x.id === jogadorId);
  const alvo = s.config.limite_carteira;
  const precisa = j.carteira.length - alvo;
  exigir(cartaIds.length === precisa, `Descarte exatamente ${precisa} processo(s).`);

  for (const id of cartaIds) {
    const pos = j.carteira.findIndex((c) => c.cartaId === id);
    exigir(pos >= 0, 'Processo não está na carteira.');
    j.carteira.splice(pos, 1);
    s.baralhos.descarte.push(id);
    anotar(s, `${j.nome} devolveu "${processo(id).nome}" — carteira cheia.`, { jogadorId: j.id });
  }

  s.pendente.fila.shift();
  if (s.pendente.fila.length === 0) {
    s.pendente = null;
    return iniciarEscritorio(s);
  }
  return s;
}

/* ------------------------------------------------------------------ *
 * Escritório (§6.3)
 * ------------------------------------------------------------------ */

function iniciarEscritorio(s) {
  s.fase = 'escritorio';
  if (s.herdeiro) {
    s.herdeiro.discosRestantes = discosDoHerdeiroNoAno(s.herdeiro, s.rodada);
    s.herdeiro.discosNoForum = 0;
    s.herdeiro.vez = herdeiroComecaOAno(s.rodada);
    anotar(s, `${NOME_HERDEIRO} chega com ${s.herdeiro.discosRestantes} advogados`
      + (s.herdeiro.vez ? ' e começa o ano.' : '; você começa o ano.'), { tipo: 'herdeiro' });
  }
  s.ordem = ordemAPartirDe(s.primeiroJogador, s.jogadores.length);
  s.turnoIdx = 0;
  for (const j of s.jogadores) j.passou = false;
  anotar(s, 'Escritório: uma peça por vez, efeito resolvido na hora.', { tipo: 'fase' });
  return garantirTurnoJogavel(s);
}

function jogadorDaVez(s) {
  return s.jogadores[s.ordem[s.turnoIdx]];
}

function proximoIndice(s) {
  s.turnoIdx = (s.turnoIdx + 1) % s.jogadores.length;
}

/** Pula automaticamente quem não tem nenhuma alocação legal (§6.3). */
function garantirTurnoJogavel(s) {
  for (let guarda = 0; guarda < 500; guarda++) {
    // Solo: alternam-se, uma peça de cada vez.
    if (s.herdeiro && s.herdeiro.vez && s.herdeiro.discosRestantes > 0) {
      jogadaDoHerdeiro(s);
      s.herdeiro.vez = false;
      continue;
    }
    if (s.jogadores.every((j) => j.passou)) {
      if (s.herdeiro && s.herdeiro.discosRestantes > 0) { s.herdeiro.vez = true; continue; }
      return encerrarEscritorio(s);
    }
    const j = jogadorDaVez(s);
    if (j.passou) { proximoIndice(s); continue; }
    if (acoesLegais(s).temAlocacaoLegal) return s;
    j.passou = true;
    anotar(s, `${j.nome} passou — nenhuma ação disponível.`, { jogadorId: j.id });
    proximoIndice(s);
  }
  throw new ErroDeRegra('Laço infinito na passagem de turno.');
}

/** Vira 1 carta de Agenda e põe um advogado dele na primeira sala livre da lista. */
function jogadaDoHerdeiro(s) {
  const r = colocarDiscoDoHerdeiro(s);
  if (!r) return s;
  if (!r.salaId) {
    anotar(s, `${NOME_HERDEIRO} não achou sala livre e passou.`, { tipo: 'herdeiro' });
  } else {
    anotar(s, `${NOME_HERDEIRO} mandou um advogado para ${s.salas[r.salaId].nome}.`,
      { tipo: 'herdeiro' });
  }
  return s;
}

function alocar(s, { jogadorId, pecaId, salaId }) {
  exigir(s.fase === 'escritorio', 'Não é a fase de Escritório.');
  exigir(!s.pendente, 'Resolva a ação pendente antes de alocar outra peça.');
  const j = jogadorDaVez(s);
  exigir(j.id === jogadorId, `Não é a vez de ${jogadorId}.`);

  const v = podeAlocar(s, j, pecaId, salaId);
  exigir(v.ok, v.motivo);

  const peca = pecaPorId(j, pecaId);
  peca.alocado = salaId;
  const sala = s.salas[salaId];
  sala.ocupantes.push({ jogadorId: j.id, pecaId });

  const rotulo = { titular: 'o titular', advogado: 'um advogado', estagiario: 'um estagiário' }[peca.tipo];
  anotar(s, `${j.nome} mandou ${rotulo} para ${sala.nome}.`, { jogadorId: j.id, tipo: 'alocar' });

  if (salaId === 'biblioteca') return resolverBiblioteca(s, j, sala);

  s.pendente = { tipo: salaId, jogadorId: j.id, pecaId };
  return s;
}

/**
 * Quantas espiadas o jogador já tem direito, pelo conhecimento dele (§Critério
 * Oculto). Com 4 o baralho inteiro já abriu; 5, 6 e 7 existem para isto.
 */
function espiadasDe(conhecimento) {
  return Math.max(0, Math.min(3, conhecimento - 4));
}

function resolverBiblioteca(s, j, sala) {
  // O primeiro espaço vale +2; os demais, +1. `ocupantes` já inclui esta peça.
  const primeiro = sala.ocupantes.length === 1;
  const ganho = primeiro ? s.config.biblioteca_primeiro_espaco : s.config.biblioteca_demais_espacos;
  const antes = j.conhecimento;
  j.conhecimento = Math.min(j.conhecimento + ganho, s.config.conhecimento_max);
  anotar(s, `${j.nome} estudou: conhecimento ${antes}→${j.conhecimento}`
    + (j.conhecimento === antes ? ' (já no teto).' : '.'), { jogadorId: j.id });

  // Critério Oculto: quem passa de 4 compra o direito de espiar um Critério.
  // A escolha é do jogador — por isso vira pendência em vez de resolver aqui.
  if (s.criteriosOcultos) {
    j.espiados = j.espiados || [];
    const direito = espiadasDe(j.conhecimento);
    if (direito > j.espiados.length && j.espiados.length < s.criterios.length) {
      s.pendente = { tipo: 'espiar', jogadorId: j.id };
      anotar(s, `${j.nome} chegou ao conhecimento ${j.conhecimento} e ganhou uma espiada `
        + 'nos Critérios do Sócio.', { jogadorId: j.id });
      return s;
    }
  }
  return fimDoTurno(s);
}

/** O jogador escolhe qual dos Critérios ainda virados quer olhar. */
function espiarCriterio(s, { indice }) {
  exigir(s.pendente && s.pendente.tipo === 'espiar', 'Nenhuma espiada pendente.');
  const j = s.jogadores.find((x) => x.id === s.pendente.jogadorId);
  j.espiados = j.espiados || [];
  exigir(Number.isInteger(indice) && indice >= 0 && indice < s.criterios.length,
    'Critério inexistente.');
  exigir(!j.espiados.includes(indice), 'Você já olhou esse Critério.');
  j.espiados.push(indice);
  // O log é público: a mesa sabe QUE ele olhou, e qual posição — mas não o quê.
  anotar(s, `${j.nome} olhou o Critério ${indice + 1} em segredo.`, { jogadorId: j.id });
  s.pendente = null;
  return fimDoTurno(s);
}

function recepcaoEscolher(s, { clienteId }) {
  exigir(s.pendente && s.pendente.tipo === 'recepcao', 'Nenhuma ida à Recepção pendente.');
  const j = s.jogadores.find((x) => x.id === s.pendente.jogadorId);
  const custo = s.config.custo_captar_cliente;
  exigir(j.clientes.length < s.config.limite_clientes,
    `Limite de ${s.config.limite_clientes} clientes atingido.`);
  exigir(j.dinheiro >= custo, `Captação custa $${custo} e você tem $${j.dinheiro}.`);
  const pos = s.mercadoClientes.indexOf(clienteId);
  exigir(pos >= 0, 'Este cliente não está no mercado.');

  j.dinheiro -= custo;
  j.clientes.push({ cartaId: clienteId, nivel: s.config.cliente_entra_no_nivel });
  s.mercadoClientes.splice(pos, 1);
  if (s.baralhoClientes.length > 0) {
    s.mercadoClientes.splice(pos, 0, s.baralhoClientes.shift());
  }
  anotar(s, `${j.nome} pagou $${custo} de captação e trouxe ${cliente(clienteId).nome} `
    + `(nível ${s.config.cliente_entra_no_nivel}).`, { jogadorId: j.id });
  return fimDoTurno(s);
}

/* ------------------------------------------------------------------ *
 * A cavada (§ Recepção)
 *
 * Pague $5, compre as 5 do topo, fique com 1. O que não ficar com você vai
 * para o FUNDO — nada é descartado fora do jogo, o baralho de Clientes é um
 * ciclo fechado e precisa continuar sendo.
 *
 * O preço é declarado antes de olhar. Por isso são duas ações: RECEPCAO_CAVAR
 * cobra e revela, RECEPCAO_CAVAR_FICAR escolhe. Entre as duas o jogador já
 * pagou e não tem como voltar atrás — que é exatamente a regra de mesa.
 * ------------------------------------------------------------------ */

function recepcaoCavar(s) {
  exigir(s.pendente && s.pendente.tipo === 'recepcao', 'Nenhuma ida à Recepção pendente.');
  const j = s.jogadores.find((x) => x.id === s.pendente.jogadorId);
  const custo = s.config.custo_cavar_cliente;
  const quantas = s.config.cartas_da_cavada;
  exigir(j.clientes.length < s.config.limite_clientes,
    `Limite de ${s.config.limite_clientes} clientes atingido.`);
  exigir(j.dinheiro >= custo, `Cavar custa $${custo} e você tem $${j.dinheiro}.`);
  exigir(s.baralhoClientes.length >= quantas,
    `O baralho tem ${s.baralhoClientes.length} cartas e cavar pede ${quantas}.`);

  j.dinheiro -= custo;
  const mao = s.baralhoClientes.splice(0, quantas);
  s.pendente = { tipo: 'recepcao_cavada', jogadorId: j.id, pecaId: s.pendente.pecaId, mao };
  // O log diz QUE ele cavou e quanto pagou. As cartas da mão são dele até
  // decidir — a mesa vê o resultado, não a escolha que ele descartou.
  anotar(s, `${j.nome} pagou $${custo} e cavou as ${quantas} cartas do topo.`,
    { jogadorId: j.id });
  return s;
}

function recepcaoCavarFicar(s, { clienteId, paraOMercado = null }) {
  exigir(s.pendente && s.pendente.tipo === 'recepcao_cavada', 'Nenhuma cavada pendente.');
  const j = s.jogadores.find((x) => x.id === s.pendente.jogadorId);
  const mao = s.pendente.mao;
  exigir(mao.includes(clienteId), 'Esta carta não está na sua mão.');

  const sobra = mao.filter((id) => id !== clienteId);
  let trocou = false;
  if (paraOMercado && paraOMercado.length) {
    // A limpeza do mercado é opcional e tudo ou nada: as 3 abertas saem e 3 da
    // sua mão entram. Meio-termo não existe, para não virar um quebra-cabeça de
    // permutações em cima de uma ação que já é cara.
    exigir(paraOMercado.length === s.mercadoClientes.length,
      `A troca é do mercado inteiro: ${s.mercadoClientes.length} cartas.`);
    exigir(paraOMercado.every((id) => sobra.includes(id)),
      'Só dá para pôr no mercado o que sobrou na sua mão.');
    exigir(new Set(paraOMercado).size === paraOMercado.length, 'Carta repetida na troca.');
    // As velhas vão para o fundo ANTES das que sobraram, na ordem em que estavam
    // abertas: é o que a mão faz na mesa ao empurrar o mercado para trás.
    s.baralhoClientes.push(...s.mercadoClientes);
    s.mercadoClientes = paraOMercado.slice();
    trocou = true;
  }
  const aoFundo = sobra.filter((id) => !s.mercadoClientes.includes(id));
  s.baralhoClientes.push(...aoFundo);

  j.clientes.push({ cartaId: clienteId, nivel: s.config.cliente_entra_no_nivel });
  anotar(s, `${j.nome} ficou com ${cliente(clienteId).nome} `
    + `(nível ${s.config.cliente_entra_no_nivel})`
    + (trocou ? ' e trocou o mercado inteiro pelas cartas que sobraram.'
              : `; as outras ${aoFundo.length} foram para o fundo.`),
    { jogadorId: j.id });
  return fimDoTurno(s);
}

function forumResolver(s, { processoId, usarAtalhoEtico = false, segundo = null }) {
  exigir(s.pendente && s.pendente.tipo === 'forum', 'Nenhuma ida ao Fórum pendente.');
  const j = s.jogadores.find((x) => x.id === s.pendente.jogadorId);

  if (!processoId) {
    anotar(s, `${j.nome} foi ao Fórum e não concluiu nada.`, { jogadorId: j.id });
    return fimDoTurno(s);
  }

  const av1 = avaliarProcesso(s, j, processoId, { atalhoEtico: usarAtalhoEtico });
  exigir(av1.ok, av1.motivos.join(' '));

  let av2 = null;
  if (segundo && segundo.processoId) {
    exigir(segundo.processoId !== processoId, 'O segundo processo tem de ser outro.');
    const comprometida = av1.custoEnergia + s.config.energia_extra_segundo_processo;
    // v9: o segundo processo da ida não aceita atalho — nem de conhecimento,
    // nem de energia. O que o bot ou a tela pedirem em `usarAtalhoEtico` é ignorado.
    av2 = avaliarProcesso(s, j, segundo.processoId, {
      atalhoEtico: false,
      energiaJaComprometida: comprometida,
    });
    exigir(av2.ok, av2.motivos.join(' '));
  }

  // Energia: custo do primeiro + (custo do segundo + sobretaxa de 2).
  // v9: com o atalho cobrindo energia, paga-se o que há e fica-se em 0.
  j.energia = Math.max(0, j.energia - av1.custoEnergia);
  if (av2) j.energia -= av2.custoEnergia + s.config.energia_extra_segundo_processo;

  concluirProcesso(s, j, av1, usarAtalhoEtico);
  if (av2) {
    anotar(s, `${j.nome} pagou +${s.config.energia_extra_segundo_processo} de energia `
      + 'para levar um segundo processo na mesma ida.', { jogadorId: j.id });
    concluirProcesso(s, j, av2, false);
  }
  return fimDoTurno(s);
}

function concluirProcesso(s, j, av, usouAtalho) {
  const carta = av.carta;
  j.dinheiro += carta.honorario;
  const ganhos = [];
  for (const [frente, pts] of Object.entries(carta.rep)) {
    j.rep[frente] += pts;
    ganhos.push(`+${pts} ${frente}`);
  }
  const pos = j.carteira.findIndex((c) => c.cartaId === carta.id);
  j.carteira.splice(pos, 1);
  j.vencidos.push(carta.id);

  let sufixo = '';
  if (av.desconto > 0) {
    sufixo += ` Cliente de ${carta.area} na carteira: pagou ${av.custoEnergia}`
      + ` de energia em vez de ${av.custoBase}.`;
  }
  const atalhou = usouAtalho && (av.faltaConhecimento > 0 || av.faltaEnergia > 0);
  if (atalhou) {
    j.conduta += 1;
    const oque = [av.faltaConhecimento > 0 ? '1 de conhecimento' : '',
      av.faltaEnergia > 0 ? `${av.faltaEnergia} de energia` : ''].filter(Boolean).join(' e ');
    sufixo += ` — atalho ético (faltava ${oque}): ${j.nome} agora tem ${j.conduta} ficha(s) de Conduta.`;
  }
  anotar(s, `${j.nome} concluiu "${carta.nome}": +$${carta.honorario}, ${ganhos.join(', ')}.${sufixo}`,
    { jogadorId: j.id, tipo: atalhou ? 'conduta' : 'vitoria' });
}

function reuniaoResolver(s, { tipoAcao, pecaId }) {
  exigir(s.pendente && s.pendente.tipo === 'reuniao', 'Nenhuma reunião pendente.');
  const j = s.jogadores.find((x) => x.id === s.pendente.jogadorId);

  if (tipoAcao === 'contratar') {
    exigir(podeContratar(s, j), 'Não dá para contratar: caixa ou limite de equipe.');
    j.dinheiro -= s.config.custo_contratar_estagiario;
    const novo = {
      id: `${j.id}-P${j.proximaPeca++}`,
      tipo: 'estagiario',
      alocado: null,
      disponivel: false,        // só age na rodada seguinte (§6.3)
      // Fica encaixado sob o disco do titular na Sala de reunião: a torre ocupa
      // um espaço só, então a peça nova NÃO entra em `sala.ocupantes` (§8).
      local: 'reuniao',
    };
    j.pecas.push(novo);
    anotar(s, `${j.nome} contratou um estagiário por $${s.config.custo_contratar_estagiario} — `
      + 'fica na Sala de reunião com o titular e volta no Fechamento.', { jogadorId: j.id });
  } else if (tipoAcao === 'promover') {
    const peca = pecaPorId(j, pecaId);
    exigir(peca && peca.tipo === 'estagiario', 'Selecione um estagiário.');
    exigir(peca.disponivel && peca.alocado === null,
      'Peça já alocada (ou ainda deitada) não pode ser promovida nesta rodada.');
    exigir(j.dinheiro >= s.config.custo_promover_advogado, 'Caixa insuficiente para promover.');
    j.dinheiro -= s.config.custo_promover_advogado;
    peca.tipo = 'advogado';
    anotar(s, `${j.nome} promoveu um estagiário a advogado por $${s.config.custo_promover_advogado} — `
      + 'já pode atuar nesta rodada.', { jogadorId: j.id });
  } else {
    throw new ErroDeRegra('Ação de reunião inválida: ' + tipoAcao);
  }
  return fimDoTurno(s);
}

function cafezinhoResolver(s, { clientesParaSubir = [] }) {
  exigir(s.pendente && s.pendente.tipo === 'cafezinho', 'Nenhuma ida ao Cafezinho pendente.');
  const j = s.jogadores.find((x) => x.id === s.pendente.jogadorId);
  exigir(clientesParaSubir.length <= s.config.cafezinho_clientes,
    `No máximo ${s.config.cafezinho_clientes} clientes por ida.`);
  exigir(new Set(clientesParaSubir).size === clientesParaSubir.length,
    'Cliente repetido na seleção.');

  const antes = j.energia;
  j.energia = Math.min(j.energia + s.config.cafezinho_energia, s.config.energia_max);

  const subidos = [];
  for (const id of clientesParaSubir) {
    const c = j.clientes.find((x) => x.cartaId === id);
    exigir(c, 'Este cliente não é seu.');
    if (c.nivel >= s.config.cliente_nivel_max) {
      // v9: o cliente já satisfeito não sobe — paga $1 na hora.
      const paga = s.config.cafe_cliente_no_maximo_paga || 0;
      exigir(paga > 0, 'Cliente já está no nível máximo.');
      j.dinheiro += paga;
      subidos.push(`${cliente(id).nome} já estava no ${c.nivel} e pagou $${paga}`);
      continue;
    }
    c.nivel += 1;
    subidos.push(`${cliente(id).nome} → nível ${c.nivel}`);
  }
  anotar(s, `${j.nome} tomou um café: energia ${antes}→${j.energia}`
    + (subidos.length ? `; ${subidos.join('; ')}.` : '.'), { jogadorId: j.id });
  return fimDoTurno(s);
}

function passar(s, { jogadorId }) {
  exigir(s.fase === 'escritorio', 'Não é a fase de Escritório.');
  exigir(!s.pendente, 'Resolva a ação pendente antes de passar.');
  const j = jogadorDaVez(s);
  exigir(j.id === jogadorId, `Não é a vez de ${jogadorId}.`);
  j.passou = true;
  anotar(s, `${j.nome} passou.`, { jogadorId: j.id });
  if (s.herdeiro && !s.acaoExtra) s.herdeiro.vez = true;
  proximoIndice(s);
  return garantirTurnoJogavel(s);
}

function fimDoTurno(s) {
  s.pendente = null;
  // v9: na ação extra cada titular joga UMA vez — feita a jogada, o jogador
  // está encerrado, mesmo que o titular tivesse mais o que fazer.
  if (s.acaoExtra) jogadorDaVez(s).passou = true;
  if (s.herdeiro && !s.acaoExtra) s.herdeiro.vez = true;
  proximoIndice(s);
  return garantirTurnoJogavel(s);
}

function encerrarEscritorio(s) {
  if (s.rodada >= s.config.rodadas) {
    // v9: o último ano não tem Fechamento. Antes da avaliação vem a ação
    // extra do titular; só depois dela o Dr. Vieira faz o passo dele (que é
    // pontuação, e por isso acontece em todos os anos — §25.5).
    if (s.config.acao_extra_titular && !s.acaoExtra) return iniciarAcaoExtra(s);
    s.acaoExtra = false;
    if (s.herdeiro) resolverFechamentoDoHerdeiro(s);
    return terminarPartida(s);
  }
  s.fase = 'fechamento';
  s.fechamento = { idx: 0, etapa: 'divida', eventos: [] };
  anotar(s, 'Fechamento do ano.', { tipo: 'fase' });
  return s;
}

/**
 * v9 — a ação extra do titular. Quando o último disco do ano 6 sai do
 * tabuleiro, cada jogador recolhe SÓ o titular; os colaboradores continuam
 * ocupando as salas. Então, na ordem INVERSA da do ano (começa quem jogou por
 * último, segue para a direita), cada titular entra num espaço ainda livre —
 * qualquer sala, inclusive a de reunião — e resolve o efeito. Uma jogada por
 * jogador; depois, a avaliação de sócio.
 */
function iniciarAcaoExtra(s) {
  s.acaoExtra = true;
  for (const j of s.jogadores) {
    const t = j.pecas[0];
    if (t.alocado) {
      const sala = s.salas[t.alocado];
      sala.ocupantes = sala.ocupantes.filter((o) => o.pecaId !== t.id);
      t.alocado = null;
    }
    j.passou = false;
  }
  s.ordem = ordemAPartirDe(s.primeiroJogador, s.jogadores.length).reverse();
  s.turnoIdx = 0;
  if (s.herdeiro) { s.herdeiro.vez = false; s.herdeiro.discosRestantes = 0; }
  anotar(s, 'Ação extra do titular: só o titular volta para a mesa e faz uma última jogada, '
    + 'na ordem inversa, em qualquer espaço ainda livre.', { tipo: 'fase' });
  return garantirTurnoJogavel(s);
}

/* ------------------------------------------------------------------ *
 * Fechamento do mês (§6.7) — não ocorre na rodada 5
 * ------------------------------------------------------------------ */

/**
 * §6.8 — reputação nunca fica negativa; a punição vira $1. v9: a multa não é
 * cobrada na hora — fica anotada e é paga no FIM do Fechamento do jogador,
 * depois dos salários (senão a multa por uma demissão tirava o caixa do
 * salário seguinte e virava bola de neve). Sem caixa, vira dívida.
 */
function perderReputacao(s, j, frente, quantidade, motivo, eventos) {
  for (let i = 0; i < quantidade; i++) {
    if (j.rep[frente] > 0) {
      j.rep[frente] -= 1;
      eventos.push({ tipo: 'perda', texto: `−1 ${frente} (${motivo})` });
    } else {
      j.multasPendentes = (j.multasPendentes || 0) + s.config.multa_sem_reputacao;
      eventos.push({ tipo: 'multa', texto: `${frente} já em 0 (${motivo}): multa de $${s.config.multa_sem_reputacao}, cobrada no fim` });
    }
  }
}

function cobrarMultas(s, j, eventos) {
  const total = j.multasPendentes || 0;
  if (!total) return;
  const pago = Math.min(total, j.dinheiro);
  j.dinheiro -= pago;
  if (total - pago > 0) j.divida += total - pago;
  j.multasPendentes = 0;
  eventos.push({ tipo: pago === total ? 'multa' : 'divida',
    texto: pago === total ? `Pagou $${pago} de multas.`
      : `Pagou $${pago} de multas e ficou devendo $${total - pago}.` });
}

function eventosDoJogador(s, jogadorId) {
  let reg = s.fechamento.eventos.find((e) => e.jogadorId === jogadorId);
  if (!reg) {
    reg = { jogadorId, itens: [] };
    s.fechamento.eventos.push(reg);
  }
  return reg.itens;
}

/**
 * Resolve o Fechamento de UM jogador por chamada, na ordem
 * dívida → salários → clientes → prazos. Para quando precisa de demissão.
 */
function fecharMes(s) {
  exigir(s.fase === 'fechamento' && s.fechamento, 'Não é a fase de Fechamento.');
  exigir(!s.pendente, 'Resolva a demissão pendente antes de continuar.');
  const f = s.fechamento;
  const n = s.jogadores.length;
  if (f.idx >= n) return finalizarRodada(s);

  const j = s.jogadores[s.ordem[f.idx]];
  const ev = eventosDoJogador(s, j.id);

  // 0. Dívida
  if (f.etapa === 'divida') {
    if (j.divida > 0) {
      const pago = Math.min(j.divida, j.dinheiro);
      j.dinheiro -= pago;
      j.divida -= pago;
      ev.push({ tipo: 'divida', texto: pago > 0
        ? `Quitou $${pago} de dívida` + (j.divida > 0 ? `; ainda deve $${j.divida}.` : '.')
        : `Sem caixa: continua devendo $${j.divida}.` });
    }
    f.etapa = 'faturamento';
  }

  // 1. Faturamento — cobrado ANTES do rebaixamento do passo 3. É isso que faz a
  // faixa do nível 3 existir de fato: um cliente captado ou atendido nesta
  // rodada já fatura agora, no valor em que está (§6.7).
  if (f.etapa === 'faturamento') {
    const renda = rendaDeClientes(s, j);
    j.dinheiro += renda;
    if (j.clientes.length > 0) {
      const detalhe = j.clientes
        .map((c) => `${cliente(c.cartaId).nome} (nv ${c.nivel})`).join(', ');
      ev.push({ tipo: 'faturamento',
        texto: renda > 0 ? `Faturou $${renda}: ${detalhe}.`
          : `Nada a faturar: ${detalhe} — nível 1 não rende.` });
    }
    f.etapa = 'salarios';
  }

  // 2. Salários — v9: as peças voltam para a mesa ANTES da folha, para a
  // conta ser só olhar a equipe: $1 por E, $3 por A.
  if (f.etapa === 'salarios') {
    const folha = folhaSalarial(s, j);
    if (!ev.some((e) => e.tipo === 'recolhe')) {
      const eq = j.pecas.filter((p) => p.tipo !== 'titular');
      ev.push({ tipo: 'recolhe', texto: `Peças de volta à mesa: ${eq.filter((p) => p.tipo === 'estagiario').length} estagiário(s) `
        + `e ${eq.filter((p) => p.tipo === 'advogado').length} advogado(s) — folha de $${folha}.` });
    }
    if (folha > j.dinheiro) {
      s.pendente = { tipo: 'demitir', jogadorId: j.id, folha, caixa: j.dinheiro };
      ev.push({ tipo: 'alerta', texto: `Folha de $${folha} e só $${j.dinheiro} em caixa: precisa demitir.` });
      return s;
    }
    j.dinheiro -= folha;
    ev.push({ tipo: 'salario', texto: folha > 0 ? `Pagou $${folha} de salários.` : 'Sem folha a pagar.' });
    f.etapa = 'clientes';
  }

  // 3. Clientes descem um nível
  if (f.etapa === 'clientes') {
    const saem = [];
    for (const c of j.clientes) {
      c.nivel -= 1;
      if (c.nivel <= 0) saem.push(c.cartaId);
    }
    for (const id of saem) {
      j.clientes.splice(j.clientes.findIndex((c) => c.cartaId === id), 1);
      ev.push({ tipo: 'cliente', texto: `${cliente(id).nome} foi embora.` });
      perderReputacao(s, j, 'REL', 1, 'cliente perdido', ev);
    }
    if (j.clientes.length > 0 && saem.length === 0) {
      ev.push({ tipo: 'cliente', texto: 'Clientes desceram um nível.' });
    }
    f.etapa = 'prazos';
  }

  // 4. Prazos
  if (f.etapa === 'prazos') {
    const vencem = [];
    for (const c of j.carteira) {
      c.cubos -= 1;
      if (c.cubos <= 0) vencem.push(c.cartaId);
    }
    for (const id of vencem) {
      j.carteira.splice(j.carteira.findIndex((c) => c.cartaId === id), 1);
      s.baralhos.descarte.push(id);
      ev.push({ tipo: 'prazo', texto: `"${processo(id).nome}" perdeu o prazo e foi abandonado.` });
      perderReputacao(s, j, 'ATU', 1, 'prazo vencido', ev);
    }
    if (j.carteira.length > 0 && vencem.length === 0) {
      ev.push({ tipo: 'prazo', texto: 'Prazos correram; nenhuma carta caiu.' });
    }
    // 5. Multas — por último, depois dos salários (v9).
    cobrarMultas(s, j, ev);
    if (ev.length === 0) ev.push({ tipo: 'nada', texto: 'Ano tranquilo: nada a pagar, nada a perder.' });

    f.etapa = 'divida';
    f.idx += 1;
    anotar(s, `Fechamento de ${j.nome}: ${ev.map((e) => e.texto).join(' ')}`, { jogadorId: j.id });
  }

  if (f.idx >= n) f.concluido = true;
  return s;
}

function fechamentoDemitir(s, { jogadorId, pecaId }) {
  exigir(s.pendente && s.pendente.tipo === 'demitir', 'Nenhuma demissão pendente.');
  exigir(s.pendente.jogadorId === jogadorId, 'Demissão pendente é de outro jogador.');
  const j = s.jogadores.find((x) => x.id === jogadorId);
  const peca = pecaPorId(j, pecaId);
  exigir(peca, 'Peça inexistente.');
  exigir(peca.tipo !== 'titular', 'O titular não pode ser demitido.');

  const ev = eventosDoJogador(s, j.id);
  j.pecas.splice(j.pecas.indexOf(peca), 1);
  if (peca.alocado) {
    const sala = s.salas[peca.alocado];
    sala.ocupantes = sala.ocupantes.filter((o) => o.pecaId !== pecaId);
  }
  ev.push({ tipo: 'demissao', texto: `Demitiu um ${peca.tipo}.` });
  perderReputacao(s, j, 'LID', 1, 'demissão', ev);
  anotar(s, `${j.nome} demitiu um ${peca.tipo} por falta de caixa: −1 LID.`,
    { jogadorId: j.id, tipo: 'perda' });

  const folha = folhaSalarial(s, j);
  if (folha <= j.dinheiro) {
    s.pendente = null;                 // pode retomar o Fechamento
  } else {
    s.pendente = { tipo: 'demitir', jogadorId: j.id, folha, caixa: j.dinheiro };
  }
  return s;
}

function resolverFechamentoDoHerdeiro(s) {
  const eventos = fechamentoDoHerdeiro(s, s.rodada);
  anotar(s, `Fechamento de ${NOME_HERDEIRO}: ${eventos.map((e) => e.texto).join(' ')}`,
    { tipo: 'herdeiro' });
  return s;
}

function finalizarRodada(s) {
  if (s.herdeiro) resolverFechamentoDoHerdeiro(s);
  // 5. Recolha as peças — inclusive o contratado, que estava sob o disco do
  // titular na Sala de reunião — e passe o primeiro jogador para a esquerda.
  for (const j of s.jogadores) {
    for (const p of j.pecas) { p.alocado = null; p.disponivel = true; delete p.local; }
  }
  for (const id of Object.keys(s.salas)) s.salas[id].ocupantes = [];
  s.primeiroJogador = (s.primeiroJogador + 1) % s.jogadores.length;
  s.fechamento = null;
  return iniciarRodada(s);
}

/* ------------------------------------------------------------------ *
 * Fim de jogo (§7)
 * ------------------------------------------------------------------ */

function terminarPartida(s) {
  s.fase = 'fim';
  s.placar = pontuar(s);
  if (s.herdeiro) classificarComHerdeiro(s.placar, pontuarHerdeiro(s));
  const campeao = s.placar.classificacao[0];
  anotar(s, `Fim da partida. ${campeao.nome} faz sócio com ${campeao.total} pontos.`,
    { tipo: 'fim' });
  return s;
}

/* ------------------------------------------------------------------ *
 * Atalho útil para testes e para o modo de depuração
 * ------------------------------------------------------------------ */

function despachar(state, ...acoes) {
  return acoes.reduce((s, a) => reducer(s, a), state);
}



/* =============== engine/auto.js =============== */
// engine/auto.js — jogador automático determinístico.
// Serve para os testes de partida completa e para a tela de depuração
// (simular N partidas e olhar a distribuição de pontos).


const PRIORIDADE_SALA = ['forum', 'biblioteca', 'recepcao', 'reuniao', 'cafezinho'];

/* ------------------------------------------------------------------ *
 * A cavada, para o bot
 *
 * O bot não sabe blefar nem negar carta a ninguém, então joga a cavada pelo
 * único motivo que ele consegue enxergar: ele quer um cliente de uma área que
 * não está aberta. É o mesmo motivo que o Joel descreveu para a mesa, e é o
 * teto do que se pode medir sem gente jogando.
 * ------------------------------------------------------------------ */

/** As áreas dos processos que ele tem em carteira — o que ele precisa casar. */
function areasQueQuer(j) {
  return new Set(j.carteira.map((c) => processo(c.cartaId).area));
}

function cobre(ids, querem) {
  return ids.some((id) => querem.has(cliente(id).area));
}

/** Ele cava quando nenhuma das abertas serve e ele tem com que pagar. */
function valeCavar(s, j) {
  if (!podeCavarCliente(s, j)) return false;
  const querem = areasQueQuer(j);
  if (querem.size === 0) return false;          // sem carteira, tanto faz: pega a barata
  return !cobre(s.mercadoClientes, querem);
}

/** Entre as cavadas, a que casa com a carteira; sem casar, a primeira. */
function melhorDaMao(s, j, mao) {
  const querem = areasQueQuer(j);
  const casa = mao.filter((id) => querem.has(cliente(id).area));
  return (casa.length ? casa : mao)[0];
}

/**
 * Limpar o mercado é decisão de NEGAÇÃO: você troca as três abertas para tirar
 * do adversário a carta que ele esperava. O bot não sabe ler a mesa, então por
 * padrão ele não troca — fingir que sabe encheria a simulação de ruído com
 * cara de resultado. A chave existe para a simulação medir o teto do
 * embaralhamento, ligando a troca em todas as cavadas.
 */
const POLITICA = { trocarMercado: false };

function daVezAuto(s) {
  return s.jogadores[s.ordem[s.turnoIdx]];
}

/** Escolhe UMA ação legal para o estado atual. Devolve null no fim da partida. */
function proximaAcaoAutomatica(s) {
  if (s.fase === 'fim') return null;

  if (s.pendente) {
    const j = s.jogadores.find((x) => x.id === s.pendente.jogadorId)
           || s.jogadores.find((x) => x.id === (s.pendente.fila || [])[0]);
    switch (s.pendente.tipo) {
      case 'descarte_excedente': {
        const excesso = j.carteira.length - s.config.limite_carteira;
        // Descarta as cartas mais caras em conhecimento — as mais difíceis de virar ponto.
        const ordenadas = j.carteira.slice().sort((a, b) => b.cubos - a.cubos);
        return ac.draftDescartar(j.id, ordenadas.slice(0, excesso).map((c) => c.cartaId));
      }
      case 'recepcao': {
        if (valeCavar(s, j)) return ac.recepcaoCavar();
        if (s.mercadoClientes.length === 0) return ac.recepcaoCavar();
        const querem = areasQueQuer(j);
        const casa = s.mercadoClientes.filter((id) => querem.has(cliente(id).area));
        return ac.recepcaoEscolher((casa.length ? casa : s.mercadoClientes)[0]);
      }
      case 'recepcao_cavada': {
        const fica = melhorDaMao(s, j, s.pendente.mao);
        const sobra = s.pendente.mao.filter((id) => id !== fica);
        const troca = POLITICA.trocarMercado && s.mercadoClientes.length > 0
          && sobra.length >= s.mercadoClientes.length
          ? sobra.slice(0, s.mercadoClientes.length)
          : null;
        return ac.recepcaoCavarFicar(fica, troca);
      }
      case 'forum': {
        const opcoes = processosResolviveis(s, j).filter((o) => o.jogavel);
        if (opcoes.length === 0) return ac.forumResolver(null);
        // Prefere o que não exige atalho ético; entre esses, o maior honorário.
        const limpos = opcoes.filter((o) => !o.exigeAtalho);
        const pool = limpos.length ? limpos : opcoes;
        pool.sort((a, b) => b.carta.honorario - a.carta.honorario);
        const escolha = pool[0];
        const gasto = escolha.carta.energia + s.config.energia_extra_segundo_processo;
        const segundas = processosResolviveis(s, j, gasto)
          .filter((o) => o.cartaId !== escolha.cartaId && !o.exigeAtalho && o.semAtalho.ok);
        segundas.sort((a, b) => b.carta.honorario - a.carta.honorario);
        return ac.forumResolver(
          escolha.cartaId,
          escolha.exigeAtalho,
          segundas.length ? { processoId: segundas[0].cartaId, usarAtalhoEtico: false } : null,
        );
      }
      case 'reuniao': {
        if (podePromover(s, j)) return ac.reuniao('promover', estagiariosPromoviveis(s, j)[0].id);
        if (podeContratar(s, j)) return ac.reuniao('contratar');
        return ac.reuniao('contratar'); // o motor recusa e o erro aparece no teste
      }
      case 'cafezinho': {
        const subiveis = j.clientes
          .filter((c) => c.nivel < s.config.cliente_nivel_max)
          .slice(0, s.config.cafezinho_clientes)
          .map((c) => c.cartaId);
        return ac.cafezinho(subiveis);
      }
      case 'demitir': {
        const estagiario = estagiariosDe(j)[0];
        const alvo = estagiario || j.pecas.find((p) => p.tipo !== 'titular');
        return ac.fechamentoDemitir(j.id, alvo.id);
      }
      case 'espiar': {
        const livre = s.criterios.findIndex((_, i) => !(j.espiados || []).includes(i));
        return ac.espiar(livre < 0 ? 0 : livre);
      }
      default:
        throw new Error('Pendência automática não tratada: ' + s.pendente.tipo);
    }
  }

  if (s.fase === 'pauta') {
    const j = s.jogadores[s.ordem[s.draft.turno]];
    const mao = s.draft.maos[s.jogadores.indexOf(j)];
    // Escolhe o processo mais valioso que o conhecimento atual alcança.
    return ac.draftEscolher(j.id, mao[0]);
  }

  if (s.fase === 'escritorio') {
    const j = daVezAuto(s);
    const legais = acoesLegais(s).alocacoes.filter((a) => a.ok);
    if (legais.length === 0) return ac.passar(j.id);

    // Só vale ir ao Fórum se houver processo resolvível.
    const temProcesso = processosResolviveis(s, j).some((o) => o.jogavel);
    for (const salaId of PRIORIDADE_SALA) {
      if (salaId === 'forum' && !temProcesso) continue;
      if (salaId === 'recepcao' && !recepcaoUtil(s, j)) continue;
      const opcao = legais.find((a) => a.salaId === salaId);
      if (opcao) return ac.alocar(j.id, opcao.pecaId, salaId);
    }
    return ac.passar(j.id);
  }

  if (s.fase === 'fechamento') return ac.fecharMes();

  throw new Error('Fase automática não tratada: ' + s.fase);
}

/* ================================================================== *
 * Bot "normal": busca de 1 nível.
 *
 * Enumera as jogadas legais, simula cada uma no próprio reducer e escolhe a
 * que deixa a melhor posição. Como o motor é puro, simular é só clonar — não
 * há regra duplicada aqui, o que impede o bot de trapacear sem querer.
 * ================================================================== */

/**
 * Quanto vale a posição deste jogador. A base é a pontuação real (que já
 * embute o 3 × frente mais fraca e os Critérios da partida); em cima disso
 * entram os recursos que ainda vão virar ponto até o ano 5.
 */
/**
 * Quanto vale 1 ponto de reputação NESTA frente, para ESTE jogador, agora.
 * Subir a frente mais fraca move o multiplicador de 3× e é o que decide a
 * partida; subir a mais forte é quase decoração — e, no Sócio Exigente, teto.
 */
function pesoDaFrente(s, j, frente) {
  const valores = FRENTES.map((f) => j.rep[f]);
  const menor = Math.min(...valores);
  if (s.variante === 'exigente' && j.rep[frente] >= menor + 3) return 0.15;
  if (j.rep[frente] === menor) return 2.4;
  if (j.rep[frente] <= menor + 1) return 1.3;
  return 0.9;
}

function avaliarPosicao(s, jogadorId) {
  const j = s.jogadores.find((x) => x.id === jogadorId);
  if (!j) return -Infinity;
  const cfg = s.config;
  const ficha = pontuarJogador(s, j, s.variante);
  let v = ficha.total;

  // Critério Oculto: o bot não pode pontuar pelo que ainda não foi revelado —
  // senão ele joga com a carta na mão e o humano no escuro. Sem saber o alvo,
  // a jogada segura é a mesma que o `3 × a menor` já premia: não ter buraco.
  if (s.criteriosOcultos && s.fase !== 'fim') {
    const vistos = (j.espiados || []).map((i) => 'criterio:' + s.criterios[i]);
    for (const l of ficha.linhas) {
      if (String(l.chave).startsWith('criterio:') && !vistos.includes(l.chave)) v -= l.pontos;
    }
  }

  // Três fichas tiram o jogador da disputa, qualquer que seja o total (§6.6).
  if (j.conduta >= cfg.conduta_limite) v -= 50;

  const anosRestantes = Math.max(0, cfg.rodadas - s.rodada);
  const cedo = anosRestantes / cfg.rodadas;      // 1 no começo, 0 no último ano

  // Reputação já conquistada, pesada pela frente. O total da pontuação sozinho
  // não basta: cedo, subir uma frente que não é a única mais fraca vale +1 e o
  // bot preferiria guardar a carta. Este termo é o que o faz ir ao Fórum.
  v += FRENTES.reduce((t, f) => t + j.rep[f] * pesoDaFrente(s, j, f), 0);

  // Motor: conhecimento e equipe valem mais cedo, quando ainda dá tempo de usá-los.
  v += j.conhecimento * (0.3 + 0.9 * cedo);
  v += equipeDe(j).length * (0.2 + 0.5 * cedo);
  v += j.energia * 0.2;
  // Cliente não é só renda: o da MESMA ÁREA de um processo em carteira desconta
  // 1 de energia na hora de protocolar. A avaliação ignorava isso e tratava os
  // trinta clientes como iguais — por isso o bot nunca teve motivo para
  // escolher um cliente em vez de outro, e nunca cavaria: cavar existe
  // justamente para ir atrás da área que falta. O peso 0,6 é deliberadamente
  // modesto, cerca de três unidades de energia pela régua da linha acima.
  const areasEmCarteira = new Set(j.carteira.map((i) => processo(i.cartaId).area));
  v += j.clientes.reduce((t, c) => t + c.nivel * 0.25 + 0.35
    + (areasEmCarteira.has(cliente(c.cartaId).area) ? 0.6 : 0), 0) * (0.5 + 0.7 * cedo);

  // Carta na carteira vale MENOS do que a mesma carta vencida — senão o bot
  // acha ótimo guardar processo e nunca protocolar nada, que é o oposto do jogo.
  for (const item of j.carteira) {
    const carta = processo(item.cartaId);
    const pontos = Object.values(carta.rep).reduce((a, b) => a + b, 0);
    const av = avaliarProcesso(s, j, item.cartaId);
    const chance = av.ok ? 0.6 : (av.faltaConhecimento <= 1 ? 0.35 : 0.15);
    v += (pontos * 0.5 + carta.honorario * 0.15) * chance;
    // Prazo estourando sem conseguir jogar custa 1 de Atuação no Fechamento.
    if (item.cubos <= 1 && !av.ok) v -= 1.2;
  }
  return v;
}

function combinacoes(lista, tamanho) {
  if (tamanho === 0) return [[]];
  const saida = [];
  for (let i = 0; i < lista.length; i++) {
    for (const resto of combinacoes(lista.slice(i + 1), tamanho - 1)) {
      saida.push([lista[i], ...resto]);
    }
  }
  return saida;
}

/** Todas as respostas legais para a pendência atual. */
function resolucoesPendentes(s) {
  if (!s.pendente) return [];
  const j = s.jogadores.find((x) => x.id === s.pendente.jogadorId)
         || s.jogadores.find((x) => x.id === (s.pendente.fila || [])[0]);
  const cfg = s.config;

  switch (s.pendente.tipo) {
    case 'recepcao': {
      const pegar = podeCaptarCliente(s, j)
        ? s.mercadoClientes.map((id) => ac.recepcaoEscolher(id))
        : [];
      return podeCavarCliente(s, j) ? [...pegar, ac.recepcaoCavar()] : pegar;
    }

    case 'recepcao_cavada':
      // Uma resposta por carta que ele pode ficar. A troca do mercado não entra
      // na busca: ela não muda nada para quem está cavando, só para os outros,
      // e o bot de busca só enxerga o próprio placar.
      return s.pendente.mao.map((id) => ac.recepcaoCavarFicar(id, null));

    case 'espiar':
      // Critério Oculto: ele olha um dos que ainda não viu. Como não sabe o que
      // há em nenhum, a escolha é indiferente — pega o primeiro disponível.
      return s.criterios
        .map((_, i) => i)
        .filter((i) => !(j.espiados || []).includes(i))
        .map((i) => ac.espiar(i));

    case 'forum': {
      const opcoes = processosResolviveis(s, j).filter((o) => o.jogavel);
      const acoes = [ac.forumResolver(null)];
      for (const o of opcoes) {
        acoes.push(ac.forumResolver(o.cartaId, o.exigeAtalho));
        const gasto = avaliarProcesso(s, j, o.cartaId, { atalhoEtico: o.exigeAtalho }).custoEnergia
          + cfg.energia_extra_segundo_processo;
        for (const o2 of processosResolviveis(s, j, gasto)) {
          // v9: o segundo processo da ida não aceita atalho
          if (o2.cartaId === o.cartaId || !o2.semAtalho.ok) continue;
          acoes.push(ac.forumResolver(o.cartaId, o.exigeAtalho,
            { processoId: o2.cartaId, usarAtalhoEtico: false }));
        }
      }
      return acoes;
    }

    case 'reuniao': {
      const acoes = [];
      if (podeContratar(s, j)) acoes.push(ac.reuniao('contratar'));
      for (const p of estagiariosPromoviveis(s, j)) {
        if (j.dinheiro >= cfg.custo_promover_advogado) acoes.push(ac.reuniao('promover', p.id));
      }
      return acoes;
    }

    case 'cafezinho': {
      // v9: cliente já no 3 também pode ir — paga $1. Entram todos.
      const subiveis = j.clientes.map((c) => c.cartaId);
      const acoes = [];
      for (let k = 0; k <= Math.min(cfg.cafezinho_clientes, subiveis.length); k++) {
        for (const combo of combinacoes(subiveis, k)) acoes.push(ac.cafezinho(combo));
      }
      return acoes;
    }

    case 'descarte_excedente': {
      const excesso = j.carteira.length - cfg.limite_carteira;
      return combinacoes(j.carteira.map((c) => c.cartaId), excesso)
        .map((ids) => ac.draftDescartar(j.id, ids));
    }

    case 'demitir':
      return j.pecas.filter((p) => p.tipo !== 'titular')
        .map((p) => ac.fechamentoDemitir(j.id, p.id));

    default:
      return [];
  }
}

/** Simula a ação e devolve a nota da posição resultante (−Infinity se ilegal). */
function notaDe(s, acao, jogadorId, profundidade = 1) {
  let depois;
  try { depois = reducer(s, acao); } catch (e) { return -Infinity; }

  // Se a jogada abriu uma pendência do mesmo jogador, o valor dela é o da
  // melhor resolução possível — senão o bot escolheria a sala às cegas.
  if (profundidade > 0 && depois.pendente
      && depois.pendente.jogadorId === jogadorId) {
    const respostas = resolucoesPendentes(depois);
    if (respostas.length) {
      let melhor = -Infinity;
      for (const r of respostas) melhor = Math.max(melhor, notaDe(depois, r, jogadorId, 0));
      return melhor;
    }
  }
  return avaliarPosicao(depois, jogadorId);
}

/** Jogadas legais do jogador da vez, na fase em que ele está. */
function candidatos(s) {
  if (s.pendente) return resolucoesPendentes(s);

  if (s.fase === 'pauta') {
    const j = s.jogadores[s.ordem[s.draft.turno]];
    return s.draft.maos[s.jogadores.indexOf(j)].map((id) => ac.draftEscolher(j.id, id));
  }

  if (s.fase === 'escritorio') {
    const j = daVezAuto(s);
    const lista = acoesLegais(s).alocacoes
      .filter((a) => a.ok)
      .map((a) => ac.alocar(j.id, a.pecaId, a.salaId));
    lista.push(ac.passar(j.id));
    return lista;
  }

  if (s.fase === 'fechamento') return [ac.fecharMes()];
  return [];
}

/**
 * A jogada do bot: a de melhor nota. Empates ficam com a primeira, o que
 * mantém o comportamento determinístico para uma mesma semente.
 */
function melhorJogada(s) {
  if (s.fase === 'fim') return null;
  const jogadorId = s.pendente
    ? (s.pendente.jogadorId || (s.pendente.fila || [])[0])
    : (s.fase === 'pauta' ? s.jogadores[s.ordem[s.draft.turno]].id
      : s.fase === 'escritorio' ? daVezAuto(s).id : null);
  if (!jogadorId) return proximaAcaoAutomatica(s);

  const lista = candidatos(s);
  if (lista.length === 0) return proximaAcaoAutomatica(s);

  let melhor = null;
  let melhorNota = -Infinity;
  for (const acao of lista) {
    const nota = notaDe(s, acao, jogadorId);
    if (nota > melhorNota) { melhorNota = nota; melhor = acao; }
  }
  return melhor || proximaAcaoAutomatica(s);
}

/** Escolhe a jogada conforme o nível pedido. */
function jogadaDoBot(s, nivel = 'normal') {
  return nivel === 'facil' ? proximaAcaoAutomatica(s) : melhorJogada(s);
}

/** Roda a partida até o fim. Devolve o estado final. */
function jogarPartidaCompleta(estadoInicial, maxAcoes = 20000) {
  let s = estadoInicial;
  for (let i = 0; i < maxAcoes; i++) {
    const acao = proximaAcaoAutomatica(s);
    if (!acao) return s;
    s = reducer(s, acao);
  }
  throw new Error('A partida automática não terminou em ' + maxAcoes + ' ações.');
}




/* =============== ui/store.js =============== */
// ui/store.js — a única ponte entre a interface e o motor.
// Guarda o estado do jogo, o histórico para desfazer e o estado *de tela*
// (peça selecionada, modal aberto), que nunca entra no estado do jogo.


const CHAVE_SALVA = 'suit.partida.v1';
const LIMITE_HISTORICO = 60;

/** Quem tem de agir agora — é isso que define "o turno" para o desfazer. */
function atorDe(s) {
  if (!s) return null;
  if (s.pendente) {
    if (s.pendente.jogadorId) return s.pendente.jogadorId;
    if (s.pendente.fila && s.pendente.fila.length) return s.pendente.fila[0];
  }
  if (s.fase === 'pauta' && s.draft) return s.jogadores[s.ordem[s.draft.turno]].id;
  if (s.fase === 'escritorio') return s.jogadores[s.ordem[s.turnoIdx]].id;
  if (s.fase === 'fechamento' && s.fechamento && s.fechamento.idx < s.jogadores.length) {
    return s.jogadores[s.ordem[s.fechamento.idx]].id;
  }
  return null;
}

const store = {
  estado: null,
  historico: [],
  ultimoAtor: null,
  ouvintes: [],

  // Estado de tela — reiniciado a cada ação.
  vista: {
    pecaSelecionada: null,
    modal: null,           // 'ajuda' | 'debug' — modais que não vêm do motor
    escolha: {},           // seleções dentro de um modal; nunca é estado do jogo
    logAberto: false,
    aguardandoPassagem: null,  // id do jogador para quem passar o dispositivo
    erro: null,
    fechamentoAberto: true,
  },

  inscrever(fn) { this.ouvintes.push(fn); },
  notificar() { for (const fn of this.ouvintes) fn(this.estado, this.vista); },

  /** Executa uma ação do motor. Erros de regra viram aviso na tela. */
  despachar(acao) {
    const antes = this.estado;
    try {
      const ator = atorDe(antes);
      const novo = reducer(antes, acao);
      // Relógio de cada jogador: o tempo desde o lance anterior vai para quem fez este lance.
      // Um lance sozinho conta no máximo 10 minutos (aba esquecida aberta não vira "tempo de jogo").
      const agora = Date.now();
      novo.tempos = { ...((antes && antes.tempos) || {}) };
      if (antes && ator && this.marcoTempo) {
        novo.tempos[ator] = (novo.tempos[ator] || 0) + Math.min(agora - this.marcoTempo, 10 * 60 * 1000);
      }
      this.marcoTempo = agora;
      if (antes) {
        this.historico.push({ snap: JSON.stringify(antes), ator, rodada: antes.rodada });
        if (this.historico.length > LIMITE_HISTORICO) this.historico.shift();
        this.ultimoAtor = ator;
      } else {
        this.historico = [];
        this.ultimoAtor = null;
      }
      this.estado = novo;
      this.vista.erro = null;
      this.vista.pecaSelecionada = null;
      this.vista.modal = null;
      this.vista.escolha = {};
      this.salvar();
    } catch (e) {
      this.vista.erro = e.message;
      // eslint-disable-next-line no-console
      console.warn('[SUIT] ação recusada:', acao, e);
    }
    this.notificar();
    return this.estado;
  },

  /** Só desfaz enquanto as ações seguidas forem do mesmo jogador (§9). */
  podeDesfazer() {
    const topo = this.historico[this.historico.length - 1];
    return !!topo && !!this.estado && this.estado.fase !== 'fim' && topo.ator === this.ultimoAtor;
  },

  desfazer() {
    if (!this.podeDesfazer()) return;
    const topo = this.historico.pop();
    this.estado = JSON.parse(topo.snap);
    this.ultimoAtor = topo.ator;
    this.vista.pecaSelecionada = null;
    this.vista.modal = null;
    this.vista.escolha = {};
    this.vista.erro = null;
    this.salvar();
    this.notificar();
  },

  atualizarVista(campos) {
    Object.assign(this.vista, campos);
    this.notificar();
  },

  /* ---------------------------------------------------------- persistência */

  salvar() {
    try {
      if (!this.estado) return;
      localStorage.setItem(CHAVE_SALVA, JSON.stringify({
        estado: this.estado, salvoEm: new Date().toISOString(),
      }));
    } catch (e) { /* modo privado ou storage bloqueado: seguir sem salvar */ }
  },

  lerSalvo() {
    try {
      const bruto = localStorage.getItem(CHAVE_SALVA);
      return bruto ? JSON.parse(bruto) : null;
    } catch (e) { return null; }
  },

  carregar() {
    const salvo = this.lerSalvo();
    if (!salvo || !salvo.estado) return false;
    this.estado = salvo.estado;
    this.marcoTempo = Date.now();
    this.historico = [];
    this.ultimoAtor = null;
    this.vista.modal = null;
    this.vista.escolha = {};
    this.vista.pecaSelecionada = null;
    this.vista.aguardandoPassagem = null;
    this.vista.ultimoAtorVisto = null;
    this.notificar();
    return true;
  },

  apagarSalvo() {
    try { localStorage.removeItem(CHAVE_SALVA); } catch (e) { /* ignora */ }
  },

  novaPartida(opcoes) {
    this.estado = null;
    this.historico = [];
    this.ultimoAtor = null;
    this.vista.aguardandoPassagem = null;
    this.despachar(ac.novaPartida(opcoes));
  },
};

/* ------------------------------------------------------------------ *
 * DOM
 * ------------------------------------------------------------------ */

function h(tag, props, ...filhos) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'texto') el.textContent = v;
      else if (k === 'estilo') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  for (const f of filhos.flat(4)) {
    if (f === null || f === undefined || f === false) continue;
    el.appendChild(typeof f === 'object' ? f : document.createTextNode(String(f)));
  }
  return el;
}

const frag = (...filhos) => {
  const f = document.createDocumentFragment();
  for (const c of filhos.flat(4)) if (c) f.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  return f;
};

function cartaProcesso(cartaId, opcoes = {}) {
  const {
    cubos = null, aoClicar = null, selecionada = false,
    bloqueada = false, motivo = '', atalho = false, compacta = false,

    // mostra os dois números — o jogador precisa ver o que vai pagar de fato.
    energiaEfetiva = null,
  } = opcoes;
  const c = processo(cartaId);
  const total = c.prazo;
  const restantes = cubos === null ? total : cubos;
  const urgente = cubos !== null && restantes === 1;

  const classes = ['carta'];
  if (aoClicar && !bloqueada) classes.push('carta--clicavel');
  if (selecionada) classes.push('carta--selecionada');
  if (bloqueada) classes.push('carta--bloqueada');
  if (atalho) classes.push('carta--atalho');
  if (urgente) classes.push('carta--urgente');

  const ganhos = Object.entries(c.rep)
    .map(([f, pts]) => h('span', { class: 'linha-flex', style: `gap:.2rem` },
      h('i', { estilo: { width: '8px', height: '8px', borderRadius: '2px', background: FRENTE_INFO[f].cor, display: 'inline-block' } }),
      `+${pts} ${f}`));

  return h(aoClicar && !bloqueada ? 'button' : 'div', {
    class: classes.join(' '),
    type: aoClicar ? 'button' : null,
    title: motivo || `${c.nome} — ${PORTE_NOME[c.porte]}, ${c.area}`,
    onclick: bloqueada ? null : aoClicar,
  },
    h('div', { class: 'faixa', estilo: { background: COR_AREA[c.area] || '#5A6862' } },
      h('span', { texto: c.area }),
      h('span', { class: 'selo', texto: c.porte })),
    h('div', { class: 'titulo', texto: c.nome }),
    !compacta && h('div', { class: 'linhas' },
      h('div', { class: 'custos' },
        h('span', { class: 'rot', texto: 'Custa' }),
        h('div', { texto: `📖 ${c.conhecimento}` }),
        energiaEfetiva !== null && energiaEfetiva !== c.energia
          ? h('div', { class: 'com-desconto', title: `Cliente de ${c.area} na sua mesa: −1 de energia` },
            `⚡ ${energiaEfetiva} `, h('s', { texto: c.energia }))
          : h('div', { texto: `⚡ ${c.energia}` }),
        c.exigencia && h('span', { class: 'exig', texto: CATALOGO.exigTexto[c.exigencia] })),
      h('div', { class: 'ganhos' },
        h('span', { class: 'rot', texto: 'Rende' }),
        h('div', { class: 'honor', texto: dinheiro(c.honorario) }),
        ...ganhos)),
    h('div', { class: 'prazo' },
      h('span', { texto: 'Prazo' }),
      ...Array.from({ length: total }, (_, i) =>
        h('i', { class: 'cubo' + (i < restantes ? '' : ' cubo--gasto') })),
      urgente && h('span', { texto: '· último ano!' })),

/* ------------------------------------------------------------------ *
 * Radar das cinco frentes (placar final)
 * ------------------------------------------------------------------ */

function radar(jogador, tamanho = 150, escala = null) {
  const cx = tamanho / 2; const cy = tamanho / 2; const raio = tamanho * 0.36;
  const max = escala || Math.max(4, ...FRENTES.map((f) => jogador.rep[f]));
  const ponto = (i, r) => {
    const ang = (Math.PI * 2 * i) / 5 - Math.PI / 2;
    return [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r];
  };
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', tamanho); svg.setAttribute('height', tamanho);
  svg.setAttribute('viewBox', `0 0 ${tamanho} ${tamanho}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label',
    'Reputação de ' + jogador.nome + ': ' + FRENTES.map((f) => `${f} ${jogador.rep[f]}`).join(', '));

  for (const frac of [0.25, 0.5, 0.75, 1]) {
    const p = document.createElementNS(ns, 'polygon');
    p.setAttribute('points', FRENTES.map((_, i) => ponto(i, raio * frac).join(',')).join(' '));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#C9D2CC');
    p.setAttribute('stroke-width', frac === 1 ? '1.4' : '.7');
    svg.appendChild(p);
  }
  const area = document.createElementNS(ns, 'polygon');
  area.setAttribute('points', FRENTES.map((f, i) =>
    ponto(i, raio * (jogador.rep[f] / max)).join(',')).join(' '));
  area.setAttribute('fill', jogador.cor.hex + '55');
  area.setAttribute('stroke', jogador.cor.hex);
  area.setAttribute('stroke-width', '2');
  svg.appendChild(area);

  FRENTES.forEach((f, i) => {
    const [x, y] = ponto(i, raio + 13);
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y + 3);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '9');
    t.setAttribute('fill', '#5A6862');
    t.textContent = `${f} ${jogador.rep[f]}`;
    svg.appendChild(t);
  });
  return svg;
}

/* ------------------------------------------------------------------ *
 * O logotipo: SUIT com a gravata no lugar do I
 *
 * A gravata é SVG, não fonte: escala sem serrilhar e imprime nítida. As
 * proporções são as mesmas do suit_logo.py usado nos PDFs, para o digital e o
 * impresso não divergirem.
 * ------------------------------------------------------------------ */

const NS_SVG = 'http://www.w3.org/2000/svg';

/**
 * Gravata em SVG, desenhada numa caixa de 42 × 100 (largura × altura de caixa
 * alta). Quem chama define o tamanho por CSS.
 */
function gravataSVG(cor = '#C4161C', dobra = true) {
  const svg = document.createElementNS(NS_SVG, 'svg');
  svg.setAttribute('viewBox', '0 0 42 100');
  svg.setAttribute('class', 'gravata');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');

  const cam = (d, preenche) => {
    const p = document.createElementNS(NS_SVG, 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', preenche);
    svg.appendChild(p);
  };

  // pala: pescoço reto, barriga no terço de baixo, ponta curta
  cam('M8.8 16 H33.2 L33.6 42 L42 78 L37.8 90 L21 100 L4.2 90 L0 78 L8.4 42 Z', cor);
  // nó, por cima do começo da pala
  cam('M5 0 H37 L33.6 18.5 H8.4 Z', cor);

  if (dobra) {
    cam('M25.6 16 H33.2 L33.6 42 L42 78 L37.8 90 L26 96.5 Z', '#A11117');
    cam('M26.5 0 H37 L33.6 18.5 H26.5 Z', '#8E0D14');
  }
  return svg;
}

/**
 * A palavra SUIT com a gravata no I.
 * `tamanho` é qualquer medida CSS válida (ex.: '1.25rem'); as letras herdam a
 * cor do elemento pai, a gravata usa `corGravata`.
 */
function logotipoSUIT(tamanho = '1.25rem', corGravata = '#C4161C', dobra = true) {
  const el = h('span', { class: 'logo-suit', estilo: { fontSize: tamanho } },
    h('span', { class: 'logo-suit__letras', texto: 'SU' }),
    h('span', { class: 'logo-suit__i' }, gravataSVG(corGravata, dobra)),
    h('span', { class: 'logo-suit__letras', texto: 'T' }));
  el.setAttribute('role', 'img');
  el.setAttribute('aria-label', 'SUIT');
  return el;
}
