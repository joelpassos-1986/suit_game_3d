<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUIT 3D</title>
<style>
/* SUIT — folha de estilo única.
   Paleta do protótipo (§22): tinta #1A2420, acento #1F5C46, neutro #5A6862,
   linha #C9D2CC, fundo #EDF2EE. Vermelho é exclusivo de Conduta e perdas. */

:root {
  --tinta: #1A2420;
  --acento: #1F5C46;
  --acento-claro: #2E7A5E;
  --neutro: #5A6862;
  --linha: #C9D2CC;
  --fundo: #EDF2EE;
  --papel: #FBFAF6;
  --papel-2: #F3F1E9;
  --madeira: #6B563F;
  --perda: #B03A3A;
  --alerta: #C9822A;
  --ouro: #C9A227;

  --est: #2F6DB5;
  --cap: #B5762F;
  --atu: #1F5C46;
  --lid: #6B3FA0;
  --rel: #A03F52;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --r: 6px;
  --sombra: 0 1px 2px rgba(26,36,32,.10), 0 4px 14px rgba(26,36,32,.07);
}

* { box-sizing: border-box; }

/* O jogo assume um mundo só: papel creme, madeira, verde jurídico (§22). Não há
   tema escuro de propósito — mas isso precisa ser declarado, senão o navegador
   de quem estiver no modo escuro desenha os controles de formulário em preto
   sobre a nossa mesa clara. */
html { color-scheme: light; }

html, body {
  margin: 0; height: 100%;
  background: var(--fundo);
  color: var(--tinta);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* ---------------------------------------------------------- estrutura */

.app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

.topo {
  display: flex; align-items: center; gap: 1rem;
  padding: .5rem .9rem;
  background: var(--tinta); color: var(--fundo);
  border-bottom: 3px solid var(--acento);
  flex: 0 0 auto;
  position: relative; z-index: 40;
}
.marca { font-family: var(--serif); font-size: 1.25rem; letter-spacing: .18em; font-weight: 700; }
.marca small { display: block; font-size: .52rem; letter-spacing: .14em; opacity: .65;
               font-family: var(--sans); font-weight: 400; margin-top: -2px; }
.ano { font-family: var(--serif); font-size: 1rem; }
.ano b { color: var(--ouro); }
.fase-atual {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .1em;
  background: rgba(255,255,255,.12); padding: .2rem .5rem; border-radius: 999px;
}
.topo .criterios { display: flex; gap: .35rem; margin-left: auto; }
.topo .botoes { display: flex; gap: .35rem; }
.topo button {
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
  color: var(--fundo); border-radius: var(--r); padding: .3rem .55rem; font-size: .78rem;
}
.topo button:hover { background: rgba(255,255,255,.2); }

.principal {
  flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) 25rem;
  gap: .8rem; padding: .8rem; overflow: hidden;
}
.coluna { min-width: 0; overflow-y: auto; overflow-x: hidden; padding-right: .2rem; }
.coluna-mesa { border-left: 1px solid var(--linha); padding-left: .8rem; }

@media (max-width: 1100px) {
  .principal { grid-template-columns: 1fr; }
  .coluna-mesa { border-left: 0; border-top: 1px solid var(--linha); padding-left: 0; padding-top: .8rem; }
}

.painel {
  background: var(--papel); border: 1px solid var(--linha);
  border-radius: var(--r); box-shadow: var(--sombra); margin-bottom: .8rem;
}
.painel > header {
  display: flex; align-items: baseline; gap: .5rem;
  padding: .45rem .7rem; border-bottom: 1px solid var(--linha);
  background: var(--papel-2); border-radius: var(--r) var(--r) 0 0;
}
.painel > header h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .1em; color: var(--neutro); }
.painel > .corpo { padding: .7rem; }

/* ---------------------------------------------------------- tabuleiro */

.salas { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
@media (max-width: 780px) { .salas { grid-template-columns: repeat(2, 1fr); } }

.sala {
  background: var(--papel); border: 1px solid var(--linha); border-radius: var(--r);
  padding: .55rem .6rem .6rem; box-shadow: var(--sombra);
  display: flex; flex-direction: column; gap: .4rem; position: relative;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.sala h4 { font-size: .95rem; display: flex; align-items: center; gap: .35rem; }
.sala .icone { font-size: 1rem; }
.sala .efeitos { font-size: .72rem; color: var(--neutro); line-height: 1.35; margin: 0; padding-left: .9rem; }
.sala .efeitos li { margin-bottom: .1rem; }
.sala .quem { font-size: .64rem; text-transform: uppercase; letter-spacing: .07em; color: var(--neutro); }

/* O Fórum é a única sala fora do escritório e a única que produz reputação. */
.sala--forum { background: linear-gradient(#F0F4F7, #E8EFF3); border-color: #B9C7D2; }
.sala--forum h4 { color: #234E63; }
.sala--disponivel { border-color: var(--acento); box-shadow: 0 0 0 2px rgba(31,92,70,.16), var(--sombra); }
.sala--bloqueada { opacity: .5; }

.espacos { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: auto; padding-top: .25rem; }
.espaco {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px dashed var(--linha); background: #fff;
  display: grid; place-items: center; padding: 0;
  font-size: .7rem; font-weight: 700; color: var(--neutro);
}
.espaco--livre.espaco--legal { border-style: solid; border-color: var(--acento); background: #E6F0EA; cursor: pointer; }
.espaco--livre.espaco--legal:hover { background: var(--acento); color: #fff; transform: scale(1.08); }
.espaco--livre.espaco--ilegal { cursor: not-allowed; opacity: .55; }
.espaco--ocupado { border-style: solid; cursor: default; }

.disco {
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  color: #fff; font-size: .68rem; font-weight: 700;
  border: 2px solid rgba(255,255,255,.55);
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
}
.disco--titular { box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 0 0 2px rgba(26,36,32,.55); }

/* mercado e baralhos */
.mercado { display: flex; gap: .5rem; flex-wrap: wrap; }
.baralhos { display: flex; gap: .5rem; flex-wrap: wrap; align-items: stretch; }
.monte {
  background: var(--madeira); color: #F6F1E8; border-radius: var(--r);
  padding: .4rem .55rem; min-width: 5.4rem; box-shadow: var(--sombra);
  border: 1px solid rgba(0,0,0,.2);
}
.monte b { display: block; font-size: 1.15rem; font-family: var(--serif); }
.monte span { font-size: .66rem; opacity: .85; text-transform: uppercase; letter-spacing: .06em; }
.monte--vazio { background: #8C8577; opacity: .6; }

/* ---------------------------------------------------------- cartas */

.carta {
  width: 9.4rem; background: var(--papel); border: 1px solid var(--linha);
  border-radius: var(--r); box-shadow: var(--sombra); overflow: hidden;
  display: flex; flex-direction: column; text-align: left; padding: 0;
  position: relative; transition: transform .12s, box-shadow .12s;
}
.carta--clicavel { cursor: pointer; }
.carta--clicavel:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(26,36,32,.18); }
.carta--selecionada { outline: 3px solid var(--acento); outline-offset: 1px; }
.carta--bloqueada { opacity: .45; cursor: not-allowed; }
.carta--atalho { outline: 2px dashed var(--alerta); outline-offset: 1px; }

.carta .faixa {
  font-size: .62rem; text-transform: uppercase; letter-spacing: .08em;
  padding: .18rem .4rem; color: #fff; display: flex; justify-content: space-between; align-items: center;
}
.carta .selo {
  background: rgba(255,255,255,.9); color: var(--tinta); border-radius: 3px;
  padding: 0 .22rem; font-weight: 700; font-size: .6rem;
}
.carta .titulo { font-family: var(--serif); font-size: .78rem; line-height: 1.2;
                 padding: .35rem .4rem .25rem; min-height: 2.6em; }
.carta .linhas { display: flex; border-top: 1px solid var(--linha); font-size: .68rem; }
.carta .custos, .carta .ganhos { flex: 1; padding: .3rem .4rem; }
.carta .custos { border-right: 1px solid var(--linha); background: #F7F4EC; }
.carta .ganhos { background: #F0F5F1; }
.carta .rot { display: block; font-size: .55rem; text-transform: uppercase;
              letter-spacing: .07em; color: var(--neutro); margin-bottom: .12rem; }
.carta .exig { display: block; margin-top: .15rem; color: var(--madeira); font-size: .63rem; }
.carta .honor { font-family: var(--serif); font-size: .95rem; font-weight: 700; }
.carta .prazo { display: flex; gap: .15rem; padding: .25rem .4rem; border-top: 1px solid var(--linha);
                align-items: center; font-size: .6rem; color: var(--neutro); }
.cubo { width: 9px; height: 9px; background: var(--acento); border-radius: 2px; }
.cubo--gasto { background: var(--linha); }
.carta--urgente { animation: pisca 1.1s ease-in-out infinite; }
.carta--urgente .prazo { color: var(--perda); font-weight: 700; }
.carta--urgente .cubo { background: var(--perda); }
@keyframes pisca { 0%,100% { box-shadow: 0 0 0 0 rgba(176,58,58,.55), var(--sombra); }
                   50% { box-shadow: 0 0 0 5px rgba(176,58,58,0), var(--sombra); } }
.motivo-bloqueio { font-size: .62rem; color: var(--perda); padding: .25rem .4rem; background: #FBEDED; }

.cartas { display: flex; gap: .5rem; flex-wrap: wrap; }

/* cliente */
.cliente {
  width: 8.6rem; background: var(--papel); border: 1px solid var(--linha);
  border-radius: var(--r); box-shadow: var(--sombra); padding: .4rem .45rem;
  display: flex; flex-direction: column; gap: .25rem; text-align: left;
}
.cliente--clicavel { cursor: pointer; }
.cliente--clicavel:hover { border-color: var(--acento); background: #F2F8F4; }
.cliente--selecionado { outline: 3px solid var(--acento); outline-offset: 1px; }
.cliente .nome { font-family: var(--serif); font-size: .78rem; line-height: 1.15; }
.cliente .area { font-size: .6rem; text-transform: uppercase; letter-spacing: .07em; color: var(--neutro); }
.niveis { display: flex; gap: .18rem; }
.niveis i {
  width: 100%; height: 5px; border-radius: 2px; background: var(--linha);
}
.niveis i.ativo { background: var(--acento); }
.niveis i.ativo--baixo { background: var(--alerta); }

/* critério do sócio — a regra da partida, não um recurso */
.criterio {
  background: var(--tinta); color: #EDE7D8; border: 1px solid #000;
  border-radius: var(--r); padding: .3rem .5rem; max-width: 13rem;
}
.criterio b { font-family: var(--serif); font-size: .76rem; display: block; color: var(--ouro); }
.criterio span { font-size: .63rem; line-height: 1.25; display: block; opacity: .9; }
.criterios-grid { display: flex; gap: .5rem; flex-wrap: wrap; }

/* verso da carta de Critério, na variante Critério Oculto */
.criterio--virado {
  width: 2.1rem; min-height: 1.7rem; display: grid; place-items: center;
  font-family: var(--serif); font-size: 1rem; font-weight: 700; color: var(--ouro);
  background: repeating-linear-gradient(45deg, #1A2420 0 5px, #222D28 5px 10px);
  border-color: var(--ouro); opacity: .9;
}

/* ---------------------------------------------------------- mesa */

.mesa-cabeca { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
.mesa-cabeca h2 { font-size: 1.15rem; }
.pino { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,.25); flex: 0 0 auto; }
.etiqueta { font-size: .6rem; text-transform: uppercase; letter-spacing: .08em;
            background: var(--linha); color: var(--tinta); border-radius: 999px; padding: .1rem .4rem; }
.etiqueta--primeiro { background: var(--ouro); }

/* avaliação: o único elemento "de sistema" da mesa */
.avaliacao { background: var(--tinta); border-radius: var(--r); padding: .5rem .6rem; }
.avaliacao h4 { color: #9FB3A9; font-size: .62rem; text-transform: uppercase;
                letter-spacing: .12em; margin-bottom: .35rem; font-family: var(--sans); }
.frente { display: grid; grid-template-columns: 1.1rem 2.1rem 1fr 1.5rem; align-items: center;
          gap: .35rem; margin-bottom: .22rem; }
.frente .sig { font-size: .62rem; font-weight: 700; color: #C9D2CC; letter-spacing: .04em; }
.frente .barra { height: 8px; background: rgba(255,255,255,.10); border-radius: 3px; overflow: hidden; }
.frente .barra i { display: block; height: 100%; border-radius: 3px; }
.frente .valor { color: #EDF2EE; font-size: .76rem; text-align: right; font-weight: 600; }
.frente--menor .valor { color: var(--ouro); }
.frente--menor .sig::after { content: " ▾"; color: var(--ouro); }

.recursos { display: flex; gap: .4rem; flex-wrap: wrap; margin: .5rem 0; }
.recurso {
  background: var(--papel-2); border: 1px solid var(--linha); border-radius: var(--r);
  padding: .28rem .45rem; min-width: 4.1rem; flex: 1 1 auto;
}
.recurso span { display: block; font-size: .58rem; text-transform: uppercase;
                letter-spacing: .07em; color: var(--neutro); }
.recurso b { font-family: var(--serif); font-size: 1.05rem; }
.recurso--perda { background: #FBEDED; border-color: #E5BDBD; }
.recurso--perda b { color: var(--perda); }

.pips { display: flex; gap: .12rem; margin-top: .15rem; }
.pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--linha); }
.pips i.cheio { background: var(--acento); }
.pips--energia i.cheio { background: var(--madeira); }

.equipe { display: flex; gap: .35rem; flex-wrap: wrap; }
.peca {
  display: flex; align-items: center; gap: .3rem; padding: .25rem .45rem .25rem .3rem;
  border: 1px solid var(--linha); border-radius: 999px; background: var(--papel);
}
.peca--livre { cursor: pointer; }
.peca--livre:hover { border-color: var(--acento); background: #EFF6F1; }
.peca--selecionada { outline: 3px solid var(--acento); outline-offset: 1px; }
.peca--alocada { opacity: .45; }
.peca--deitada { opacity: .5; transform: rotate(-6deg); border-style: dashed; }
.peca .rotulo { font-size: .68rem; }

.postits { display: flex; gap: .25rem; flex-wrap: wrap; }
.postit {
  background: #E8564F; color: #fff; font-size: .58rem; padding: .18rem .3rem;
  border-radius: 2px; transform: rotate(-3deg); box-shadow: 0 1px 3px rgba(0,0,0,.25);
  font-weight: 700; letter-spacing: .04em;
}
.postit:nth-child(even) { transform: rotate(2.5deg); }

/* rivais */
.rivais { display: flex; gap: .5rem; flex-wrap: wrap; }
.rival {
  flex: 1 1 12rem; background: var(--papel); border: 1px solid var(--linha);
  border-left: 4px solid var(--linha); border-radius: var(--r); padding: .4rem .5rem;
  font-size: .72rem; box-shadow: var(--sombra);
}
.rival--vez { border-color: var(--acento); background: #F2F8F4; }
.rival .cabeca { display: flex; align-items: center; gap: .35rem; margin-bottom: .25rem; }
.rival .cabeca b { font-family: var(--serif); font-size: .84rem; }
.rival .reps { display: flex; gap: .28rem; margin-bottom: .2rem; }
.rival .reps span { font-size: .64rem; display: inline-flex; align-items: center; gap: .12rem; }
.rival .reps i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
.rival .linha2 { color: var(--neutro); display: flex; gap: .5rem; flex-wrap: wrap; font-size: .68rem; }

/* ------------------------------------------------- legenda ao passar o mouse
   Qualquer elemento com [data-dica="texto"] mostra uma tarjinha explicando o
   que ele é. Existe porque ícone sem nome só é óbvio para quem desenhou. */

[data-dica] { position: relative; cursor: help; }

[data-dica]::after,
[data-dica]::before {
  opacity: 0; visibility: hidden; pointer-events: none; z-index: 60;
  transition: opacity .12s ease, visibility 0s linear .32s;
}

[data-dica]::after {
  content: attr(data-dica);
  position: absolute; left: 50%; bottom: calc(100% + 6px);
  transform: translateX(-50%);
  background: #26241F; color: #F7F4EC;
  font-family: var(--sans); font-size: .68rem; font-weight: 400;
  line-height: 1.25; letter-spacing: 0; text-transform: none; white-space: nowrap;
  padding: .28rem .45rem; border-radius: 4px;
  box-shadow: 0 2px 10px rgba(26,36,32,.28);
}

[data-dica]::before {
  content: ''; position: absolute; left: 50%; bottom: calc(100% + 1px);
  transform: translateX(-50%);
  border: 5px solid transparent; border-top-color: #26241F;
}

[data-dica]:hover::after, [data-dica]:hover::before,
[data-dica]:focus-visible::after, [data-dica]:focus-visible::before {
  opacity: 1; visibility: visible; transition-delay: .18s, .18s;
}

/* Perto da borda direita a tarja sairia da coluna: encosta pela direita. */
[data-dica].dica--esq::after { left: auto; right: 0; transform: none; }
[data-dica].dica--esq::before { left: auto; right: .5rem; transform: none; }

/* No alto da tela não cabe tarja para cima: desce. */
[data-dica].dica--baixo::after { bottom: auto; top: calc(100% + 6px); }
[data-dica].dica--baixo::before {
  bottom: auto; top: calc(100% + 1px);
  border-top-color: transparent; border-bottom-color: #26241F;
}

/* Texto longo precisa quebrar linha. */
[data-dica].dica--larga::after { white-space: normal; width: 15rem; text-align: left; }

/* ---------------------------------------------------------- botões */

.btn {
  border: 1px solid var(--acento); background: var(--acento); color: #fff;
  border-radius: var(--r); padding: .42rem .8rem; font-size: .82rem; font-weight: 600;
}
.btn:hover { background: var(--acento-claro); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn--fantasma { background: transparent; color: var(--acento); }
.btn--fantasma:hover { background: #E6F0EA; }
.btn--neutro { background: var(--papel-2); border-color: var(--linha); color: var(--tinta); }
.btn--neutro:hover { background: var(--linha); }
.btn--perigo { background: var(--perda); border-color: var(--perda); }
.btn--perigo:hover { background: #C94D4D; }
.btn--grande { padding: .6rem 1.4rem; font-size: .95rem; }
.acoes-turno { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .6rem; }
.dica { font-size: .72rem; color: var(--neutro); }

/* ---------------------------------------------------------- modais */

.veu {
  position: fixed; inset: 0; background: rgba(26,36,32,.55);
  display: grid; place-items: center; padding: 1.2rem; z-index: 40;
  animation: surge .16s ease-out;
}
@keyframes surge { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--fundo); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  max-width: min(58rem, 96vw); max-height: 92vh; overflow: auto; width: 100%;
}
.modal--estreito { max-width: 30rem; }
.placar--comp th.comp-rot { text-align: left; font-weight: 500; white-space: nowrap; padding-right: 1rem; }
.placar--comp .comp-secao th { text-align: left; font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--neutro); padding-top: .8rem; border-bottom: 1px solid rgba(0,0,0,.1); }
.placar--comp td.comp-melhor { background: rgba(201,162,39,.2); font-weight: 700; }
.placar--comp .comp-det { display: block; font-size: .62rem; color: var(--neutro); font-weight: 400; white-space: normal; }
.placar--comp thead .comp-det { text-align: right; text-transform: none; letter-spacing: 0; margin-top: 2px; }
.placar--comp tr.comp-total th, .placar--comp tr.comp-total td { font-size: 1.05rem; font-weight: 700; border-top: 2px solid rgba(0,0,0,.2); }
.modal--largo { max-width: min(78rem, 97vw); }
.agencia-grade { display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, 26rem); gap: 1rem; align-items: start; }
.minha-mesa { border-left: 1px solid rgba(0,0,0,.12); padding-left: 1rem; }
.minha-mesa h4 { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--neutro); margin: 0 0 .45rem; }
.minha-mesa .mercado { margin-bottom: .8rem; }
.minha-mesa .combina { outline: 3px solid #C9A227; outline-offset: 2px; border-radius: 6px; }
.minha-mesa .vazio { font-size: .78rem; color: var(--neutro); }
@media (max-width: 760px) { .agencia-grade { grid-template-columns: 1fr; } .minha-mesa { border-left: 0; padding-left: 0; border-top: 1px solid rgba(0,0,0,.12); padding-top: .8rem; } }
.modal > header {
  padding: .7rem 1rem; background: var(--tinta); color: var(--fundo);
  border-radius: 10px 10px 0 0; display: flex; align-items: center; gap: .6rem;
}
.modal > header h3 { font-size: 1.05rem; }
.modal > header .sub { font-size: .72rem; opacity: .75; margin-left: auto; }
.modal > .corpo { padding: 1rem; }
.modal > footer {
  padding: .7rem 1rem; border-top: 1px solid var(--linha); display: flex;
  gap: .5rem; justify-content: flex-end; align-items: center; background: var(--papel-2);
  border-radius: 0 0 10px 10px; position: sticky; bottom: 0;
}
.modal > footer .esquerda { margin-right: auto; font-size: .75rem; color: var(--neutro); }

.previa {
  background: var(--tinta); color: var(--fundo); border-radius: var(--r);
  padding: .5rem .7rem; font-size: .84rem; display: flex; gap: .8rem; flex-wrap: wrap;
  align-items: center;
}
.previa .delta { font-weight: 700; }
.previa .delta--mais { color: #8FD3B0; }
.previa .delta--menos { color: #F0A9A9; }

.aviso {
  background: #FBEDED; border: 1px solid #E5BDBD; border-left: 4px solid var(--perda);
  border-radius: var(--r); padding: .55rem .7rem; font-size: .8rem; margin: .6rem 0;
}
.aviso h4 { color: var(--perda); font-size: .85rem; margin-bottom: .2rem; }
.nota {
  background: #FDF6E7; border: 1px solid #E8D9AE; border-left: 4px solid var(--alerta);
  border-radius: var(--r); padding: .55rem .7rem; font-size: .8rem; margin: .6rem 0;
}

.opcoes { display: flex; flex-direction: column; gap: .5rem; }
.opcao {
  display: flex; gap: .6rem; align-items: flex-start; text-align: left;
  background: var(--papel); border: 1px solid var(--linha); border-radius: var(--r);
  padding: .6rem .7rem; width: 100%;
}
.opcao:hover:not(:disabled) { border-color: var(--acento); background: #F2F8F4; }
.opcao:disabled { opacity: .5; cursor: not-allowed; }
.opcao b { font-family: var(--serif); font-size: .92rem; }
.opcao span { display: block; font-size: .74rem; color: var(--neutro); }
.opcao .preco { margin-left: auto; font-family: var(--serif); font-size: 1rem; white-space: nowrap; }

/* ---------------------------------------------------------- telas */

.tela {
  position: fixed; inset: 0; background: var(--fundo); z-index: 50;
  display: grid; place-items: center; padding: 1.5rem; overflow: auto;
}
.tela-caixa { width: 100%; max-width: 46rem; }
.tela--passagem { background: var(--tinta); color: var(--fundo); text-align: center; }
.tela--passagem h1 { font-size: 2.4rem; margin-bottom: .3rem; }
.tela--passagem p { color: #9FB3A9; margin: 0 0 1.4rem; }

.setup-campo { margin-bottom: .9rem; }
.setup-campo > label { display: block; font-size: .7rem; text-transform: uppercase;
                       letter-spacing: .09em; color: var(--neutro); margin-bottom: .25rem; }
input[type="text"], input[type="number"], select {
  font: inherit; padding: .38rem .5rem; border: 1px solid var(--linha);
  border-radius: var(--r); background: #fff; color: var(--tinta); width: 100%;
}
.linha-jogador { display: flex; align-items: center; gap: .5rem; margin-bottom: .35rem; }
.linha-jogador .pino { width: 18px; height: 18px; }
.escolha { display: flex; gap: .5rem; flex-wrap: wrap; }
.escolha button {
  flex: 1 1 12rem; text-align: left; background: var(--papel); border: 1px solid var(--linha);
  border-radius: var(--r); padding: .6rem .7rem;
}
.escolha button[aria-pressed="true"] { border-color: var(--acento); background: #EAF3EE;
                                        box-shadow: 0 0 0 2px rgba(31,92,70,.18); }
.escolha b { display: block; font-family: var(--serif); font-size: .95rem; }
.escolha span { font-size: .74rem; color: var(--neutro); }

/* fechamento */
.fechamento-lista { display: flex; flex-direction: column; gap: .5rem; }
.fechamento-jogador {
  background: var(--papel); border: 1px solid var(--linha); border-left: 4px solid var(--linha);
  border-radius: var(--r); padding: .5rem .7rem;
}
.fechamento-jogador h4 { font-size: .92rem; margin-bottom: .25rem; }
.fechamento-jogador ul { margin: 0; padding-left: 1.1rem; font-size: .78rem; }
.fechamento-jogador li { margin-bottom: .12rem; animation: entra .25s ease-out both; }
.fechamento-jogador li.perda, .fechamento-jogador li.multa,
.fechamento-jogador li.divida, .fechamento-jogador li.demissao { color: var(--perda); }
.fechamento-jogador li.alerta { color: var(--alerta); }
@keyframes entra { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }

/* placar final */
.placar { width: 100%; border-collapse: collapse; font-size: .82rem; }
.placar th, .placar td { padding: .35rem .5rem; border-bottom: 1px solid var(--linha); text-align: left; }
.placar th { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--neutro); }
.placar td.n { text-align: right; font-variant-numeric: tabular-nums; }
.placar tr.desq { opacity: .6; }
.placar tr.desq td:first-child::after { content: " ✕"; color: var(--perda); }
.placar .total { font-family: var(--serif); font-size: 1rem; font-weight: 700; }
.detalhe-linha td { border-bottom: 0; padding-top: .1rem; padding-bottom: .1rem;
                    font-size: .74rem; color: var(--neutro); }
.radares { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; margin: 1rem 0; }
.radar-caixa { text-align: center; }
.radar-caixa b { font-family: var(--serif); font-size: .85rem; }

/* log */
.log { position: fixed; top: 0; right: 0; bottom: 0; width: 24rem; max-width: 92vw;
       background: var(--papel); border-left: 1px solid var(--linha); z-index: 45;
       display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.16); }
.log header { padding: .6rem .8rem; background: var(--tinta); color: var(--fundo);
              display: flex; align-items: center; gap: .5rem; }
.log header h3 { font-size: .95rem; }
.log header button { margin-left: auto; background: transparent; border: 0; color: var(--fundo);
                     font-size: 1.1rem; line-height: 1; }
.log ol { list-style: none; margin: 0; padding: .5rem .8rem 2rem; overflow-y: auto; font-size: .76rem; }
.log li { padding: .22rem 0; border-bottom: 1px solid #EDEBE3; line-height: 1.35; }
.log li.rodada { font-family: var(--serif); font-size: .9rem; text-align: center;
                 color: var(--acento); border-bottom: 1px solid var(--acento); margin-top: .5rem; }
.log li.vitoria { color: var(--acento); font-weight: 600; }
.log li.perda { color: var(--perda); }
.log li.conduta { color: var(--perda); font-weight: 600; }
.log li.fase, .log li.baralho { color: var(--neutro); font-style: italic; }

/* utilidades */
.linha-flex { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.entre { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.vazio { color: var(--neutro); font-size: .76rem; font-style: italic; padding: .3rem 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ml-auto { margin-left: auto; }

/* Torre da Sala de reunião: o contratado fica encaixado sob o disco do titular
   e a torre inteira ocupa um espaço só (§6.3). */
.espaco--torre { position: relative; overflow: visible; }
.disco--contratado {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -34%) scale(.86);
  opacity: .75; filter: saturate(.6);
  border-style: dashed;
}
.espaco--torre .disco:not(.disco--contratado) { position: relative; z-index: 1; }

/* Custo de energia já com o desconto de área: o valor real em destaque,
   o impresso riscado ao lado. */
.carta .com-desconto { color: var(--acento); font-weight: 700; }
.carta .com-desconto s { color: var(--neutro); font-weight: 400; opacity: .8; }

/* Jogadores controlados pela máquina */
.etiqueta--bot { background: var(--madeira); color: #F6F1E8; }
.etiqueta--pensando {
  background: var(--acento); color: #fff;
  animation: respira 1.1s ease-in-out infinite;
}
@keyframes respira { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* Alternador Humano/Bot na tela de setup */
.alternador { display: inline-flex; border: 1px solid var(--linha); border-radius: var(--r);
              overflow: hidden; flex: 0 0 auto; }
.alternador button {
  border: 0; background: var(--papel); color: var(--neutro);
  padding: .34rem .6rem; font-size: .76rem;
}
.alternador button + button { border-left: 1px solid var(--linha); }
.alternador button[aria-pressed="true"] { background: var(--acento); color: #fff; font-weight: 600; }
.alternador button:hover:not([aria-pressed="true"]) { background: var(--papel-2); }

/* Critério que este jogador já espiou (conhecimento 5+, variante oculta) */
.criterio--espiado { border-color: var(--ouro); background: #241F14; }
.criterio--espiado b { font-size: .7rem; }

/* ------------------------------------------------- logotipo com a gravata
   O "I" de SUIT é a gravata da capa. A altura da gravata é 1em de caixa alta
   (0.72em), alinhada pela base junto com as letras. */

/* Inline, não flex: com `vertical-align: baseline` a borda de baixo da gravata
   pousa exatamente na linha de base, e a altura dela vira a altura de caixa
   alta. Em flex o alinhamento briga com a baseline e a gravata encolhe. */
.logo-suit {
  font-family: var(--serif); font-weight: 700; letter-spacing: .18em;
  line-height: 1; white-space: nowrap;
}
.logo-suit__letras { letter-spacing: inherit; }
.logo-suit__i {
  display: inline-block; vertical-align: baseline;
  width: .295em; height: .70em;          /* 42:100 do viewBox, na altura de caixa alta */
  margin: 0 .17em 0 .06em;
}
.logo-suit .gravata { display: block; width: 100%; height: 100%; overflow: visible; }

/* SUIT 3D — por cima da folha 2D: a cena ocupa a tela, a interface flutua. */
:root { --bg3: #0F1613; --fg3: #F3F1EA; --mut3: #B9C9C1; --ouro3: #C8A15A; --verde3: #1F5C46;
  --painel3: rgba(15, 22, 19, .82); --linha3: rgba(200, 161, 90, .35); }
html, body { height: 100%; margin: 0; background: var(--bg3); overflow: hidden; }
body { color: var(--fg3); font-family: var(--sans); }
#cena { position: fixed; inset: 0; width: 100% !important; height: 100% !important; display: block; touch-action: none; z-index: 0; }
#hud { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
#hud > * { pointer-events: auto; }
#dica { pointer-events: none; position: fixed; z-index: 5; padding: .35rem .55rem; font-size: .74rem; background: #26241F; color: var(--fg3);
  border-radius: 4px; border-left: 3px solid var(--ouro3); transform: translate(12px, 12px); display: none; white-space: nowrap; }

/* ---------- cenário */
.cenario { position: absolute; inset: 0; overflow: auto; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); background: rgba(15, 22, 19, .55); }
.cenario-caixa { max-width: 44rem; margin: 0 auto; background: var(--painel3); border: 1px solid var(--linha3); border-radius: 10px; padding: 1.4rem 1.4rem 1rem;
  backdrop-filter: blur(6px); color: var(--fg3); }
.cenario .cabeca { text-align: center; margin-bottom: 1rem; }
.cenario .sub { color: var(--mut3); margin: .2rem 0 0; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
.cenario .bloco { margin: 1rem 0; }
.cenario h3 { font: 700 .72rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ouro3); margin: 0 0 .5rem; }
.ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; margin-bottom: .5rem; }
.ops--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ops--5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.ops--mini { margin: 0; display: inline-grid; }
.op { text-align: left; background: rgba(255,255,255,.04); color: var(--fg3); border: 1px solid var(--linha3); border-radius: 6px; padding: .6rem .7rem; cursor: pointer; font-family: var(--sans); min-width: 0; }
.op b { display: block; font-size: .86rem; }
.op span { display: block; font-size: .72rem; color: var(--mut3); margin-top: .2rem; line-height: 1.3; }
.op:hover, .op:focus-visible { border-color: var(--ouro3); outline: none; }
.op--on { background: var(--verde3); border-color: var(--verde3); }
.op--on span { color: #D6E6DD; }
.cenario .linha { display: flex; align-items: center; gap: .6rem; margin: .5rem 0; flex-wrap: wrap; }
.cenario .linha label { font-size: .78rem; color: var(--mut3); min-width: 5rem; }
.cenario input[type=text] { flex: 1; min-width: 8rem; background: rgba(255,255,255,.06); color: var(--fg3); border: 1px solid var(--linha3); border-radius: 4px; padding: .45rem .55rem; font: .86rem var(--sans); }
.cenario .check { font-size: .8rem; color: var(--mut3); }
.cenario .check input { width: auto; }
.jogadores { display: flex; flex-direction: column; gap: .4rem; margin: .5rem 0; }
.jog { display: flex; align-items: center; gap: .5rem; }
.jog .pino { width: 16px; height: 16px; border-radius: 50%; flex: none; border: 2px solid rgba(255,255,255,.4); }
.jog .alt { display: flex; }
.jog .alt button { font: 600 .7rem var(--sans); color: var(--fg3); background: rgba(255,255,255,.05); border: 1px solid var(--linha3); padding: .4rem .6rem; cursor: pointer; }
.jog .alt button:first-child { border-radius: 4px 0 0 4px; } .jog .alt button:last-child { border-radius: 0 4px 4px 0; }
.jog .alt button[aria-pressed="true"] { background: var(--verde3); border-color: var(--verde3); }
.cenario .nota { background: none; border: 0; padding: 0; font-size: .78rem; color: var(--mut3); margin: .2rem 0 0; line-height: 1.4; }
.cenario .acoes { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; margin-top: 1.2rem; }
.cenario .acoes button { font: 600 .84rem var(--sans); color: var(--fg3); background: rgba(255,255,255,.06); border: 1px solid var(--linha3); border-radius: 6px; padding: .7rem 1.1rem; cursor: pointer; }
.cenario .acoes button.primario { background: #E0474D; border-color: #E0474D; }
.cenario .acoes button:hover { border-color: var(--ouro3); }
.cenario .versao { text-align: center; color: var(--mut3); font-size: .7rem; margin: 1rem 0 0; }

/* ---------- HUD */
.hud-topo { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px; background: linear-gradient(var(--painel3), transparent); pointer-events: none; }
.hud-topo > * { pointer-events: auto; }
.hud-ano, .hud-fase, .hud-eti { font-size: .78rem; color: var(--mut3); }
.hud-ano b { color: var(--fg3); }
.hud-fase { text-transform: uppercase; letter-spacing: .1em; font-size: .68rem; color: var(--ouro3); }
.hud-eti { font-size: .68rem; border: 1px solid var(--linha3); border-radius: 3px; padding: .1rem .35rem; }
.hud-crit { display: flex; gap: 4px; flex-wrap: wrap; }
.crit { font-size: .66rem; padding: .18rem .45rem; border-radius: 3px; background: rgba(90,58,46,.85); color: #F1E3D0; border: 1px solid rgba(200,161,90,.5); }
.crit--oculto { background: rgba(30,30,30,.8); min-width: 1.6rem; text-align: center; }
.crit--vi { background: rgba(31,92,70,.9); }
.crit { position: relative; cursor: help; }
.crit-carta { display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 50;
  width: 16rem; padding: .9rem 1rem 1rem; border-radius: 10px; text-align: left; cursor: default;
  background: linear-gradient(160deg, #2B211A, #17120E); border: 2px solid #C8A15A; box-shadow: 0 14px 40px rgba(0,0,0,.55); }
.crit:hover .crit-carta, .crit:focus .crit-carta, .crit:focus-within .crit-carta, .crit.aberto .crit-carta { display: block; }
.crit-carta small { display: block; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: #C8A15A; margin-bottom: .4rem; }
.crit-carta b { display: block; font-family: var(--serif); font-size: 1.15rem; color: #F1E3D0; margin-bottom: .5rem; }
.crit-carta p { margin: 0; font-size: .86rem; line-height: 1.4; color: #E9DCC8; }
.crit-carta em { display: block; margin-top: .6rem; font-size: .68rem; font-style: normal; color: #B9A88E; }
.hud-botoes, .hud-camera { display: flex; gap: 6px; flex-wrap: wrap; }
.hud-botoes { margin-left: auto; }
.hud button, .hud-camera button, .aviso3d button, .seletor button { font: 600 .72rem/1 var(--sans); letter-spacing: .03em; color: var(--fg3); background: var(--painel3);
  border: 1px solid var(--linha3); border-radius: 4px; padding: .48rem .65rem; cursor: pointer; }
.hud button:hover, .hud button:focus-visible { border-color: var(--ouro3); outline: none; }
.hud button[aria-pressed="true"] { background: var(--verde3); border-color: var(--verde3); }
.hud-camera { position: absolute; right: 14px; top: calc(52px + env(safe-area-inset-top, 0px)); flex-direction: column; align-items: flex-end; gap: 4px; }
.hud-camera button { font-size: .66rem; padding: .38rem .55rem; }
.hud-baixo { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; background: linear-gradient(transparent, var(--painel3)); pointer-events: none; }
.hud-baixo > * { pointer-events: auto; }
.hud-vez { display: flex; align-items: center; gap: .5rem; font-size: .82rem; background: var(--painel3); border-left: 3px solid; padding: .45rem .7rem; border-radius: 0 4px 4px 0; max-width: 34rem; }
.hud-vez i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.hud-baixo .passar { background: var(--verde3); border-color: var(--verde3); }
.hud-log { font-size: .7rem; color: var(--mut3); max-width: 30rem; margin-left: auto; text-align: right; }
.hud-log div + div { margin-top: .15rem; }
@media (max-width: 700px) { .hud-log { display: none; } .hud-camera { top: auto; bottom: 70px; flex-direction: row; left: 14px; right: auto; } }

/* ---------- painéis 2D por cima da cena */
.flutuante, .veu, .log, .placar-3d { color: var(--tinta); }
.flutuante { position: absolute; max-height: calc(100% - 140px); overflow: auto; z-index: 2; box-shadow: 0 10px 30px rgba(0,0,0,.45); border-radius: 8px; }
.flutuante--pauta { left: 14px; top: calc(60px + env(safe-area-inset-top, 0px)); width: min(640px, calc(100% - 28px)); }
.flutuante--fechamento { left: 50%; top: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 28px)); }
.flutuante--rivais { left: 14px; top: calc(60px + env(safe-area-inset-top, 0px)); width: min(760px, calc(100% - 28px)); }
.flutuante .painel { margin: 0; }
.placar-3d { position: absolute; inset: 0; overflow: auto; background: rgba(15,22,19,.6); padding: 16px; }
.placar-3d > * { max-width: 60rem; margin: 0 auto; }
.aviso3d { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: #FBEDED; color: #7A2222; padding: .5rem .8rem; border-radius: 6px;
  display: flex; gap: .6rem; align-items: center; font-size: .82rem; max-width: 34rem; z-index: 4; }
.aviso3d button { color: #7A2222; background: transparent; border-color: #7A2222; }
.seletor { position: absolute; z-index: 4; background: var(--painel3); border: 1px solid var(--linha3); border-radius: 6px; padding: .6rem; width: 220px;
  display: flex; flex-direction: column; gap: .35rem; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.seletor p { margin: 0 0 .2rem; font-size: .74rem; color: var(--mut3); }
.seletor button { display: flex; align-items: center; gap: .5rem; text-align: left; }
.seletor button i { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 .6rem var(--sans); color: #fff; font-style: normal; }
.seletor button:disabled { opacity: .5; cursor: not-allowed; }
.seletor button small { color: var(--mut3); font-weight: 400; }
.seletor .fantasma { background: transparent; }
.veu { z-index: 6; }
.painel-log, .log { z-index: 3; }

/* ---------- a Pauta em cartas reais */
.pauta3d { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 70px 16px 80px; background: rgba(15,22,19,.35); overflow: auto; pointer-events: none; }
#hud > .pauta3d { pointer-events: none; }
.pauta3d-caixa { pointer-events: auto; }
.pauta3d-caixa { text-align: center; max-width: 1100px; width: 100%; }
.pauta3d h2 { font: 700 .8rem/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ouro3); margin: 0 0 .4rem; }
.pauta-sub { color: var(--fg3); font-size: 1rem; margin: 0 0 1rem; }
.pauta-aviso { color: #F1E3D0; background: rgba(90,58,46,.85); border-left: 3px solid var(--ouro3); display: inline-block; padding: .4rem .7rem; font-size: .8rem; border-radius: 0 4px 4px 0; margin: 0 0 1rem; }
.pauta-cartas { display: flex; gap: clamp(12px, 2.5vw, 36px); justify-content: center; flex-wrap: wrap; }
.pauta-carta { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .5rem;
  width: clamp(150px, 22vw, 300px); transition: transform .15s; }
.pauta-carta img { width: 100%; border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.6); border: 2px solid transparent; display: block; }
.pauta-carta:hover, .pauta-carta:focus-visible { transform: translateY(-8px) scale(1.03); outline: none; }
.pauta-carta:hover img, .pauta-carta:focus-visible img { border-color: var(--ouro3); }

/* =============== engine/rng.js =============== */
// engine/rng.js — RNG determinístico com semente.
// A semente vive dentro do estado: a mesma semente reproduz a partida inteira.

/** Converte qualquer string/número numa semente inteira de 32 bits. */
function semearDe(valor) {
  if (typeof valor === 'number' && Number.isFinite(valor)) return valor | 0;
  const s = String(valor ?? '');
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h | 0;
}

/**
 * mulberry32 em forma funcional: recebe o estado do gerador, devolve
 * { valor, estado }. Nada de closure — o progresso do RNG é serializável.
 */
function proximo(rngEstado) {
  let a = (rngEstado + 0x6d2b79f5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return { valor: ((t ^ (t >>> 14)) >>> 0) / 4294967296, estado: a };
}

/** Avança o RNG guardado em `state.rngEstado` e devolve um float em [0,1). */
function sorteia(state) {
  const { valor, estado } = proximo(state.rngEstado);
  state.rngEstado = estado;
  return valor;
}

/** Inteiro em [0, n). */
function sorteiaInt(state, n) {
  return Math.floor(sorteia(state) * n);
}

/** Fisher-Yates determinístico. Devolve um NOVO array; não mexe no original. */
function embaralhar(state, array) {
  const a = array.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = sorteiaInt(state, i + 1);
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function normalizaProcessos(brutos) {
  return brutos.map((linha, i) => {
    const [nome, area, porte, conhecimento, energia, exigencia, honorario, rep, prazo] = linha;
    return {
      id: 'P' + pad(i + 1, 3),
      nome, area, porte,
      conhecimento, energia,
      exigencia: exigencia || '',
      honorario,
      rep: { ...rep },
      prazo,
    };
  });
}

function normalizaClientes(brutos) {
  return brutos.map((linha, i) => ({
    id: 'C' + pad(i + 1, 2),
    nome: linha[0],
    area: linha[1],
  }));
}

function normalizaCriterios(brutos) {
  return brutos.map((linha, i) => ({
    id: CRITERIO_IDS[i],
    nome: linha[0],
    descricao: linha[1],
  }));
}

function normalizaSalas(brutos) {
  return brutos.map((linha, i) => ({
    id: SALA_IDS[i],
    nome: linha[0],
    espacosPorJogadores: linha[1],
    efeitos: linha[2].slice(),
    quemPode: linha[3],
  }));
}

/**
 * Constrói o catálogo a partir de um objeto bruto (por padrão, SUIT_RAW).
 * Receber o bruto por parâmetro permite aos testes injetar dados alterados.
 */
function construirCatalogo(bruto = SUIT_RAW) {
  const processos = normalizaProcessos(bruto.processos);
  const clientes = normalizaClientes(bruto.clientes);
  const criterios = normalizaCriterios(bruto.criterios);
  const salas = normalizaSalas(bruto.salas);

  const catalogo = {
    processos,
    clientes,
    criterios,
    salas,
    exigTexto: { ...bruto.exig_texto },
    economia: { ...bruto.economia },
    porId: {},
    salaPorId: {},
    criterioPorId: {},
    areas: [...new Set(processos.map((p) => p.area))],
  };
  for (const p of processos) catalogo.porId[p.id] = p;
  for (const c of clientes) catalogo.porId[c.id] = c;
  for (const s of salas) catalogo.salaPorId[s.id] = s;
  for (const c of criterios) catalogo.criterioPorId[c.id] = c;
  return catalogo;
}

const CATALOGO = construirCatalogo();

/** Config padrão: economia do JSON + limites derivados usados pelo motor. */
function configPadrao(economia = CATALOGO.economia) {
  return {
    ...economia,
    // limite_pecas inclui o titular; a equipe (estagiários + advogados) vai até um a menos
    limite_equipe: economia.limite_pecas - 1,
    energia_extra_segundo_processo: 2,
    biblioteca_primeiro_espaco: 2,
    biblioteca_demais_espacos: 1,
    cafezinho_energia: 3,
    cafezinho_clientes: 2,
    cliente_nivel_max: 3,
  };
}

function textoExigencia(codigo) {
  return CATALOGO.exigTexto[codigo || ''] ?? codigo;
}

function processo(id) { return CATALOGO.porId[id]; }
function cliente(id) { return CATALOGO.porId[id]; }

// engine/herdeiro.js — o automa do modo solo: o Dr. Vieira, "O Herdeiro".
//
// Ele não é um jogador: é um placar que anda pelo tabuleiro e ocupa espaços.
// NÃO tem dinheiro, energia, conhecimento, clientes, prazos, fichas de Conduta
// nem salários. Tem cinco trilhas de reputação, uma pasta de 2 processos e
// discos que são ADVOGADOS — por isso entram em qualquer sala onde um advogado
// entra, e nunca na Sala de reunião (ele não tem o que contratar).
//
// A regra que o define: todo Fechamento ele ganha +1 na frente em que estiver
// mais baixo. Não é que ele seja bom em tudo — é que ninguém deixa ele ser
// ruim em nada. Regras completas em SUIT_Modo_Solo_v6.pdf.


/** Cor do rival: o marrom da folha impressa dele. */
const COR_HERDEIRO = { id: 'marrom', nome: 'Marrom', hex: '#5A3A2E' };
const ID_HERDEIRO = 'HERDEIRO';
const NOME_HERDEIRO = 'Dr. Vieira';

/**
 * As 8 cartas de Agenda. Cada uma lista três salas em ordem de prioridade.
 * A Sala de reunião não aparece: os discos dele são advogados.
 */
const AGENDA_HERDEIRO = [
  ['forum', 'biblioteca', 'cafezinho'],
  ['forum', 'recepcao', 'biblioteca'],
  ['forum', 'cafezinho', 'recepcao'],
  ['biblioteca', 'forum', 'cafezinho'],
  ['cafezinho', 'forum', 'biblioteca'],
  ['recepcao', 'forum', 'cafezinho'],
  ['biblioteca', 'cafezinho', 'forum'],
  ['cafezinho', 'recepcao', 'biblioteca'],
];

/** Salas que um advogado pode ocupar, na ordem do tabuleiro (sem a reunião). */
const SALAS_DO_HERDEIRO = ['biblioteca', 'recepcao', 'forum', 'cafezinho'];

/**
 * Os quatro níveis. Cada um muda UMA coisa em relação ao anterior.
 * `media` é a pontuação medida em 1.200 partidas simuladas por nível.
 */
const NIVEIS_HERDEIRO = {
  1: {
    nome: 'Fácil',
    apelido: 'O escritório mal olha para ele',
    resumo: '3 advogados a partida inteira. O bônus só nos anos 2, 3 e 5.',
    base: 0, discos: [3, 3, 3, 3, 3, 3], bonusAnos: [2, 3, 5], bonusQtd: 1, media: 23,
  },
  2: {
    nome: 'Normal',
    apelido: 'O tio começou a reparar nele',
    resumo: 'Ganha o 4º advogado no ano 3 e o bônus passa a ser todo ano.',
    base: 0, discos: [3, 3, 4, 4, 4, 4], bonusAnos: [1, 2, 3, 4, 5, 6], bonusQtd: 1, media: 28,
  },
  3: {
    nome: 'Difícil',
    apelido: 'Entrou com o currículo já preenchido',
    resumo: 'Começa a partida com 1 em cada uma das cinco frentes.',
    base: 1, discos: [3, 3, 4, 4, 4, 4], bonusAnos: [1, 2, 3, 4, 5, 6], bonusQtd: 1, media: 36,
  },
  4: {
    nome: 'Injusto',
    apelido: 'O escritório apostou tudo nele',
    resumo: '4 advogados desde o ano 1 e, do ano 3 em diante, o bônus dobra.',
    base: 1, discos: [4, 4, 4, 4, 4, 4], bonusAnos: [1, 2, 3, 4, 5, 6], bonusQtd: 1,
    bonusDobraApartirDoAno: 3, media: 43,
  },
};

const PASTA_MAX_HERDEIRO = 2;
const CONCLUI_POR_ANO_HERDEIRO = 1;

/** Faixas de resultado pela pontuação do jogador (§ tabela de resultados). */
// Remedidas depois que o Expediente passou a render energia só no ano 1:
// o jogador fica entre 30 (quartil de baixo) e 37 (quartil de cima), mediana 33.
const FAIXAS_HERDEIRO = [
  { ate: 24, texto: 'Você não passou da porta. Renovaram o contrato por educação.' },
  { ate: 31, texto: 'Advogado competente. Ninguém lembra do seu nome na reunião de sócios.' },
  { ate: 38, texto: 'Sócio júnior. Ficou perto — e sabe exatamente qual frente custou a vaga.' },
  { ate: 46, texto: 'Sócio sênior. É esta a partida que você queria jogar.' },
  { ate: Infinity, texto: 'Seu nome na fachada. E o Dr. Vieira pediu transferência.' },
];

function faixaDoResultado(pontos) {
  return (FAIXAS_HERDEIRO.find((f) => pontos <= f.ate) || FAIXAS_HERDEIRO[FAIXAS_HERDEIRO.length - 1]).texto;
}

/* ------------------------------------------------------------------ *
 * Estado
 * ------------------------------------------------------------------ */

function novoHerdeiro(nivel = 2) {
  const n = NIVEIS_HERDEIRO[nivel] ? nivel : 2;
  const def = NIVEIS_HERDEIRO[n];
  return {
    nivel: n,
    rep: FRENTES.reduce((o, f) => ((o[f] = def.base), o), {}),
    pasta: [],                 // cartaId dos processos que ele guardou
    concluidos: [],            // cartaId dos que ele já concluiu
    agendaMonte: [],           // índices em AGENDA_HERDEIRO
    agendaDescarte: [],
    ultimaAgenda: null,        // para a interface mostrar o que ele leu
    discosRestantes: 0,
    discosNoForum: 0,
    vez: false,
    eventos: [],               // do último Fechamento dele
  };
}

/** Empate resolve pela ordem das frentes na folha: EST, CAP, ATU, LID, REL. */
function frenteMaisBaixaDoHerdeiro(rep) {
  let alvo = FRENTES[0];
  for (const f of FRENTES) if (rep[f] < rep[alvo]) alvo = f;
  return alvo;
}

function discosDoHerdeiroNoAno(herdeiro, ano) {
  const def = NIVEIS_HERDEIRO[herdeiro.nivel];
  return def.discos[Math.min(ano, def.discos.length) - 1];
}

/** O rival é o primeiro jogador nos anos ímpares (1, 3 e 5); você, nos pares (2, 4 e 6). */
function herdeiroComecaOAno(ano) {
  return ano % 2 === 1;
}

/* ------------------------------------------------------------------ *
 * Draft — a decisão que faz o modo solo funcionar
 * ------------------------------------------------------------------ */

/**
 * Ele fica com a carta que mais paga na frente mais baixa dele. Empate: a de
 * mais pontos no total; depois, a mais à esquerda. É determinístico de
 * propósito — o jogador PRECISA conseguir prever, senão não dá para envenenar
 * o draft, que é a única alavanca real que ele tem contra o rival.
 */
function herdeiroEscolheCarta(herdeiro, cartaIds) {
  if (!cartaIds.length) return null;
  const alvo = frenteMaisBaixaDoHerdeiro(herdeiro.rep);
  let melhor = null;
  let melhorChave = null;
  cartaIds.forEach((id, i) => {
    const c = processo(id);
    if (!c) return;
    const naFrente = c.rep[alvo] || 0;
    const total = Object.values(c.rep).reduce((a, b) => a + b, 0);
    const chave = [naFrente, total, -i];
    if (!melhorChave || chave[0] > melhorChave[0]
      || (chave[0] === melhorChave[0] && chave[1] > melhorChave[1])
      || (chave[0] === melhorChave[0] && chave[1] === melhorChave[1] && chave[2] > melhorChave[2])) {
      melhor = id; melhorChave = chave;
    }
  });
  return melhor;
}

/** O que a interface mostra antes do jogador escolher: o que ele vai levar. */
function previsaoDoHerdeiro(herdeiro, cartaIds) {
  const alvo = frenteMaisBaixaDoHerdeiro(herdeiro.rep);
  return { frenteAlvo: alvo, escolheria: herdeiroEscolheCarta(herdeiro, cartaIds) };
}

/* ------------------------------------------------------------------ *
 * Escritório — a Agenda é cega e ele obedece
 * ------------------------------------------------------------------ */

function proximaAgendaDoHerdeiro(s) {
  const hd = s.herdeiro;
  if (!hd.agendaMonte.length) {
    const todas = hd.agendaDescarte.length
      ? hd.agendaDescarte.slice()
      : AGENDA_HERDEIRO.map((_, i) => i);
    // embaralhamento simples com o RNG do estado, para a semente reproduzir tudo
    const baralho = todas.slice();
    for (let i = baralho.length - 1; i > 0; i--) {
      s.rngEstado = (s.rngEstado + 0x6D2B79F5) >>> 0;
      let t = s.rngEstado;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      const r = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      const k = Math.floor(r * (i + 1));
      [baralho[i], baralho[k]] = [baralho[k], baralho[i]];
    }
    hd.agendaMonte = baralho;
    hd.agendaDescarte = [];
  }
  const idx = hd.agendaMonte.shift();
  hd.agendaDescarte.push(idx);
  hd.ultimaAgenda = idx;
  return AGENDA_HERDEIRO[idx];
}

/**
 * Primeira sala livre da lista. Se as três estiverem lotadas: Fórum; se o
 * Fórum também estiver cheio, a primeira sala livre da esquerda para a
 * direita — nunca a Sala de reunião.
 */
function salaAlvoDoHerdeiro(s, prioridades) {
  const livre = (id) => s.salas[id] && s.salas[id].ocupantes.length < s.salas[id].espacos;
  for (const id of prioridades) if (livre(id)) return id;
  if (livre('forum')) return 'forum';
  for (const id of SALAS_DO_HERDEIRO) if (livre(id)) return id;
  return null;
}

/** Move um disco dele para o tabuleiro. Devolve { salaId, prioridades } ou null. */
function colocarDiscoDoHerdeiro(s) {
  const hd = s.herdeiro;
  if (hd.discosRestantes <= 0) return null;
  const prioridades = proximaAgendaDoHerdeiro(s);
  const salaId = salaAlvoDoHerdeiro(s, prioridades);
  hd.discosRestantes -= 1;
  if (!salaId) return { salaId: null, prioridades };
  const n = (s.salas[salaId].ocupantes.length + 1);
  s.salas[salaId].ocupantes.push({ jogadorId: ID_HERDEIRO, pecaId: `${ID_HERDEIRO}-${salaId}-${n}` });
  if (salaId === 'forum') hd.discosNoForum += 1;
  return { salaId, prioridades };
}

/* ------------------------------------------------------------------ *
 * Fechamento dele
 * ------------------------------------------------------------------ */

/**
 * Roda DEPOIS do Fechamento do jogador, nos CINCO anos — inclusive no ano 5,
 * em que não existe Fechamento. O que some no ano 5 é o Fechamento econômico
 * (faturar, pagar salário, esfriar cliente, correr prazo); concluir processo e
 * receber o bônus são atos de pontuação, e sem eles o ano 5 não valeria nada
 * para ele.
 */
function fechamentoDoHerdeiro(s, ano) {
  const hd = s.herdeiro;
  const def = NIVEIS_HERDEIRO[hd.nivel];
  const eventos = [];

  // 1. Conclui, se teve disco no Fórum.
  if (hd.discosNoForum > 0 && hd.pasta.length) {
    for (let i = 0; i < CONCLUI_POR_ANO_HERDEIRO && hd.pasta.length; i++) {
      const id = herdeiroEscolheCarta(hd, hd.pasta);
      hd.pasta.splice(hd.pasta.indexOf(id), 1);
      hd.concluidos.push(id);
      const c = processo(id);
      const ganhos = [];
      for (const [f, pts] of Object.entries(c.rep)) { hd.rep[f] += pts; ganhos.push(`+${pts} ${f}`); }
      eventos.push({ tipo: 'vitoria', texto: `Concluiu "${c.nome}": ${ganhos.join(', ')}.` });
    }
  } else if (hd.discosNoForum === 0) {
    eventos.push({ tipo: 'alerta', texto: 'Não pôs disco no Fórum: não concluiu nada neste ano.' });
  } else {
    eventos.push({ tipo: 'nada', texto: 'Pasta vazia: nada a concluir.' });
  }

  // 2. O bônus do herdeiro — nunca falha.
  const dobra = def.bonusDobraApartirDoAno && ano >= def.bonusDobraApartirDoAno;
  const vezes = def.bonusAnos.includes(ano) ? (dobra ? 2 : 1) * def.bonusQtd : 0;
  for (let i = 0; i < vezes; i++) {
    const f = frenteMaisBaixaDoHerdeiro(hd.rep);
    hd.rep[f] += 1;
    eventos.push({ tipo: 'bonus', texto: `O andar de cima cobriu a lacuna: +1 ${f}.` });
  }

  // 3. A pasta guarda no máximo 2 — o excedente vai para o lixo.
  while (hd.pasta.length > PASTA_MAX_HERDEIRO) {
    let pior = hd.pasta[0];
    let piorSoma = Infinity;
    for (const id of hd.pasta) {
      const soma = Object.values(processo(id).rep).reduce((a, b) => a + b, 0);
      if (soma < piorSoma) { piorSoma = soma; pior = id; }
    }
    hd.pasta.splice(hd.pasta.indexOf(pior), 1);
    s.baralhos.descarte.push(pior);
    eventos.push({ tipo: 'prazo', texto: `Pasta cheia: largou "${processo(pior).nome}".` });
  }

  hd.discosNoForum = 0;
  hd.eventos = eventos;
  return eventos;
}

/* ------------------------------------------------------------------ *
 * Pontuação
 * ------------------------------------------------------------------ */

/** Um objeto no formato de jogador, para a interface desenhar o rival. */
function herdeiroComoJogador(s) {
  const hd = s.herdeiro;
  return {
    id: ID_HERDEIRO,
    nome: NOME_HERDEIRO,
    bot: true,
    cor: COR_HERDEIRO,
    dinheiro: 0, divida: 0, conhecimento: 0, energia: 0,
    rep: { ...hd.rep },
    pecas: [], clientes: [], carteira: [],
    vencidos: hd.concluidos.slice(),
    conduta: 0, passou: false,
  };
}

/** Só reputação: soma das cinco + 3 × a menor. Sem dinheiro, sem conduta. */
function pontuarHerdeiro(s) {
  const hd = s.herdeiro;
  const valores = FRENTES.map((f) => hd.rep[f]);
  const menor = Math.min(...valores);
  const soma = valores.reduce((a, b) => a + b, 0);
  const linhas = [
    {
      chave: 'frentes', rotulo: 'Soma das cinco frentes',
      detalhe: FRENTES.map((f) => `${f} ${hd.rep[f]}`).join(' · '), pontos: soma,
    },
    {
      chave: 'menor', rotulo: '3 × a frente mais fraca',
      detalhe: `frente mais fraca em ${menor}`, pontos: 3 * menor,
    },
    {
      chave: 'nada', rotulo: 'Dinheiro, Critérios, Conduta e dívida',
      detalhe: 'ele não tem nenhum dos quatro', pontos: 0,
    },
  ];
  return {
    jogadorId: ID_HERDEIRO,
    nome: NOME_HERDEIRO,
    cor: COR_HERDEIRO,
    rep: { ...hd.rep },
    menor,
    variante: s.variante,
    linhas,
    total: soma + 3 * menor,
    desqualificado: false,
    conduta: 0,
    relacionamento: hd.rep.REL,
    ehHerdeiro: true,
  };
}

/**
 * Encaixa o rival na classificação. Empate: vence quem tiver a maior frente
 * mais baixa; persistindo, vence o Dr. Vieira — sempre vence, é assim que
 * funciona nesse escritório.
 */
function classificarComHerdeiro(placar, fichaRival) {
  const todas = placar.classificacao.concat([fichaRival]);
  todas.sort((a, b) => {
    if (a.desqualificado !== b.desqualificado) return a.desqualificado ? 1 : -1;
    if (b.total !== a.total) return b.total - a.total;
    if (b.menor !== a.menor) return b.menor - a.menor;
    if (a.ehHerdeiro) return -1;
    if (b.ehHerdeiro) return 1;
    return 0;
  });
  todas.forEach((f, i) => { f.posicao = i + 1; });
  placar.classificacao = todas;
  placar.porJogador[ID_HERDEIRO] = fichaRival;
  return placar;
}

/* =============== engine/state.js =============== */
// engine/state.js — estado inicial, tipos e acessores puros.
// Este módulo não conhece o DOM.


const FASES = ['pauta', 'escritorio', 'fechamento', 'fim'];

/* ------------------------------------------------------------------ *
 * Acessores. `pecas[0]` é sempre o titular; "equipe" exclui o titular
 * (é a leitura de CASA_CHEIA e ESCOLA no briefing §7.2).
 * ------------------------------------------------------------------ */

const titularDe = (j) => j.pecas[0];
const equipeDe = (j) => j.pecas.filter((p) => p.tipo !== 'titular');
const advogadosDe = (j) => j.pecas.filter((p) => p.tipo === 'advogado');
const estagiariosDe = (j) => j.pecas.filter((p) => p.tipo === 'estagiario');
const pecaPorId = (j, id) => j.pecas.find((p) => p.id === id) || null;

/** Peças que ainda podem ser alocadas nesta rodada. */
const pecasLivres = (j) => j.pecas.filter((p) => p.disponivel && p.alocado === null);

const jogadorAtual = (s) =>
  s.jogadores[s.ordem[s.turnoIdx]] ?? null;

const jogadorPorId = (s, id) => s.jogadores.find((j) => j.id === id) || null;

/** Ordem de assento à esquerda (o draft passa nesse sentido). */
const vizinhoEsquerda = (s, indice) => (indice + 1) % s.jogadores.length;

function novoJogador(id, nome, corIdx, config, bot = false) {
  return {
    id,
    nome,
    bot,
    cor: CORES_JOGADOR[corIdx % CORES_JOGADOR.length],
    dinheiro: config.caixa_inicial,
    divida: 0,
    conhecimento: config.conhecimento_inicial,
    energia: 0,
    rep: FRENTES.reduce((o, f) => ((o[f] = 0), o), {}),
    pecas: [
      { id: `${id}-T`, tipo: 'titular', alocado: null, disponivel: true },
      { id: `${id}-E1`, tipo: 'estagiario', alocado: null, disponivel: true },
      { id: `${id}-E2`, tipo: 'estagiario', alocado: null, disponivel: true },
    ],
    proximaPeca: 3,        // contador para ids de peças contratadas
    clientes: [],          // { cartaId, nivel }
    carteira: [],          // { cartaId, cubos }
    vencidos: [],          // cartaId
    conduta: 0,
    multasPendentes: 0,    // v9: multas de $1 do Fechamento, cobradas por último
    espiados: [],          // índices dos Critérios que ele já olhou (Critério Oculto)
    passou: false,
  };
}

function salasIniciais(numJogadores) {
  const salas = {};
  for (const id of SALA_IDS) {
    const def = CATALOGO.salaPorId[id];
    salas[id] = {
      id,
      nome: def.nome,
      espacos: def.espacosPorJogadores[String(numJogadores)],
      ocupantes: [],       // { jogadorId, pecaId } na ordem de chegada
    };
  }
  return salas;
}

/**
 * Cria o estado inicial completo. Não avança nenhuma fase — quem faz isso é
 * o reducer, via INICIAR_RODADA.
 */
function novoEstado({
  jogadores = ['Jogador 1', 'Jogador 2'],
  variante = 'padrao',
  seed = Date.now(),
  telaDePassagem = true,
  solo = null,               // { nivel: 1..4 } liga o modo solo do Dr. Vieira
  criteriosOcultos = false,  // os três Critérios só viram no fim da partida
  config: configExtra = {},
} = {}) {
  const config = { ...configPadrao(), ...configExtra };
  const n = jogadores.length;

  const s = {
    versao: 1,
    seed,
    rngEstado: semearDe(seed),
    config,
    variante,
    criteriosOcultos,
    telaDePassagem,
    numJogadores: n,
    solo: solo ? { nivel: solo.nivel } : null,
    herdeiro: solo ? novoHerdeiro(solo.nivel) : null,
    rodada: 0,                 // INICIAR_RODADA leva para 1
    fase: 'setup',
    // Cada entrada pode ser um nome ou { nome, bot } — o motor não muda de
    // comportamento por causa disso; quem age pelo bot é a camada de interface.
    jogadores: jogadores.map((entrada, i) => {
      const nome = typeof entrada === 'string' ? entrada : entrada.nome;
      const bot = typeof entrada === 'string' ? false : !!entrada.bot;
      return novoJogador(`J${i + 1}`, nome, i, config, bot);
    }),
    primeiroJogador: 0,
    ordem: [],
    turnoIdx: 0,
    baralhos: { pequenos: [], medios: [], grandes: [], principal: [], descarte: [] },
    mercadoClientes: [],
    baralhoClientes: [],
    criterios: [],
    salas: salasIniciais(solo ? 3 : n),
    draft: null,
    acaoExtra: false,          // v9: a última jogada do titular depois do ano 6
    pendente: null,            // decisão aguardando entrada do jogador
    fechamento: null,
    log: [],
    placar: null,
  };

  // Processos: três montes por porte, embaralhados em separado (§5.2).
  const porPorte = { P: [], M: [], G: [] };
  for (const p of CATALOGO.processos) porPorte[p.porte].push(p.id);
  s.baralhos.pequenos = embaralhar(s, porPorte.P);
  s.baralhos.medios = embaralhar(s, porPorte.M);
  s.baralhos.grandes = embaralhar(s, porPorte.G);

  // Clientes: baralho embaralhado, 3 revelados (§5.3).
  const clientes = embaralhar(s, CATALOGO.clientes.map((c) => c.id));
  s.mercadoClientes = clientes.slice(0, 3);
  s.baralhoClientes = clientes.slice(3);

  // Critérios do Sócio: 3 revelados, valem a partida inteira (§5.4).
  s.criterios = embaralhar(s, CATALOGO.criterios.map((c) => c.id)).slice(0, 3);

  // Primeiro jogador aleatório (§5.5 — "o mais novo"; no digital, sorteado).
  s.primeiroJogador = n > 1 ? Math.floor((s.rngEstado >>> 0) % n) : 0;
  s.ordem = ordemAPartirDe(s.primeiroJogador, n);

  return s;
}

function ordemAPartirDe(primeiro, n) {
  return Array.from({ length: n }, (_, k) => (primeiro + k) % n);
}

/** Cópia profunda barata e serializável — o motor é imutável por clonagem. */
function clonar(s) {
  return typeof structuredClone === 'function'
    ? structuredClone(s)
    : JSON.parse(JSON.stringify(s));
}

/* =============== engine/rules.js =============== */
// engine/rules.js — o que é legal agora. O motor recusa; a interface nem oferece.


/* ------------------------------------------------------------------ *
 * Acesso às salas (§6.3)
 * ------------------------------------------------------------------ */

const SALAS_POR_PECA = {
  titular:    ['biblioteca', 'recepcao', 'forum', 'reuniao', 'cafezinho'],
  advogado:   ['biblioteca', 'recepcao', 'forum', 'cafezinho'],
  estagiario: ['biblioteca', 'recepcao', 'cafezinho'],
};

const MOTIVO_ACESSO = {
  estagiario: {
    forum: 'Estagiário não faz audiência.',
    reuniao: 'Só o titular entra na Sala de reunião.',
  },
  advogado: {
    reuniao: 'Só o titular entra na Sala de reunião.',
  },
};

function pecaPodeEntrar(peca, salaId) {
  return SALAS_POR_PECA[peca.tipo].includes(salaId);
}

/* ------------------------------------------------------------------ *
 * Exigências extras das cartas de processo (§6.5 passo 1).
 * "colaboradores" = peças que não são o titular (mesma leitura de CASA_CHEIA).
 *
 * v6: `3PC` entrou e `2PC+CL2` saiu. Motivo: todo jogador começa com dois
 * estagiários, então `2PC` nascia satisfeita e não exigia nada de ninguém.
 * Os processos Grandes passaram a pedir 3 colaboradores.
 * ------------------------------------------------------------------ */

const TESTES_EXIGENCIA = {
  ADV: (j) => advogadosDe(j).length >= 1,
  '2PC': (j) => equipeDe(j).length >= 2,
  '3PC': (j) => equipeDe(j).length >= 3,
  CL2: (j) => j.clientes.some((c) => c.nivel >= 2),
  CL3: (j) => j.clientes.some((c) => c.nivel >= 3),
};

function exigenciaCumprida(jogador, codigo) {
  if (!codigo) return true;
  return codigo.split('+').every((parte) => {
    const teste = TESTES_EXIGENCIA[parte];
    if (!teste) throw new Error('Exigência desconhecida: ' + parte);
    return teste(jogador);
  });
}

/* ------------------------------------------------------------------ *
 * Resolver processo (§6.5 e §6.6)
 * ------------------------------------------------------------------ */

/**
 * Desconto de área (§6.5 passo 3): −1 de energia se o jogador tem ao menos um
 * cliente da mesma área do processo. É 1 no total, não 1 por cliente, e vale
 * em qualquer nível de satisfação — inclusive no nível 1.
 */
function clientesDaArea(jogador, carta) {
  if (!carta) return [];
  return jogador.clientes.filter((c) => cliente(c.cartaId).area === carta.area);
}

function descontoDeArea(state, jogador, carta) {
  return clientesDaArea(jogador, carta).length > 0 ? state.config.desconto_area_energia : 0;
}

/** Custo de energia da carta já com o desconto de área e o piso de 1. */
function custoEnergiaDe(state, jogador, carta) {
  return Math.max(1, carta.energia - descontoDeArea(state, jogador, carta));
}

/**
 * Avalia a resolução de um processo. `energiaJaComprometida` cobre o caso do
 * segundo processo na mesma ida (custo do primeiro + os 2 de sobretaxa).
 */
function avaliarProcesso(state, jogador, cartaId, opcoes = {}) {
  const { atalhoEtico = false, energiaJaComprometida = 0 } = opcoes;
  const cfg = state.config;
  const naCarteira = jogador.carteira.find((c) => c.cartaId === cartaId);
  const carta = processo(cartaId);

  const r = {
    cartaId,
    carta,
    ok: false,
    motivos: [],
    exigenciaOk: false,
    faltaConhecimento: 0,
    faltaEnergia: 0,          // v9: a ficha também cobre até `conduta_energia_max`
    precisaAtalho: false,
    atalhoDisponivel: false,
    custoBase: carta ? carta.energia : 0,
    desconto: carta ? descontoDeArea(state, jogador, carta) : 0,
    custoEnergia: carta ? custoEnergiaDe(state, jogador, carta) : 0,
    energiaDisponivel: jogador.energia - energiaJaComprometida,
  };

  if (!carta) { r.motivos.push('Carta inexistente.'); return r; }
  if (!naCarteira) { r.motivos.push('Este processo não está na sua carteira.'); return r; }

  // 1. Exigência extra — não pode ser burlada.
  r.exigenciaOk = exigenciaCumprida(jogador, carta.exigencia);
  if (!r.exigenciaOk) {
    r.motivos.push('Exigência não cumprida: ' + CATALOGO.exigTexto[carta.exigencia] + '.');
  }

  // 2. Conhecimento — o atalho ético cobre no máximo `conduta_falta_max`.
  r.faltaConhecimento = Math.max(0, carta.conhecimento - jogador.conhecimento);
  if (r.faltaConhecimento > 0) {
    r.precisaAtalho = true;
    r.atalhoDisponivel = r.faltaConhecimento <= cfg.conduta_falta_max;
    if (!r.atalhoDisponivel) {
      r.motivos.push(
        'Faltam ' + r.faltaConhecimento + ' níveis de conhecimento — o atalho ético só cobre '
        + cfg.conduta_falta_max + '.');
    } else if (!atalhoEtico) {
      r.motivos.push('Falta 1 nível de conhecimento: só com ficha de Conduta.');
    }
  }

  // 3. Energia. v9: faltando até `conduta_energia_max`, a mesma ficha de
  // Conduta cobre — só no primeiro processo da ida (o segundo, o de +2, é
  // pago inteiro). A energia que falta não é paga: o jogador fica em 0.
  r.faltaEnergia = Math.max(0, r.custoEnergia - r.energiaDisponivel);
  if (r.faltaEnergia > 0) {
    const cobre = (cfg.conduta_energia_max || 0);
    const segundo = energiaJaComprometida > 0;
    if (!segundo && r.faltaEnergia <= cobre) {
      r.precisaAtalho = true;
      r.atalhoDisponivel = r.faltaConhecimento <= cfg.conduta_falta_max;
      if (!atalhoEtico) {
        r.motivos.push('Falta' + (r.faltaEnergia > 1 ? 'm ' : ' ') + r.faltaEnergia
          + ' de energia: só com ficha de Conduta.');
      }
    } else {
      r.motivos.push('Energia insuficiente: precisa de ' + r.custoEnergia
        + ', tem ' + r.energiaDisponivel + (segundo ? ' — e o 2º processo da ida não aceita atalho.'
          : ' — o atalho ético cobre no máximo ' + cobre + '.'));
    }
  }

  r.ok = r.motivos.length === 0;
  return r;
}

/** Processos da carteira que dão para resolver agora (com ou sem atalho). */
function processosResolviveis(state, jogador, energiaJaComprometida = 0) {
  return jogador.carteira.map(({ cartaId }) => {
    const limpo = avaliarProcesso(state, jogador, cartaId, { energiaJaComprometida });
    const comAtalho = avaliarProcesso(state, jogador, cartaId, {
      atalhoEtico: true, energiaJaComprometida,
    });
    return {
      cartaId,
      carta: processo(cartaId),
      semAtalho: limpo,
      comAtalho,
      jogavel: limpo.ok || comAtalho.ok,
      exigeAtalho: !limpo.ok && comAtalho.ok,
    };
  });
}

/* ------------------------------------------------------------------ *
 * Salas: o que cada uma pode render para este jogador agora
 * ------------------------------------------------------------------ */

/** §6.4 — captar custa $2, além de exigir mercado e vaga na carteira de clientes. */
function podeCaptarCliente(state, jogador) {
  return state.mercadoClientes.length > 0
      && jogador.clientes.length < state.config.limite_clientes
      && jogador.dinheiro >= state.config.custo_captar_cliente;
}

/**
 * §6.4 — cavar custa $5 e pede 5 cartas no baralho. Não olha o mercado: quem
 * cava está justamente dizendo que não quer nenhuma das abertas, e a cavada
 * continua valendo com o mercado vazio.
 */
function podeCavarCliente(state, jogador) {
  return jogador.clientes.length < state.config.limite_clientes
      && jogador.dinheiro >= state.config.custo_cavar_cliente
      && state.baralhoClientes.length >= state.config.cartas_da_cavada;
}

/** A Agência de marketing rende se qualquer um dos dois caminhos estiver aberto. */
function recepcaoUtil(state, jogador) {
  return podeCaptarCliente(state, jogador) || podeCavarCliente(state, jogador);
}

function podeContratar(state, jogador) {
  return jogador.dinheiro >= state.config.custo_contratar_estagiario
      && equipeDe(jogador).length < state.config.limite_equipe;
}

/** Promover exige um estagiário ainda livre nesta rodada (§6.3). */
function estagiariosPromoviveis(state, jogador) {
  return estagiariosDe(jogador).filter((p) => p.alocado === null && p.disponivel);
}

function podePromover(state, jogador) {
  return jogador.dinheiro >= state.config.custo_promover_advogado
      && estagiariosPromoviveis(state, jogador).length > 0;
}

/**
 * A sala rende alguma coisa para este jogador?
 * Recepção e Sala de reunião ficam indisponíveis quando não rendem (§8 e §13).
 * Biblioteca, Fórum e Cafezinho aceitam peça sem retorno — é o descarte de peça
 * previsto em §6.3 ("coloque em qualquer espaço livre ou passe").
 */
function salaUtil(state, jogador, salaId) {
  switch (salaId) {
    case 'recepcao': return recepcaoUtil(state, jogador);
    case 'reuniao':  return podeContratar(state, jogador) || podePromover(state, jogador);
    default:         return true;
  }
}

const MOTIVO_SALA_INUTIL = {
  recepcao: (state, j) => {
    if (j.clientes.length >= state.config.limite_clientes) {
      return 'Você já tem ' + state.config.limite_clientes + ' clientes.';
    }
    if (state.mercadoClientes.length === 0
        && state.baralhoClientes.length < state.config.cartas_da_cavada) {
      return 'O mercado acabou e o baralho não tem '
        + state.config.cartas_da_cavada + ' cartas para cavar.';
    }
    return 'Captar custa $' + state.config.custo_captar_cliente
      + ', cavar custa $' + state.config.custo_cavar_cliente
      + ' — e você tem $' + j.dinheiro + '.';
  },
  reuniao: () => 'Sem caixa (ou sem vaga/estagiário livre) para contratar ou promover.',
};

/* ------------------------------------------------------------------ *
 * Alocação
 * ------------------------------------------------------------------ */

function podeAlocar(state, jogador, pecaId, salaId) {
  const peca = pecaPorId(jogador, pecaId);
  const sala = state.salas[salaId];
  if (state.fase !== 'escritorio') return { ok: false, motivo: 'Não é a fase de Escritório.' };
  if (!peca) return { ok: false, motivo: 'Peça inexistente.' };
  if (!sala) return { ok: false, motivo: 'Sala inexistente.' };
  if (!peca.disponivel) {
    return { ok: false, motivo: 'Colaborador recém-contratado: fica na Sala de reunião e só age no ano que vem.' };
  }
  if (peca.alocado !== null) return { ok: false, motivo: 'Esta peça já foi alocada neste ano.' };
  if (state.acaoExtra && peca.tipo !== 'titular') {
    return { ok: false, motivo: 'Na ação extra só o titular joga.' };
  }
  if (!pecaPodeEntrar(peca, salaId)) {
    const m = (MOTIVO_ACESSO[peca.tipo] || {})[salaId] || 'Esta peça não entra nesta sala.';
    return { ok: false, motivo: m };
  }
  if (sala.ocupantes.length >= sala.espacos) {
    return { ok: false, motivo: 'Sala lotada — nenhum espaço livre.' };
  }
  if (!salaUtil(state, jogador, salaId)) {
    return { ok: false, motivo: MOTIVO_SALA_INUTIL[salaId](state, jogador) };
  }
  return { ok: true, motivo: '' };
}

/**
 * Panorama do que o jogador da vez pode fazer. A interface usa isto para
 * acender os espaços legais e apagar os ilegais com o motivo no tooltip.
 */
function acoesLegais(state) {
  const idx = state.ordem[state.turnoIdx];
  const j = state.jogadores[idx];
  if (!j || state.fase !== 'escritorio') {
    return { fase: state.fase, alocacoes: [], temAlocacaoLegal: false, podePassar: false };
  }
  const livres = pecasLivres(j);
  const alocacoes = [];
  for (const peca of livres) {
    for (const salaId of Object.keys(state.salas)) {
      const v = podeAlocar(state, j, peca.id, salaId);
      alocacoes.push({ pecaId: peca.id, tipo: peca.tipo, salaId, ok: v.ok, motivo: v.motivo });
    }
  }
  return {
    fase: state.fase,
    jogadorId: j.id,
    pecasLivres: livres.map((p) => p.id),
    alocacoes,
    temAlocacaoLegal: alocacoes.some((a) => a.ok),
    podePassar: true,
  };
}

/* ------------------------------------------------------------------ *
 * Economia auxiliar (Expediente e Fechamento)
 * ------------------------------------------------------------------ */

function rendaDeClientes(state, jogador) {
  const c = state.config;
  const tabela = { 3: c.renda_cliente_nv3, 2: c.renda_cliente_nv2, 1: c.renda_cliente_nv1 };
  return jogador.clientes.reduce((t, cl) => t + (tabela[cl.nivel] || 0), 0);
}

function folhaSalarial(state, jogador) {
  return jogador.pecas.reduce((t, p) => t + salarioDaPeca(state, p), 0);
}

function salarioDaPeca(state, peca) {
  const c = state.config;
  if (peca.tipo === 'estagiario') return c.salario_estagiario;
  if (peca.tipo === 'advogado') return c.salario_advogado;
  return 0; // o titular não tem salário: ele fica com o caixa
}

/* =============== engine/scoring.js =============== */
// engine/scoring.js — placar final auditável, linha a linha (§7).


/* ------------------------------------------------------------------ *
 * Os 12 Critérios do Sócio (§7.2). Cada um devolve { pontos, detalhe }.
 * ------------------------------------------------------------------ */

function cartasVencidas(j) {
  return j.vencidos.map((id) => processo(id)).filter(Boolean);
}

function contarPorArea(j) {
  const mapa = new Map();
  for (const c of cartasVencidas(j)) mapa.set(c.area, (mapa.get(c.area) || 0) + 1);
  return mapa;
}

const CRITERIOS = {
  FATURAMENTO: (j) => {
    const p = Math.floor(j.dinheiro / 4);
    return { pontos: p, detalhe: `$${j.dinheiro} em caixa ÷ 4 = ${p}` };
  },
  CARTEIRA_FIEL: (j) => {
    const n = j.clientes.filter((c) => c.nivel === 3).length;
    return { pontos: 3 * n, detalhe: `${n} cliente(s) no nível 3 × 3` };
  },
  ESCOLA: (j) => {
    const n = advogadosDe(j).length;
    return { pontos: 3 * n, detalhe: `${n} advogado(s) × 3` };
  },
  VOLUME: (j) => {
    const n = Math.max(0, j.vencidos.length - 4);
    return { pontos: n, detalhe: `${j.vencidos.length} processo(s) concluído(s); ${n} acima do 4º` };
  },
  GENERALISTA: (j) => {
    const areas = contarPorArea(j).size;
    return { pontos: areas >= 4 ? 6 : 0, detalhe: `${areas} área(s) do direito (precisa de 4)` };
  },
  CASA_CHEIA: (j) => {
    const n = equipeDe(j).length;
    return { pontos: 2 * n, detalhe: `${n} peça(s) na equipe × 2` };
  },
  ESPECIALISTA: (j) => {
    const mapa = contarPorArea(j);
    let melhorArea = null;
    let melhor = 0;
    for (const [area, n] of mapa) if (n > melhor) { melhor = n; melhorArea = area; }
    return {
      pontos: melhor,
      detalhe: melhorArea ? `${melhor} processo(s) de ${melhorArea}` : 'nenhum processo concluído',
    };
  },
  ERUDICAO: (j) => {
    const acima = Math.max(0, j.conhecimento - 3);
    return { pontos: 2 * acima, detalhe: `conhecimento ${j.conhecimento}; ${acima} nível(is) acima do 3º × 2` };
  },
  FOLEGO: (j) => ({ pontos: j.energia, detalhe: `${j.energia} de energia não gasta` }),
  SEM_MANCHAS: (j) => ({
    pontos: j.conduta === 0 ? 5 : 0,
    detalhe: j.conduta === 0 ? 'nenhuma ficha de Conduta' : `${j.conduta} ficha(s) de Conduta`,
  }),
  GRANDES_CAUSAS: (j) => {
    const n = cartasVencidas(j).filter((c) => c.porte === 'G').length;
    return { pontos: 3 * n, detalhe: `${n} causa(s) Grande(s) × 3` };
  },
  BASE_AMPLA: (j) => {
    const todas = FRENTES.every((f) => j.rep[f] >= 2);
    const menor = Math.min(...FRENTES.map((f) => j.rep[f]));
    return { pontos: todas ? 4 : 0, detalhe: `frente mais fraca em ${menor} (precisa de 2)` };
  },
};

/* ------------------------------------------------------------------ *
 * Pontuação de um jogador
 * ------------------------------------------------------------------ */

function pontuarJogador(state, jogador, variante = state.variante) {
  const cfg = state.config;
  const rep = jogador.rep;
  const valores = FRENTES.map((f) => rep[f]);
  const menor = Math.min(...valores);
  const somaFrentes = valores.reduce((a, b) => a + b, 0);

  const linhas = [];

  if (variante === 'exigente') {
