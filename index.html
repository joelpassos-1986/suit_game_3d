              : h('p', { class: 'vazio', texto: 'Nenhum processo aberto.' }))),
        h('div', { class: 'pauta-cartas' }, ...mao.map((id) => {
          const c = CATALOGO.porId[id];
          const temCliente = j.clientes.some((cl) => CATALOGO.porId[cl.cartaId].area === c.area);
          return h('button', { type: 'button', class: 'pauta-carta' + (temCliente ? ' combina' : ''), title: c.nome,
            onclick: () => store.despachar(ac.draftEscolher(j.id, id)) },
            h('img', { src: CENA3D.textura(id), alt: `${c.nome} — ${c.area}` }),
            temCliente ? h('em', { class: 'pauta-selo', texto: `Você tem cliente de ${c.area}: −1 energia` })
              : h('em', { class: 'pauta-selo pauta-selo--neutro', texto: `Sem cliente de ${c.area}` }),
            h('span', { texto: 'Ficar com esta' }));
        })),
        h('p', { class: 'pauta-nota', texto: 'O processo entra na sua mesa com os cubos de prazo. Cada Fechamento tira um; no zero, ele vence sem pagar.' })));
  }

  /* -------------------------------------------------------------- lupa: uma carta da mesa, grande, para estudar */
  function lupa(s, id) {
    const c = CATALOGO.porId[id]; if (!c) return null;
    const ehProcesso = id.startsWith('P');
    let onde = '';
    for (const j of s.jogadores) {
      if (j.carteira.find((x) => x.cartaId === id)) onde = `Na mesa de ${j.nome}, em andamento`;
      else if (j.vencidos.includes(id)) onde = `Concluído por ${j.nome}`;
      else if (j.clientes.find((x) => x.cartaId === id)) onde = `Cliente de ${j.nome} · nível ${j.clientes.find((x) => x.cartaId === id).nivel}`;
    }
    if (!onde && s.mercadoClientes.includes(id)) onde = 'No mercado de clientes';
    const fechar = () => store.atualizarVista({ lupa: null });
    return h('div', { class: 'lupa', onclick: (ev) => { if (ev.target.classList.contains('lupa')) fechar(); } },
      h('div', { class: 'lupa-caixa' },
        h('img', { src: CENA3D.textura(id), alt: c.nome }),
        h('div', { class: 'lupa-texto' },
          h('h3', { texto: c.nome }),
          h('p', { texto: ehProcesso ? `${c.area} · ${c.porte === 'P' ? 'Pequeno' : c.porte === 'M' ? 'Médio' : 'Grande'} · honorário $${c.honorario} · prazo ${c.prazo} anos` : `Cliente · ${c.area}` }),
          ehProcesso ? h('p', { texto: `Exige conhecimento ${c.conhecimento} e ${c.energia} de energia` + (c.exigencia ? ` — ${CATALOGO.exigTexto ? CATALOGO.exigTexto[c.exigencia] || c.exigencia : c.exigencia}` : '') + '.' }) : null,
          onde ? h('p', { class: 'lupa-onde', texto: onde }) : null,
          h('button', { type: 'button', onclick: fechar }, 'Fechar'))));
  }

  /* -------------------------------------------------------------- escolha da peça ao clicar num espaço */
  function aoClicarEspaco(dados, ev) {
    const s = store.estado; if (!s || s.fase !== 'escritorio' || s.pendente || !possoAgir(s)) return;
    const ator = atorDe(s); const j = ator && jogadorPorId(s, ator);
    if (!j || j.bot || dados.ocupado) return;
    const salaId = dados.salaId;
    const sel = store.vista.pecaSelecionada;
    if (sel && j.pecas.find((x) => x.id === sel)) {
      const r = podeAlocar(s, j, sel, salaId);
      if (r.ok) { store.vista.pecaSelecionada = null; store.vista.folhaSalas = false; store.despachar(ac.alocar(j.id, sel, salaId)); }
      else store.atualizarVista({ erro: r.motivo });
      return;
    }
    const livres = pecasLivres(j);
    const porTipo = {};
    for (const p of livres) {
      const r = podeAlocar(s, j, p.id, salaId);
      if (!porTipo[p.tipo] || (r.ok && !porTipo[p.tipo].ok)) porTipo[p.tipo] = { peca: p, ok: r.ok, motivo: r.motivo };
    }
    const legais = Object.values(porTipo).filter((x) => x.ok);
    if (legais.length === 1) { store.despachar(ac.alocar(j.id, legais[0].peca.id, salaId)); return; }
    if (legais.length === 0) {
      const motivo = Object.values(porTipo)[0]?.motivo || 'Nenhuma peça livre.';
      store.atualizarVista({ erro: motivo }); return;
    }
    store.atualizarVista({ escolhaPeca: { salaId, x: ev.clientX, y: ev.clientY, opcoes: Object.values(porTipo) } });
  }

  function seletorDePeca(s) {
    const e = store.vista.escolhaPeca; if (!e) return null;
    const ator = atorDe(s); const j = ator && jogadorPorId(s, ator); if (!j) return null;
    const x = Math.min(e.x, innerWidth - 230), y = Math.min(e.y, innerHeight - 160);
    return h('div', { class: 'seletor', estilo: { left: x + 'px', top: y + 'px' } },
      h('p', { texto: `Quem vai para ${CENA3D.NOME_SALA[e.salaId]}?` }),
      ...e.opcoes.map((o) => h('button', {
        type: 'button', disabled: !o.ok, title: o.ok ? '' : o.motivo,
        onclick: () => { store.vista.escolhaPeca = null; store.despachar(ac.alocar(j.id, o.peca.id, e.salaId)); },
      }, h('i', { estilo: { background: j.cor.hex }, texto: o.peca.tipo === 'titular' ? 'T' : o.peca.tipo === 'advogado' ? 'A' : 'E' }),
        NOME_PECA[o.peca.tipo], !o.ok ? h('small', { texto: ' — ' + o.motivo }) : null)),
      h('button', { type: 'button', class: 'fantasma', onclick: () => store.atualizarVista({ escolhaPeca: null }) }, 'Cancelar'));
  }

  function realcarLegais(s) {
    if (!s || s.fase !== 'escritorio' || s.pendente || !possoAgir(s)) { CENA3D.realcar(null); return; }
    const ator = atorDe(s); const j = ator && jogadorPorId(s, ator);
    if (!j || j.bot) { CENA3D.realcar(null); return; }
    const legais = new Set();
    const sel = store.vista.pecaSelecionada;
    const pecas = sel ? pecasLivres(j).filter((p) => p.id === sel) : pecasLivres(j);
    for (const salaId of Object.keys(s.salas)) {
      for (const p of pecas) { if (podeAlocar(s, j, p.id, salaId).ok) { legais.add(salaId); break; } }
    }
    CENA3D.realcar(legais);
  }

  /* -------------------------------------------------------------- bots (igual à 2D) */
  const RITMO_BOT = 900;
  let temporizadorBot = null;
  const ehBot = (s, id) => { const j = s.jogadores.find((x) => x.id === id); return !!(j && j.bot); };
  function cancelarBot() { if (temporizadorBot) { clearTimeout(temporizadorBot); temporizadorBot = null; } }
  function vezDeUmBot(s) {
    if (!s || s.fase === 'fim' || store.vista.aguardandoPassagem || REDE.souConvidado()) return false;
    const ator = atorDe(s);
    if (!ator || !ehBot(s, ator)) return false;
    if (s.fase === 'fechamento' && !s.pendente) return s.jogadores.every((j) => j.bot);
    return true;
  }
  function dirigirBots(s) {
    cancelarBot();
    if (!vezDeUmBot(s)) return;
    temporizadorBot = setTimeout(() => {
      temporizadorBot = null;
      const atual = store.estado;
      if (!vezDeUmBot(atual)) return;
      let acao = null;
      try {
        acao = atual.fase === 'fechamento' && !atual.pendente ? ac.fecharMes() : jogadaDoBot(atual, atual.config.bot_nivel || 'normal');
      } catch (e) { console.error('[SUIT] o bot não conseguiu decidir:', e); }
      if (acao) store.despachar(acao);
    }, RITMO_BOT);
  }

  function checarPassagem(s) {
    const v = store.vista;
    const ator = atorDe(s);
    const humanos = s.jogadores.filter((j) => !j.bot).length;
    const relevante = !REDE.online() && s.telaDePassagem && humanos > 1 && (s.fase === 'pauta' || s.fase === 'escritorio');
    if (relevante && ator && v.ultimoAtorVisto && ator !== v.ultimoAtorVisto && !ehBot(s, ator)) v.aguardandoPassagem = ator;
    v.ultimoAtorVisto = ator;
  }

  /* -------------------------------------------------------------- render */
  let ultimoAssento = null;
  function renderizar() {
    const raiz = document.getElementById('hud');
    const s = store.estado, v = store.vista;
    raiz.textContent = '';
    cancelarBot();
    document.body.classList.toggle('em-jogo', !!s);

    if (!s) {
      raiz.appendChild(telaCenario());
      const m = renderModal({ pendente: null, jogadores: [], criterios: [], log: [], config: {} });
      if (m) raiz.appendChild(m);
      return;
    }
    if (cenaPronta) {
      CENA3D.sincronizar(s);
      realcarLegais(s);
      // a câmera senta no assento de quem joga (só quando o ator muda e é humano)
      const ator = atorDe(s);
      if (REDE.online()) { const meu = REDE.meuJogadorId(); if (meu && meu !== ultimoAssento) { CENA3D.sentarEm(meu); ultimoAssento = meu; } }
      else if (ator && ator !== ultimoAssento && !ehBot(s, ator)) { CENA3D.sentarEm(ator); ultimoAssento = ator; }
    }

    if (s.fase === 'fim') {
      raiz.appendChild(h('div', { class: 'placar-3d' }, telaPlacar(s)));
      if (v.logAberto) raiz.appendChild(painelLog(s));
      const m = renderModal(s); if (m) raiz.appendChild(m);
      return;
    }

    checarPassagem(s);
    const cel = CEL();
    CENA3D.definirCelular(cel);
    document.body.classList.toggle('celular', cel);
    document.body.classList.toggle('folha-aberta', cel && !!(v.rivaisAbertos || v.menuAberto || v.folhaSalas));
    if (cel) {
      // na minha vez do Escritório a câmera vai para o tabuleiro; a peça selecionada some quando a vez passa
      const ator = atorDe(s);
      if (!possoAgir(s) || s.fase !== 'escritorio') { v.pecaSelecionada = null; v.folhaSalas = false; }
      const chaveVez = ator + ':' + s.fase + ':' + s.rodada;
      if (possoAgir(s) && ator && !ehBot(s, ator) && s.fase === 'escritorio' && v.ultimaVezVista !== chaveVez) {
        v.ultimaVezVista = chaveVez; v.aba = 'tab'; v.rivaisAbertos = false; v.menuAberto = false; CENA3D.irPara(vistaCelular(s, 'tab'));
      }
    }
    raiz.appendChild(h('div', { class: 'hud' }, ...hud(s)));
    if (cel) {
      raiz.appendChild(abasCelular(s));
      const bp = barraDePecas(s); if (bp) raiz.appendChild(bp);
      const fs = folhaDeSalas(s); if (fs) raiz.appendChild(fs);
      if (v.menuAberto) raiz.appendChild(menuCelular(s));
    }
    if (s.fase === 'pauta' && s.draft) { const pd = pauta3d(s); if (pd) raiz.appendChild(pd); }
    if (s.fase === 'fechamento' && s.fechamento) raiz.appendChild(h('div', { class: 'flutuante flutuante--fechamento' }, painelFechamento(s)));
    if (v.rivaisAbertos) raiz.appendChild(h('div', { class: 'flutuante flutuante--rivais' }, renderRivais(s),
      cel ? h('div', { class: 'rivais-camera' }, ...s.jogadores.filter((jj) => !(meuJogador(s) && jj.id === meuJogador(s).id)).map((jj) => h('button', { type: 'button',
        onclick: () => { const m = CENA3D.mesaDe(jj.id); store.vista.rivaisAbertos = false; store.vista.aba = null; if (m) CENA3D.irPara(CENA3D.enquadrar(m.x, m.z, 30, 22, m.rot, 1.2)); store.notificar(); } }, 'Ver mesa · ' + jj.nome))) : null));
    if (v.logAberto) raiz.appendChild(painelLog(s));
    const sel = seletorDePeca(s); if (sel) raiz.appendChild(sel);
    if (v.lupa) raiz.appendChild(lupa(s, v.lupa));
    const modal = (possoAgir(s) || store.vista.modal) ? renderModal(s) : null; if (modal) raiz.appendChild(modal);
    if (v.confirmarNova) raiz.appendChild(h('div', { class: 'veu' }, h('div', { class: 'modal modal--estreito' },
      h('header', null, h('h3', { texto: 'Abandonar a partida?' })),
      h('div', { class: 'corpo' }, h('p', { texto: REDE.souAnfitriao() ? 'A sala será fechada para todo mundo e você volta ao cenário.' : REDE.souConvidado() ? 'Você sai da sala; os outros continuam.' : 'A partida em andamento será apagada e você volta ao cenário.' })),
      h('footer', null,
        h('button', { class: 'btn btn--fantasma', type: 'button', onclick: () => store.atualizarVista({ confirmarNova: false }) }, 'Continuar jogando'),
        h('button', { class: 'btn', type: 'button', onclick: () => { REDE.sair(); store.apagarSalvo(); store.estado = null; store.historico = []; store.vista.confirmarNova = false; ultimoAssento = null; store.notificar(); } }, 'Abandonar')))));
    if (v.aguardandoPassagem) raiz.appendChild(telaPassagem(s, v.aguardandoPassagem));
    if (v.erro) raiz.appendChild(h('div', { class: 'aviso3d', role: 'alert' }, h('span', { texto: v.erro }),
      h('button', { type: 'button', onclick: () => store.atualizarVista({ erro: null }) }, 'ok')));

    const foco = raiz.querySelector('[autofocus]'); if (foco) foco.focus();
    dirigirBots(s);
  }

  /* -------------------------------------------------------------- a rede entra pela store */
  function ligarRede() {
    const despacharLocal = store.despachar.bind(store);
    const salvarLocal = store.salvar.bind(store);
    store.despachar = (acao) => {
      if (REDE.souConvidado()) { REDE.enviarAcao(acao); return store.estado; }
      return despacharLocal(acao);
    };
    store.salvar = () => { if (!REDE.souConvidado()) salvarLocal(); };
    // anfitrião: cada mudança de estado vai para todos
    store.inscrever(() => { if (REDE.souAnfitriao() && store.estado) REDE.difundirEstado(store.estado); });
    REDE.ouvir('acao', (jogadorId, acao) => {
      const s = store.estado; if (!s) return;
      if (atorDe(s) !== jogadorId) { REDE.avisar(jogadorId, 'Não é a sua vez.'); return; }
      despacharLocal(acao);
      if (store.vista.erro) { REDE.avisar(jogadorId, store.vista.erro); store.vista.erro = null; }
    });
    REDE.ouvir('desfazer', (jogadorId) => {
      const topo = store.historico[store.historico.length - 1];
      if (topo && topo.ator === jogadorId && store.podeDesfazer()) store.desfazer();
      else REDE.avisar(jogadorId, 'Nada para desfazer.');
    });
    const receberEstado = (estado) => {
      // O anfitrião reenvia o estado a cada redesenho; se nada mudou no jogo,
      // não apaga o que o convidado está escolhendo num modal (ex.: clientes no Cafezinho).
      const ant = store.estado;
      const mesmoLance = !!ant && (ant.log || []).length === (estado.log || []).length
        && JSON.stringify(ant.pendente || null) === JSON.stringify(estado.pendente || null) && ant.fase === estado.fase;
      store.estado = estado; store.historico = [];
      if (!mesmoLance) { store.vista.escolha = {}; store.vista.modal = null; store.vista.escolhaPeca = null; store.vista.erro = null; }
      store.vista.confirmarNova = false;
      const idx = estado.jogadores.findIndex((j) => j.id === REDE.meuJogadorId());
      CENA3D.definirMeuIdx(Math.max(0, idx));

    REDE.ouvir('sala', () => store.notificar());

    REDE.ouvir('fim', () => { REDE.sair(); store.estado = null; store.historico = []; ultimoAssento = null; store.atualizarVista({ erro: 'O anfitrião encerrou a sala.' }); });
  }

  function ligarTeclado() {
    document.addEventListener('keydown', (ev) => {
      const alvo = ev.target;
      if (alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'TEXTAREA')) return;
      const s = store.estado;
      if (ev.key === 'Escape') {
        if (store.vista.modal) store.atualizarVista({ modal: null });
        else if (store.vista.lupa) store.atualizarVista({ lupa: null });
        else if (store.vista.escolhaPeca) store.atualizarVista({ escolhaPeca: null });
        else if (store.vista.logAberto) store.atualizarVista({ logAberto: false });

      }
      if (!s) return;
      const k = ev.key.toLowerCase();
      if (k === 'z') { store.desfazer(); return; }
      if (k === 'l') { store.atualizarVista({ logAberto: !store.vista.logAberto }); return; }

    });
  }

  function iniciar(TEX, MINI) {
    const canvas = document.getElementById('cena');
    CENA3D.iniciar(canvas, TEX, MINI);
    CENA3D.definirPrazo((id) => (CATALOGO.porId[id] && CATALOGO.porId[id].prazo) || 2);
    CENA3D.ouvir('espaco', aoClicarEspaco);

      const s = store.estado;
      const sala = s && s.salas[d.salaId];
      let quem = '';
      if (d.ocupado && s) {
        const dono = d.ocupado.jogadorId === 'HERDEIRO' ? { nome: 'Dr. Vieira', pecas: [] } : jogadorPorId(s, d.ocupado.jogadorId);
        const p = dono && dono.pecas.find((x) => x.id === d.ocupado.pecaId);
        quem = ' · ' + (p ? NOME_PECA[p.tipo] + ' de ' : '') + dono.nome;
      }
      dica.style.display = 'block'; dica.style.left = e.clientX + 'px'; dica.style.top = e.clientY + 'px';
      dica.textContent = `${CENA3D.NOME_SALA[d.salaId]} · espaço ${d.indice + 1}` + (d.ocupado ? quem : d.legal ? ' · clique para mandar uma peça' : ' · livre');
    });

    ligarRede();
    let tRedim = null; addEventListener('resize', () => { clearTimeout(tRedim); tRedim = setTimeout(() => { if (store.estado) { store.vista.ultimaVezVista = null; store.notificar(); } }, 250); });
    store.inscrever(renderizar);
    ligarTeclado();
    renderizar();
    window.SUIT = store;
  }

  return { iniciar };
})();
